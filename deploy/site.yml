- name: Pre-flight — reach every node, recovering any that are wedged
  hosts: alice_nodes
  gather_facts: false
  become: false
  vars:
    preflight_probe_timeout: 40
    preflight_boot_timeout: 900
    preflight_heavy_services:
      - opensearch
      - opensearch-dashboards
      - alice-metrics
      - alice-trend-rollup
      - alice-signal-projector
      - alice-anomaly-digest
      - alice-notification-ingest
      - alice-ops
      - alice-poison-replay
  tasks:
    - name: Probe the node over SSH
      block:
        - name: Wait briefly for this node to answer
          ansible.builtin.wait_for_connection:
            timeout: "{{ preflight_probe_timeout }}"

      rescue:
        - name: Report the node as unreachable and start recovery
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }} did not answer within
              {{ preflight_probe_timeout }}s. A node that accepts TCP but never
              completes an SSH login is out of memory, not down. Hard-rebooting
              it through OpenStack and taking the memory-heavy services out of
              the way before the roles run.

        - name: Hard-reboot the unreachable node through OpenStack
          openstack.cloud.server_action:
            server: "{{ inventory_hostname }}"
            action: reboot_hard
          delegate_to: localhost
          register: _preflight_reboot
          failed_when: false

        - name: Fail with the reason when the reboot could not be requested
          ansible.builtin.assert:
            that:
              - _preflight_reboot is succeeded
            fail_msg: >-
              {{ inventory_hostname }} is unreachable and the OpenStack reboot
              was refused. This playbook needs ambient OpenStack auth to
              recover a wedged node. On lxplus run `kinit`, then export
              OS_AUTH_URL=https://keystone.cern.ch/v3, OS_AUTH_TYPE=v3fedkerb,
              OS_IDENTITY_PROVIDER=sssd, OS_PROTOCOL=kerberos,
              OS_PROJECT_DOMAIN_ID=default,
              OS_PROJECT_NAME="Personal masladoj". Underlying error:
              {{ _preflight_reboot.msg | default('no message returned') }}

        - name: Wait for the node to finish booting
          ansible.builtin.wait_for_connection:
            delay: 45
            timeout: "{{ preflight_boot_timeout }}"

        - name: Stop the memory-heavy services so the roles get a quiet node
          ansible.builtin.systemd:
            name: "{{ item }}"
            state: stopped
          become: true
          loop: "{{ preflight_heavy_services }}"
          failed_when: false

        - name: Report the node as recovered
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }} is back. Its services stay stopped until
              the roles below restart them, which happens only after the swap
              file and the memory slice are in place.

- name: Quiet the control host before anything heavy runs on it
  hosts: control
  become: true
  vars:
    moved_services:
      - alice-trend-rollup
      - alice-anomaly-digest
    quiesce_services:
      - alice-signal-projector
      - alice-metrics
      - alice-notification-ingest
      - alice-poison-replay
      - alice-ops
  tasks:
    - name: Stop the control-host pollers so the bootstrap does not compete with the previous run's processes
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop: "{{ quiesce_services }}"
      failed_when: false

    - name: Stop and disable the services that now run on the background nodes
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop: "{{ moved_services }}"
      failed_when: false

    - name: Remove their unit files from the control host
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}.service"
        state: absent
      loop: "{{ moved_services }}"
      register: _moved_units

    - name: Reload systemd so the removed units are forgotten
      ansible.builtin.systemd:
        daemon_reload: true
      when: _moved_units is changed

- name: Common host prep (all 5 VMs — workers + storage)
  hosts: alice_nodes
  become: true
  roles:
    - common

- name: OpenSearch cluster — initial bring-up (all 5 nodes together, so a storage-tier manager can be elected)
  hosts: alice_nodes
  become: true
  roles:
    - opensearch

- name: OpenSearch cluster — rolling-safety gate (one node at a time)
  hosts: alice_nodes
  become: true
  serial: 1
  tasks:
    - name: Flush handlers (apply any pending opensearch service restart/reload now, before gating)
      ansible.builtin.meta: flush_handlers

    - name: Wait for this node's OpenSearch HTTP API to accept connections
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ opensearch_http_port }}/_cluster/health?timeout=5s"
        status_code: 200
      register: _os_node_up
      until: _os_node_up.status == 200
      retries: 60
      delay: 5

    - name: Gate — wait for cluster status before releasing the next node in the batch
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ opensearch_http_port }}/_cluster/health?timeout=5s"
        status_code: 200
      register: _os_gate
      until: _os_gate.status == 200 and _os_gate.json.status in ['red', 'yellow', 'green']
      retries: 60
      delay: 5

- name: Alertmanager (control host only, behind the existing nginx seam)
  hosts: control
  become: true
  roles:
    - alertmanager

- name: OpenSearch Dashboards + nginx proxy + cluster bootstrap (control host only)
  hosts: control
  become: true
  vars_files:
    - "{{ playbook_dir }}/group_vars/vault.yml"
  roles:
    - dashboards

- name: Background analytics services (off the control host, one per idle storage node)
  hosts: background
  become: true
  tasks:
    - name: Stage what these services import
      ansible.builtin.include_role:
        name: dashboards
        tasks_from: offload_prep.yml

    - name: Trend rollup service
      ansible.builtin.include_role:
        name: dashboards
        tasks_from: rollup.yml
      when: "'rollup' in background_services"

    - name: Anomaly digest service
      ansible.builtin.include_role:
        name: dashboards
        tasks_from: digest.yml
      when: "'digest' in background_services"

- name: Fluent Bit collector (worker VMs only)
  hosts: workers
  become: true
  roles:
    - collector

- name: Post-collector detection gate (control host only)
  hosts: control
  become: true
  tasks:
    - name: Verify pushed heartbeats and roster-derived absence after collector cutover
      ansible.builtin.include_role:
        name: dashboards
        tasks_from: post_collector.yml

- name: S3-replay producers (worker VMs only)
  hosts: workers
  become: true
  vars_files:
    - "{{ playbook_dir }}/group_vars/vault.yml"
  roles:
    - producer

- name: Final verdict on any gate that was reported but not allowed to stop the run
  hosts: control
  become: false
  gather_facts: false
  tasks:
    - name: Fail the deploy when the signal projector never proved a cycle
      ansible.builtin.fail:
        msg: >-
          Everything else converged, but the signal projector gate is still
          unproven. Its full diagnosis was printed during the Dashboards play,
          under 'Report why the projector produced no heartbeat'. Scroll back to
          that block — it is the only part of this run that needs reading.
      when: projector_gate_failed | default(false) | bool
