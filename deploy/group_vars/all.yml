opensearch_version: "3.7.0"
opensearch_cluster_name: alice-logs

opensearch_heap_size: "1g"

opensearch_http_port: 9200
opensearch_transport_port: 9300

opensearch_data_path: /var/lib/opensearch
opensearch_log_path: /var/log/opensearch

opensearch_cluster_hosts: "{{ groups['alice_nodes'] | map('extract', hostvars, 'ansible_host') | list }}"
opensearch_seed_hosts: "{{ groups['storage'] | map('extract', hostvars, 'ansible_host') | list }}"
opensearch_initial_cluster_manager_nodes: "{{ groups['storage'] | map('extract', hostvars, 'node_id') | list }}"
dashboards_opensearch_hosts: "{{ groups['storage'] | map('extract', hostvars, 'ansible_host') |
  map('regex_replace', '^(.*)$', 'http://\\1:' ~ (opensearch_http_port | string)) | list }}"

dashboards_internal_port: 5602
dashboards_external_port: 5601

infologger_tcp_port: 5170
log_root: /var/log/node
fluent_bit_storage_path: /var/log/flb-storage
fluent_bit_http_port: 2020
fluent_bit_version: "5.0.8"

s3_endpoint: "https://s3.cern.ch"
s3_bucket: epn-backup-logs
s3_region: us-east-1
s3_aws_profile: cern_s3
run_tag: "33NXirFsSfT_38917"
infologger_prefix: "infologger-2026/"

replay_http_port: 8088
node_count: "{{ groups['workers'] | length }}"

cockpit_metrics_index: cockpit-metrics
cockpit_metrics_interval_seconds: 30

replay_clock: preserved

trend_rollup_index: trend-rollup
trend_rollup_bucket_seconds: 600
trend_rollup_settle_seconds: 120
trend_rollup_backfill_buckets: 3
trend_rollup_page_size: 500
trend_rollup_max_entities: 2000
trend_rollup_retention_days: 30
trend_entity_cap_warn: 1800
trend_lag_floor_ms: 250
trend_entry_lag_ceiling_ms: 3600000
trend_min_slice_docs: 50
trend_min_slice_errors: 10
trend_min_lag_docs: 100

anomaly_digest_index: alice-anomalies
anomaly_digest_interval_seconds: 60
anomaly_digest_lookback: now-2h
anomaly_digest_grade_floor: 0
anomaly_digest_retention_days: 14

ad_metrics_window_delay_minutes: 1
ad_log_window_delay_minutes: 2
ad_anomaly_grade_threshold: 0.7
ad_anomaly_confidence_threshold: 0.7

log_rollover_period: "7d"
log_rollover_period_info: "1d"
log_rollover_max_size: "20gb"
log_rollover_migrate_existing: false

ism_retention_generic_info: "8d"
ism_retention_generic_other: "35d"
ism_retention_infologger: "56d"
ism_retention_ad_results: "14d"
ism_retention_alert_history: "30d"

cockpit_metrics_retention_days: 7

dds_replay_rate: 400
il_replay_rate: 500
dds_max_objects: 0
il_max_objects: 15
stdout_max_objects: 0
replay_max_object_bytes: 157286400

producers_venv_path: /opt/alice-ingest/venv
producers_app_root: /opt/alice-ingest/app

s3_access_key_id: "{{ vault_s3_access_key_id }}"
s3_secret_access_key: "{{ vault_s3_secret_access_key }}"
dashboards_basic_auth_user: alice
dashboards_basic_auth_password: "{{ vault_dashboards_basic_auth_password }}"
