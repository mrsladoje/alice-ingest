# Read by the opensearch role and by the dashboards role, which pins the
# matching OpenSearch Dashboards RPM to the same version.
opensearch_version: "3.7.0"

# Read by the opensearch role and by cluster_id below.
opensearch_cluster_name: alice-logs

# The OpenSearch node footprint now lives in roles/opensearch/defaults/main.yml:
# opensearch_heap_size, opensearch_worker_heap_size, opensearch_worker_processors
# and opensearch_worker_index_buffer_size. Heap moved there so the workers group
# assignment in inventory.yml takes effect; group vars outrank role defaults but
# not each other's file, and a copy here silently won.

# The info-tier index settings. Two roles write them: opensearch publishes them
# to each node in opensearch-node.env, and opensearch_bootstrap passes them to
# templates.sh. They stay here because neither role may hold the only copy.
#
# Must stay well under the one-minute detector interval or it is inert. Measure
# the refresh rate before and after; if it does not drop, this value is wrong.
opensearch_info_search_idle_after: "10s"
opensearch_info_translog_sync_interval: "30s"
opensearch_info_merge_threads: 1

# Anomaly detection cost. Backtests take longer and return the same result.
# model_max_size_percent is deliberately not set — lowering it evicts models.
ad_max_batch_task_per_node: 2
ad_batch_task_piece_interval_seconds: 10

# Emergency valve. A rejected search is a detection interval that never ran and
# a rejected write is dropped records, so this is deliberately NOT enforced here.
#
# 95 percent rolling processor use is a genuine emergency on a 128-core EPN
# node and an ordinary paced replay on a 2-vCPU staging VM. monitor_only gives
# the measurement without the rejection: the valve counts what it would have
# rejected and alice-admission-rejections still alarms on it. Set enforced on
# the farm.
#
# Only disabled, monitor_only and enforced parse. AdmissionControlMode.fromName
# throws on anything else, so a wrong name is a 400 on the whole settings PUT.
admission_control_mode: monitor_only
admission_control_cpu_limit: 95

alice_service_memory_high: "256M"
alice_service_memory_max: "512M"

# The projector runs on node-04 rather than the crowded control VM.  Its
# resident set is bounded, but a little larger than the thin pollers because it
# must hold the active incident episode set while it traverses AD results.
# Its memory bounds are role defaults, in roles/signal_projector.
signal_projector_host: "{{ groups['projector'][0] }}"

# Both ports are declared here, not only in roles/opensearch/defaults/main.yml,
# because the discovery lists below read them out of hostvars — and hostvars
# holds group and host variables, never a role default. An inventory host entry
# outranks this file, which is how three containers on one machine each get
# their own pair.
opensearch_http_port: 9200
opensearch_transport_port: 9300

# opensearch_data_path and opensearch_log_path stay in the role's defaults.
# Nothing outside that role reads them.

# Distinct addresses, because three storage nodes may share one machine and one
# IP. The list feeds firewalld source rules, where a repeat is a duplicate rule.
opensearch_cluster_hosts: "{{ groups['alice_nodes'] | map('extract', hostvars, 'ansible_host') | unique | list }}"

# address:port, not address. Nodes that share an IP are only distinguishable to
# discovery by their transport port.
opensearch_seed_hosts: "{{ groups['storage'] | map('extract', hostvars, 'ansible_host') | list |
  zip(groups['storage'] | map('extract', hostvars, 'opensearch_transport_port') | list) |
  map('join', ':') | list }}"
opensearch_initial_cluster_manager_nodes: "{{ groups['storage'] | map('extract', hostvars, 'node_id') | list }}"

# The instance identity the opensearch role builds its container name, unit
# name and per-instance paths from. It is node_id, resolved here because a role
# default must never name an inventory variable it does not declare.
opensearch_instance_id: "{{ node_id }}"

# The worker node identities the bootstrap writes a per-node index template and
# retention policy for. Resolved here so opensearch_bootstrap names no inventory
# group of its own.
opensearch_bootstrap_worker_node_ids: "{{ groups['workers'] | map('extract', hostvars, 'node_id') | list }}"

# The same worker node identities, under the name the cockpit_metrics,
# anomaly_detection and alice_ops roles read. Resolved here for the same reason:
# a role default must never name an inventory group.
fleet_collector_node_ids: "{{ groups['workers'] | map('extract', hostvars, 'node_id') | list }}"

# The remaining inventory-derived values the split roles read. Each one replaces
# an expression that used to sit inside a task file or a systemd unit template.
worker_inventory_names: "{{ groups['workers'] | list }}"
worker_replay_trigger_urls: "{{ groups['workers'] | map('extract', hostvars, 'ansible_host') |
  map('regex_replace', '^(.*)$', 'http://\\1:' ~ (replay_http_port | string)) | list }}"
worker_replay_endpoints: "{{ groups['workers'] |
  zip(groups['workers'] | map('extract', hostvars, 'ansible_host') | list) |
  map('join', '=http://') |
  map('regex_replace', '^(.*)$', '\\1:' ~ (replay_http_port | string)) | list }}"
worker_fault_agent_endpoints: "{{ groups['workers'] |
  zip(groups['workers'] | map('extract', hostvars, 'ansible_host') | list) |
  map('join', '=http://') |
  map('regex_replace', '^(.*)$', '\\1:' ~ (fault_agent_port | string)) | list }}"
signal_projector_address: "{{ hostvars[signal_projector_host].ansible_host }}"
alertmanager_host_address: "{{ hostvars[groups['control'][0]].ansible_host }}"
shifter_allowed_client_addresses: "{{ (groups['workers'] + groups['control']) |
  map('extract', hostvars, 'ansible_host') | unique | list }}"

# The control host is the only client of the fault agents and of the replay
# triggers, so both roles take the same one-address list. Kept separate from
# alertmanager_host_address, which happens to resolve to the same host but
# means "where Alertmanager runs", not "who is allowed to call in".
control_host_address: "{{ hostvars[groups['control'][0]].ansible_host }}"
fault_agent_allowed_client_addresses: "{{ [control_host_address] }}"
producer_allowed_client_addresses: "{{ [control_host_address] }}"

# Which services this node's fault agent may stop and start. A node may fault
# only the service it owns: a worker its Fluent Bit, the projector host its
# signal projector. Nothing else is reachable that way. Resolved here, per
# host, because a role default must never name an inventory group.
fault_agent_services: "{{ (['fluent-bit'] if inventory_hostname in groups['workers'] else []) +
  (['alice-signal-projector'] if inventory_hostname == signal_projector_host else []) }}"

dashboards_opensearch_hosts: "{{ groups['storage'] | map('extract', hostvars, 'ansible_host') | list |
  zip(groups['storage'] | map('extract', hostvars, 'opensearch_http_port') | list) |
  map('join', ':') | map('regex_replace', '^(.*)$', 'http://\\1') | list }}"

dashboards_internal_port: 5602
dashboards_external_port: 5601

common_open_tcp_ports: "{{ [dashboards_external_port] if inventory_hostname in groups['control'] else [] }}"

infologger_tcp_port: 5170
log_root: /var/log/node

# The live lane. README section 9, Item 7.
shifter_enabled: true
shifter_host: "{{ hostvars[groups['shifter'][0]].ansible_host }}"
shifter_port: 8092
shifter_ingest_path: /ingest

s3_endpoint: "https://s3.cern.ch"
s3_bucket: epn-backup-logs
s3_region: us-east-1
s3_aws_profile: cern_s3
run_tag: "33NXirFsSfT_38917"
infologger_prefix: "infologger-"

replay_http_port: 8088
node_count: "{{ groups['workers'] | length }}"

# The fault agent is how the control host injects a physical failure it cannot
# reach any other way: a worker's Fluent Bit, a worker's CPUs, the signal
# projector on its own node. It runs on the workers and the projector host,
# accepts only the services listed in its role defaults, and is firewalled to
# the control host. Set a token to require one on every call.
fault_agent_port: 8089
fault_agent_token: ""
fault_agent_cpu_stress_max_seconds: 5400

cockpit_metrics_index: cockpit-metrics
cockpit_metrics_interval_seconds: 30

# preserved keeps the archive's own event times, which is what production does
# and what the replay is supposed to imitate. shifted slides every event
# timestamp forward by one constant offset so @timestamp lands near now.
#
# shifted is NOT needed for detection. All 17 detectors key on collector_time or
# @timestamp of a metrics document, both stamped as the record passes through
# this stack, so they already see a live stream under preserved. What shifted
# does instead is destroy the one measurement that needs the original times:
# enter_system_lag_ms is collector_time - @timestamp, i.e. EPN -> collector
# latency, and rewriting @timestamp collapses it to a constant. The four
# *-entry-lag detectors then train on that constant. The month-scale latency
# guard in the detectors exists precisely so preserved is safe in replay.
#
# A constant offset also preserves the archive's span: shifting the earliest
# event to now pushes the newest months into the future, out of every cockpit
# time window that ends at 'now'.
#
# make replay-shifted overrides this when near-now @timestamps are wanted.
replay_clock: preserved

trend_rollup_index: trend-rollup

anomaly_grade_floor: 0.5

cluster_id: "{{ opensearch_cluster_name }}"
fleet_roster_index: cockpit-fleet
lane_state_index: alice-lane-state
signals_index: alice-signals
incidents_index: alice-incidents
notifications_index: alice-notifications

# The one host allowed to scrape a worker's Fluent Bit metrics port. Resolved
# here, beside the other seven inventory-derived values, so the collector role
# never has to name an inventory group of its own.
collector_metrics_scrape_source: "{{ hostvars[groups['control'][0]].ansible_host }}"

# A collector-role switch, read by the post-collector verification in the
# cockpit_metrics role. It stays here rather than inside either role, because
# neither role is the place a reader would look for it.
collector_health_push_enabled: true

health_metrics_emit_legacy_node: false

alerting_max_actionable_alert_count: 50

alertmanager_port: 9093
alertmanager_allowed_client_addresses:
  - "{{ hostvars[signal_projector_host].ansible_host }}"
notification_ingest_port: 8091
notification_ingest_token: ""

alertmanager_resolve_timeout: 5m

alertmanager_group_wait: 5m
alertmanager_group_interval: 10m
alertmanager_repeat_interval: 4h

alertmanager_page_group_wait: 30s
alertmanager_page_group_interval: 2m

# One declaration per causal edge; its proven flag decides whether it explains
# or suppresses. Replaced alertmanager_proven_inhibit_rules. README section 9.
causal_edges_file: "{{ playbook_dir }}/../roles/alice_runtime/files/causal_edges.json"
alertmanager_page_wait_covers_inhibition: false

# Primaries for the two storage-tier log families. The farm value is one per
# storage node, which spreads the bulk fan-out instead of funnelling it through
# whichever node holds the single primary.
#
# It is pinned to 1 here because on THIS tier shard budget is the binding
# constraint, not disk: ~20 shards per GB of heap, so ~60 across three 1 GB
# nodes. At 3 primaries the two families reach ~135 shards at full retention,
# and that is the documented reason they were dropped to 1 in the first place.
#
# Raise this to "{{ groups['storage'] | length }}" when the storage tier has
# real heap. Shard count is fixed at index creation, so the change lands at the
# next rollover with no reindex.
log_primary_shards_storage: 1

log_rollover_period: "7d"

# DO NOT SHORTEN. At 200 boxes this is already ~1600 indices and shards; a
# shorter period is the one setting here that breaks the design at farm scale.
log_rollover_period_info: "1d"
log_rollover_max_size: "20gb"
log_rollover_migrate_existing: false

ism_retention_application_local: "8d"
ism_retention_application_central: "35d"
ism_retention_infologger: "56d"
ism_retention_ad_results: "14d"
ism_retention_alert_history: "30d"

# The in-cluster action log behind the alice-alert-actions write alias. It is
# write-only — no monitor, dashboard or service reads it — so it had no bound of
# any kind until this policy existed. A quiet cluster writes almost nothing; a
# fleet-wide trend storm is the load case, at roughly 200 hosts x 9 trend
# monitors x 2 fires an hour x a few hundred bytes, so tens of MB a day on a
# tier where disk is already a paged alert. Matched to alert history, because
# the two record the same fires by different routes.
ism_retention_alert_actions: "30d"
alert_actions_rollover_period: "7d"
alert_actions_rollover_max_size: "1gb"

# The alice-service paths and unit names that more than one role, or a playbook
# under playbooks/, has to agree on. A name is here only when a second reader
# exists; everything read by exactly one role is that role's own default.
#
# Shared with the opensearch_bootstrap role, which writes templates.sh, ism.sh
# and register_node.sh into the same directory and creates it with the same
# owner, group and mode.
alice_bootstrap_root: /opt/alice-ingest/init
alice_app_root: /opt/alice-ingest

alice_bootstrap_signal_catalog: "{{ alice_bootstrap_root }}/signal_catalog.json"
alice_bootstrap_causal_edges: "{{ alice_bootstrap_root }}/causal_edges.json"
alice_bootstrap_verify_script: "{{ alice_bootstrap_root }}/verify_detection.py"

alice_os_cursor_script: /opt/alice-ingest/os_cursor.py
alice_signal_identity_script: /opt/alice-ingest/signal_identity.py
cockpit_metrics_discover_roster_script: /opt/alice-ingest/discover_roster.py
anomaly_detection_backtest_script: /opt/alice-ingest/backtest.py
alice_ops_reset_derived_script: /opt/alice-ingest/reset_derived.py
alice_ops_poison_replay_script: /opt/alice-ingest/poison_replay.py

cockpit_metrics_service_name: alice-metrics
trend_rollup_service_name: alice-trend-rollup
signal_projector_service_name: alice-signal-projector
signal_projector_notification_ingest_service_name: alice-notification-ingest
alice_ops_service_name: alice-ops
alice_ops_inject_service_name: alice-inject
alice_ops_poison_replay_service_name: alice-poison-replay

ops_internal_port: 8090

# Literal paths, not references to the alice_ops role's state directories. The
# playbooks that read them load no role, so a reference would be undefined.
# They must stay equal to {{ alice_ops_inject_state_dir }}/status.json,
# /request.json and {{ alice_ops_poison_replay_state_dir }}/status.json, /runs.
alice_ops_inject_status: /var/lib/alice-inject/status.json
alice_ops_inject_request: /var/lib/alice-inject/request.json
alice_ops_poison_replay_status: /var/lib/alice-poison-replay/status.json
alice_ops_poison_replay_report_dir: /var/lib/alice-poison-replay/runs

# The counts verify_detection.py asserts. They are read by the anomaly_detection
# and signal_projector roles, but they count JSON files owned by the
# alerting_monitors and anomaly_detection roles: add a monitor or a detector
# there and the matching number here has to change with it.
expected_monitors: 28
expected_detectors: 17
expected_forecasters: 1

# Set by the signal_projector role's rescue path and read by the final play of
# site.yml, which turns it into the deploy's exit code.
projector_gate_failed: false

# Replay pacing. The defaults are baked into the alice-replay unit, so they are
# what the ops page's replay button gets — that button POSTs straight at the
# worker trigger and never goes through Ansible.
#
# The default is PACED: the archive is stretched over roughly an hour so the log
# detectors get the 32 consecutive one-minute windows an RCF model needs before
# it can leave Initializing. A ten-minute load only ever offers ten. Nothing
# about the data changes — only how many distinct one-minute windows contain it.
#
# This is what the ops page button runs, deliberately: the paced path is the
# one that has to work, so it is the one that gets exercised. The _fast rates
# are the old ten-minute dump, reachable only via `make replay-fast`.
#
# Measured basis: ~338k InfoLogger rows parsed per worker and ~73k tarball lines
# per worker, so 338000/3600 ~= 94 rows/s, and 73000 split over two families
# /3600 ~= 10 lines/s each. Re-derive if il_max_objects or run_tag changes.
il_replay_rate: 94
dds_replay_rate: 10
stdout_replay_rate: 10

il_replay_rate_fast: 500
dds_replay_rate_fast: 400
stdout_replay_rate_fast: 400

# Cache for the shifted-clock scan. The earliest event in the archive never
# changes, so it is found once and reused; without this every load re-streams
# whole DDS tarballs out of S3 before shipping its first record.
replay_clock_cache: /var/log/node/.replay-earliest-event

dds_max_objects: 0
il_max_objects: 15
stdout_max_objects: 0
replay_max_object_bytes: 157286400

# When true, the replay starts over as soon as it finishes, re-sampling the
# shifted-clock offset each pass, so collector_time never stalls and the
# detectors stay Running indefinitely. Off by default: a looping replay never
# returns, which is wrong for a one-shot data load.
replay_loop: false
replay_loop_pause_seconds: 30

# Controlled detector calibration. poison-replay waits for the real paced S3
# replay to train every one-minute detector, then injects labelled outliers into
# already-modelled entities. It never targets the 30-minute detector lane.
# The rest of its pacing is in roles/alice_ops/defaults/main.yml; this one is
# here because playbooks/poison_replay.yml prints it.
poison_warmup_timeout_seconds: 4200

producers_venv_path: /opt/alice-ingest/venv
producers_app_root: /opt/alice-ingest/app

# Site override: this repository holds the one PRESERVED copy of the replay
# engine at images/replay/replay.py, which docker-compose.yml also builds from.
# Drop this line when the producer role is extracted with its own files/copy.
producer_replay_source: "{{ playbook_dir }}/../../images/replay/replay.py"

s3_access_key_id: "{{ vault_s3_access_key_id }}"
s3_secret_access_key: "{{ vault_s3_secret_access_key }}"
