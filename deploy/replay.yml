- name: Wipe log indices before a fresh replay (only when replay_fresh=true)
  hosts: control
  become: true
  gather_facts: false
  vars:
    bootstrap_root: /opt/alice-ingest/init
  tasks:
    - name: Delete the backing indices of every log family (the family names are rollover write aliases, not indices)
      ansible.builtin.uri:
        url: "http://localhost:{{ opensearch_http_port }}/{{ item }}?ignore_unavailable=true&allow_no_indices=true"
        method: DELETE
        status_code: [200, 404]
      loop: "{{ ['infologger-*', 'generic-log-other-*']
                + (groups['workers']
                   | map('extract', hostvars, 'node_id')
                   | map('regex_replace', '^(.*)$', 'generic-log-info-\\1-*')
                   | list) }}"
      when: replay_fresh | default(false) | bool

    - name: Re-create the rollover write aliases, templates and mappings (no bootstrap seed — no detector is created or updated here)
      ansible.builtin.command:
        cmd: "{{ bootstrap_root }}/templates.sh"
      environment:
        OS_URL: "http://localhost:{{ opensearch_http_port }}"
        SEED_EMPTY_INDICES: "false"
      changed_when: true
      when: replay_fresh | default(false) | bool

- name: Trigger the S3 replay on every worker
  hosts: workers
  become: true
  gather_facts: false
  vars:
    # paced (default) stretches the archive over ~1h so the log detectors get
    # the 32 consecutive one-minute windows they need; fast is the old
    # ten-minute dump, for when you only want the data loaded.
    replay_pace: paced
    _fast: "{{ replay_pace == 'fast' }}"
    _il_rate: "{{ il_replay_rate_fast if _fast | bool else il_replay_rate }}"
    _dds_rate: "{{ dds_replay_rate_fast if _fast | bool else dds_replay_rate }}"
    _stdout_rate: "{{ stdout_replay_rate_fast if _fast | bool else stdout_replay_rate }}"
  tasks:
    - name: Refuse an unknown replay_pace rather than silently running full speed
      ansible.builtin.assert:
        that: replay_pace in ['paced', 'fast']
        fail_msg: "replay_pace must be 'paced' or 'fast', got '{{ replay_pace }}'"


    - name: Ensure alice-replay clock drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/{{ producer_service_name | default('alice-replay') }}.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install alice-replay clock, pace and loop drop-in
      ansible.builtin.copy:
        dest: /etc/systemd/system/{{ producer_service_name | default('alice-replay') }}.service.d/clock.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          Environment=REPLAY_CLOCK={{ replay_clock | default('preserved') }}
          Environment=IL_REPLAY_RATE={{ _il_rate }}
          Environment=DDS_REPLAY_RATE={{ _dds_rate }}
          Environment=STDOUT_REPLAY_RATE={{ _stdout_rate }}
          Environment=REPLAY_LOOP={{ replay_loop | string | lower }}
          Environment=REPLAY_LOOP_PAUSE_SECONDS={{ replay_loop_pause_seconds }}

    - name: Restart alice-replay with the selected clock mode
      ansible.builtin.systemd:
        name: "{{ producer_service_name | default('alice-replay') }}"
        state: restarted
        daemon_reload: true

    - name: POST /replay to the local alice-replay trigger
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ replay_http_port }}/replay?family={{ replay_families | default('infologger,dds,stdout') }}"
        method: POST
        status_code: [202, 409]
        return_content: true
      register: _replay
      retries: 15
      delay: 2
      until: _replay.status in [202, 409]

    - name: Report the trigger result for this worker
      ansible.builtin.debug:
        msg: >-
          {{ node_id }} ({{ inventory_hostname }})
          clock={{ replay_clock | default('preserved') }}
          pace={{ replay_pace }}
          (il={{ _il_rate }}/s dds={{ _dds_rate }}/s stdout={{ _stdout_rate }}/s)
          loop={{ replay_loop | string | lower }}
          -> HTTP {{ _replay.status }}: {{ _replay.content }}
