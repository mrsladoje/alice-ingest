[defaults]
# Playbooks live in playbooks/. From this directory:
#   ansible-playbook playbooks/site.yml
inventory        = inventory.yml,inventory.generated.yml
roles_path        = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback   = default
timeout           = 20

[selinux]
special_context_filesystems = fuse,nfs,vboxsf,ramfs,9p,vfat,afs

[ssh_connection]
pipelining = True
