- name: Report the offloaded control-plane services from the nodes that now run them
  hosts: background
  become: true
  gather_facts: false
  vars:
    background_status_services: >-
      {{ ([dashboards_trend_rollup_service_name] if 'rollup' in background_services else [])
         + ([dashboards_signal_projector_service_name]
            if inventory_hostname in groups['projector'] else []) }}
  tasks:
    - name: Check this node's background services
      ansible.builtin.command:
        argv: "{{ ['systemctl', 'is-active'] + background_status_services }}"
      register: _background
      changed_when: false
      failed_when: false

    - name: Print the background service states
      ansible.builtin.debug:
        msg: "{{ background_status_services | zip(_background.stdout_lines) | map('join', ' = ') | list }}"

    - name: Read the recent journal of this node's background services
      ansible.builtin.command:
        argv:
          - journalctl
          - -u
          - "{{ item }}"
          - --since
          - "5 minutes ago"
          - --no-pager
          - -o
          - cat
      loop: "{{ background_status_services }}"
      register: _background_log
      changed_when: false
      failed_when: false

    - name: Print recent functional failures (an empty list is healthy)
      ansible.builtin.debug:
        msg: >-
          {{ item.item }} failures =
          {{ item.stdout_lines | default([])
             | select('search', 'cycle failed|FATAL|Permission denied')
             | list }}
      loop: "{{ _background_log.results }}"
      loop_control:
        label: "{{ item.item }}"

- name: Report live detection-layer status from the control node
  hosts: control
  become: true
  gather_facts: false
  vars:
    cockpit_status_services:
      - "{{ dashboards_metrics_service_name }}"
      - "{{ dashboards_notification_ingest_service_name }}"
      - "{{ dashboards_ops_service_name }}"
  tasks:
    - name: Check the cockpit services
      ansible.builtin.command:
        argv: "{{ ['systemctl', 'is-active'] + cockpit_status_services }}"
      register: _services
      changed_when: false
      failed_when: false

    - name: Print the service states
      ansible.builtin.debug:
        msg: "{{ cockpit_status_services | zip(_services.stdout_lines)
                 | map('join', ' = ') | list }}"

    - name: Read every replay worker's functional state
      ansible.builtin.uri:
        url: "http://{{ hostvars[item].ansible_host }}:{{ replay_http_port }}/replay-status"
        return_content: true
        status_code: 200
      loop: "{{ groups['workers'] }}"
      register: _replay_states
      changed_when: false
      failed_when: false

    - name: Print the replay worker states
      ansible.builtin.debug:
        msg: >-
          {{ item.item }} =
          running={{ (item.json | default({})).get('running', 'unreachable') }}
          loop={{ (item.json | default({})).get('loop', 'unknown') }}
          collector={{ (item.json | default({})).get('collector', 'unknown') }}
      loop: "{{ _replay_states.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read every fault agent's health
      ansible.builtin.uri:
        url: "http://{{ hostvars[item].ansible_host }}:{{ fault_agent_port }}/health"
        headers:
          X-Fault-Token: "{{ fault_agent_token }}"
        return_content: true
        status_code: 200
      loop: "{{ (groups['workers'] + [signal_projector_host]) | unique }}"
      register: _fault_agents
      changed_when: false
      failed_when: false

    - name: Print the fault agent states
      ansible.builtin.debug:
        msg: >-
          {{ item.item }} =
          {{ 'unreachable — the /ops injection button and make inject cannot
             reach this node'
             if (item.json | default({})).get('ok') is not true
             else 'ready, may fault ' ~
                  ((item.json.allowed_services | join(', ')) or 'nothing') ~
                  ', cpu_stress=' ~ item.json.cpu_stress }}
      loop: "{{ _fault_agents.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read the last fault-injection run
      ansible.builtin.slurp:
        src: "{{ dashboards_inject_status }}"
      register: _inject_state
      changed_when: false
      failed_when: false

    - name: Print the last fault-injection run
      ansible.builtin.debug:
        msg: >-
          {{ 'no injection has run on this control node yet'
             if _inject_state.content is not defined
             else 'injection ' ~ (_last.state | default('unknown')) ~ ' · ' ~
                  (_last.scenario | default('?')) ~ ' · scorecard ' ~
                  (_last.verdict | default('not scored')) }}
      vars:
        _last: "{{ (_inject_state.content | default('e30=') | b64decode
                    | from_json) }}"

    - name: Run the detection status probe
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/../roles/anomaly_detection/files/detection_status.py"
        executable: /usr/bin/python3
      environment:
        OS_URL: "http://localhost:{{ opensearch_http_port }}"
        OSD_URL: "http://127.0.0.1:{{ dashboards_internal_port }}"
        SIGNALS_INDEX: "{{ signals_index }}"
        INFO_NODES: "{{ groups['workers'] | map('extract', hostvars, 'node_id') | join(',') }}"
      register: _status
      changed_when: false

    - name: Print it
      ansible.builtin.debug:
        msg: "{{ _status.stdout_lines }}"
