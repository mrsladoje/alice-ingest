- name: Run historical analysis over the replayed window
  hosts: control
  become: true
  gather_facts: false
  vars:
    # Empty means every detector whose index is not cockpit-metrics — the
    # metrics detectors already run in real time and need no backtest.
    backtest_detectors: ""
    backtest_timeout_minutes: 45
    backtest_max_window_hours: 24
  tasks:
    - name: Run the backtest
      ansible.builtin.command:
        cmd: "python3 {{ anomaly_detection_backtest_script }}"
      environment:
        OS_URL: "http://localhost:{{ opensearch_http_port }}"
        SIGNAL_CATALOG: "{{ alice_bootstrap_signal_catalog }}"
        GRADE_FLOOR: "{{ anomaly_grade_floor }}"
        DETECTORS: "{{ backtest_detectors }}"
        TIMEOUT_MINUTES: "{{ backtest_timeout_minutes }}"
        MAX_WINDOW_HOURS: "{{ backtest_max_window_hours }}"
      register: _backtest
      changed_when: true
      failed_when: _backtest.rc != 0

    - name: Print the backtest report
      ansible.builtin.debug:
        msg: "{{ _backtest.stdout_lines }}"
