- name: Fault injection — the calibration data for grouping, inhibition and group_wait
  hosts: control
  become: true
  gather_facts: false
  vars:
    scenario: kill-fluent-bit
    target_worker: "{{ groups['workers'][0] }}"
    observe_minutes: 45
    independent_entity: ""
    restore: true

  # One engine, two front doors. This play arms and follows the same
  # alice-inject run that the /ops page's injection button starts, so a
  # scorecard never depends on which door it came through. The run itself
  # lives on the control VM: it outlives this SSH session, and the physical
  # steps it cannot take locally (a worker's Fluent Bit, a worker's CPUs, the
  # projector on its own node) go through that node's fault agent.
  tasks:
    - name: Refuse an unknown scenario
      ansible.builtin.assert:
        that:
          - scenario in ['kill-fluent-bit', 'drop-epn-stream',
                         'cpu-stress-worker', 'stop-alice-metrics',
                         'stop-projector', 'replay-end', 'observe-only']
        fail_msg: >-
          scenario must be one of the S3 injections: kill-fluent-bit,
          drop-epn-stream, cpu-stress-worker, stop-alice-metrics,
          stop-projector, replay-end, observe-only

    - name: drop-epn-stream needs the host it is supposed to silence
      ansible.builtin.assert:
        that:
          - independent_entity | length > 0
        fail_msg: >-
          pass -e independent_entity=epnNNN. That host is what the scenario
          silences and what independent-event recall is then scored against;
          without it the run cannot establish the metric it exists for.
      when: scenario == 'drop-epn-stream'

    - name: Check whether a run is already in flight
      ansible.builtin.command:
        cmd: "systemctl is-active {{ dashboards_inject_service_name }}"
      register: _inject_active
      changed_when: false
      failed_when: false

    - name: Refuse to start a second injection on top of a running one
      ansible.builtin.assert:
        that:
          - _inject_active.stdout.strip() != 'active'
        fail_msg: >-
          {{ dashboards_inject_service_name }} is already running. Two faults
          at once make every metric on the scorecard unattributable. Follow
          the running one on the /ops page, or stop it with
          `systemctl stop {{ dashboards_inject_service_name }}` first.

    - name: Write the injection request the engine reads
      ansible.builtin.copy:
        content: "{{ _inject_request | to_nice_json }}\n"
        dest: "{{ dashboards_inject_request }}"
        owner: root
        group: root
        mode: "0640"
      vars:
        _inject_request:
          scenario: "{{ scenario }}"
          observe_minutes: "{{ observe_minutes | int }}"
          target_worker: "{{ target_worker }}"
          independent_entity: "{{ independent_entity }}"
          restore: "{{ restore | bool }}"
          strict: "{{ injection_strict | default(true) | bool }}"
          requested_by: make-inject

    - name: Start the run
      ansible.builtin.systemd:
        name: "{{ dashboards_inject_service_name }}"
        state: started
        daemon_reload: true

    - name: Announce
      ansible.builtin.debug:
        msg: >-
          scenario={{ scenario }} target={{ target_worker }}
          observe={{ observe_minutes }}m — every threshold downstream is a
          percentage or a delay over storm behaviour, so this run is the
          measurement, not a smoke test. It injects, observes, restores and
          scores on the control VM; this play only follows it. Interrupting
          this play leaves the run going — follow it on the /ops page.

    - name: Follow the run until it injects, observes, restores and scores
      ansible.builtin.slurp:
        src: "{{ dashboards_inject_status }}"
      register: _inject_status
      until: >-
        (_inject_status.content | b64decode | from_json).state
        in ['done', 'failed', 'stopped']
      retries: "{{ ((observe_minutes | int) * 4) + 120 }}"
      delay: 15

    - name: Keep the finished status for the tasks below
      ansible.builtin.set_fact:
        _inject_final: "{{ _inject_status.content | b64decode | from_json }}"

    - name: Print the run log
      ansible.builtin.debug:
        msg: "{{ _inject_final.lines | default([]) }}"

    - name: Fail when the run never reached its scorecard
      ansible.builtin.fail:
        msg: >-
          The injection did not complete: state={{ _inject_final.state }}.
          {{ _inject_final.error | default('The run log above says where it
          stopped.') }}
      when: _inject_final.state == 'failed'

    - name: Print the scorecard (copy it into deploy/README.md § Calibration)
      ansible.builtin.debug:
        msg: "{{ _inject_final.report }}"

    - name: Print the seven-metric summary
      ansible.builtin.debug:
        msg: "{{ _inject_final.summary | default([]) }}"

    - name: Fail when the injected component could not be restored
      ansible.builtin.fail:
        msg: >-
          The scorecard was produced, but restoring the injected component
          failed: {{ _inject_final.restore_error }}. Put it back by hand
          before the next run, or the next scorecard measures this fault too.
      when: _inject_final.restore_error | default('') | length > 0

    - name: Fail on the scorecard
      ansible.builtin.fail:
        msg: >-
          Scorecard FAILED — {{ _inject_final.failures | join(' / ') }}.
          Pass -e injection_strict=false to report without gating.
      when: _inject_final.verdict == 'failed'
