- name: Tear down the 5 CERN OpenStack VMs for alice-ingest (2 worker + 3 storage)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    os_image: b5e094ad-88a9-4f78-8211-06532cdf492c   # "ALMA9 - x86_64"
    dashboards_security_group: dashboards
    _dashboards_port: "{{ dashboards_external_port | default(5601) }}"

  tasks:
    - name: "Pre-flight — cheap authenticated API call (look up the ALMA9 image)"
      openstack.cloud.image_info:
        image: "{{ os_image }}"
      register: _auth_check
      ignore_errors: true

    - name: "Pre-flight — fail fast if OpenStack auth is not working"
      ansible.builtin.assert:
        that:
          - _auth_check is succeeded
          - (_auth_check.images | default([]) | length) > 0
        success_msg: "OpenStack auth OK — able to query project resources."
        fail_msg: >-
          OpenStack authentication failed. This playbook needs ambient
          OpenStack auth already established in the environment it runs in.
          On lxplus: run `kinit`, then export
          OS_AUTH_URL=https://keystone.cern.ch/v3, OS_AUTH_TYPE=v3fedkerb,
          OS_IDENTITY_PROVIDER=sssd, OS_PROTOCOL=kerberos,
          OS_PROJECT_DOMAIN_ID=default,
          OS_PROJECT_NAME="Personal masladoj" (see docs/OPENSTACK_GUIDE.md
          section 1). From a Mac outside CERN, use an application credential
          instead (same doc). Underlying error (if any):
          {{ _auth_check.msg | default('image lookup returned no results') }}

    - name: "Delete the alice-ingest VMs (idempotent — missing servers are not an error)"
      openstack.cloud.server:
        state: absent
        name: "{{ item }}"
        wait: true
        timeout: 300
      loop: "{{ groups['alice_nodes'] }}"

    - name: "Re-close 5601 by removing the Dashboards security group's ingress rule on tcp/{{ _dashboards_port }}"
      openstack.cloud.security_group_rule:
        state: absent
        security_group: "{{ dashboards_security_group }}"
        protocol: tcp
        port_range_min: "{{ _dashboards_port }}"
        port_range_max: "{{ _dashboards_port }}"
        direction: ingress
        remote_ip_prefix: 0.0.0.0/0
      register: _remove_dashboards_ingress_rule 
      failed_when:
        - _remove_dashboards_ingress_rule is failed
        - "'not found' not in (_remove_dashboards_ingress_rule.msg | default('') | lower)"

    - name: "Remove the Dashboards security group: {{ dashboards_security_group }}"
      openstack.cloud.security_group:
        state: absent
        name: "{{ dashboards_security_group }}"

    - name: "Remove local inventory.generated.yml"
      ansible.builtin.file:
        path: "{{ playbook_dir }}/inventory.generated.yml"
        state: absent
