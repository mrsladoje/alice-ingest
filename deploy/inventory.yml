all:
  vars:
    ansible_user: root

  children:

    alice_nodes:
      children:
        workers:
          vars:
            node_tier: worker
            # m2.medium has 3.75 GB in total, so the farm's 2g worker heap
            # would take memory Fluent Bit and the replay producer need. Raise
            # this to opensearch_worker_heap_size on real hardware.
            opensearch_heap_size: "1g"
          hosts:
            alice-ingest-1:
              ansible_host: 203.0.113.11
              node_id: node-01
              epn_partition: 0
            alice-ingest-2:
              ansible_host: 203.0.113.12
              node_id: node-02
              epn_partition: 1
        storage:
          vars:
            node_tier: storage
          hosts:
            alice-ingest-3:
              ansible_host: 203.0.113.13
              node_id: node-03
              opensearch_heap_size: "1g"
            alice-ingest-4:
              ansible_host: 203.0.113.14
              node_id: node-04
            alice-ingest-5:
              ansible_host: 203.0.113.15
              node_id: node-05

    control:
      hosts:
        alice-ingest-3: {}

    # The projector is deliberately not on the control VM.  Its catch-up
    # traversal is the largest Python resident set in the control plane, while
    # node-04 has no Dashboards/nginx/Alertmanager workload.
    projector:
      hosts:
        alice-ingest-4: {}

    background:
      hosts:
        alice-ingest-4:
          background_services: [rollup]

    # The live lane holds one open connection per viewer, so its cost grows
    # with readers.  Deliberately not the control host.
    livelane:
      hosts:
        alice-ingest-5: {}
