all:
  vars:
    ansible_user: root

    # The OpenStack machines provision.yml creates. One entry per VM, which on
    # this inventory is one entry per OpenSearch node.
    provision_machines:
      - name: alice-ingest-1
      - name: alice-ingest-2
      - name: alice-ingest-3
        dashboards: true
      - name: alice-ingest-4
      - name: alice-ingest-5

  children:

    alice_nodes:
      children:
        workers:
          vars:
            node_tier: worker
            # m2.medium has 3.75 GB in total. This matches
            # opensearch_worker_heap_size, which soak round 2 brought down to
            # the same 1g: 1, 2 and 3 GB were indistinguishable on a four-core
            # budget, so the farm takes the smallest of the three.
            opensearch_heap_size: "1g"
          hosts:
            alice-ingest-1:
              ansible_host: 203.0.113.11
              node_id: node-01
              epn_partition: 0
            alice-ingest-2:
              ansible_host: 203.0.113.12
              node_id: node-02
              epn_partition: 1
        storage:
          vars:
            node_tier: storage
          hosts:
            alice-ingest-3:
              ansible_host: 203.0.113.13
              node_id: node-03
              opensearch_heap_size: "1g"
            alice-ingest-4:
              ansible_host: 203.0.113.14
              node_id: node-04
            alice-ingest-5:
              ansible_host: 203.0.113.15
              node_id: node-05

    container_hosts: {}

    control:
      hosts:
        alice-ingest-3: {}

    # The projector is deliberately not on the control VM.  Its catch-up
    # traversal is the largest Python resident set in the control plane, while
    # node-04 has no Dashboards/nginx/Alertmanager workload.
    projector:
      hosts:
        alice-ingest-4: {}

    background:
      hosts:
        alice-ingest-4:
          background_services: [rollup]

    # The live lane holds one open connection per viewer, so its cost grows
    # with readers.  Deliberately not the control host.
    shifter:
      hosts:
        alice-ingest-5: {}
