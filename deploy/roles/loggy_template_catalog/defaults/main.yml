# Maintenance of the template catalog. One oneshot unit on an hourly timer, on
# the control host.

template_catalog_app_root: /opt/loggy

template_catalog_maintenance_service_name: alice-catalog-maintenance
template_catalog_maintenance_script: "{{ template_catalog_app_root }}/catalog_maintenance.py"
template_catalog_maintenance_state_dir: /var/lib/alice-catalog-maintenance
template_catalog_maintenance_interval: "1h"
template_catalog_maintenance_calendar: "hourly"
template_catalog_maintenance_memory_max: "256M"
template_catalog_maintenance_page: 1000
template_catalog_maintenance_requests_per_second: 500
template_catalog_maintenance_max_docs: 50000
template_catalog_maintenance_timeout: 300
template_catalog_maintenance_bulk_documents: 500
template_catalog_query_retention_days: 365
template_catalog_query_cleanup_interval_hours: 24

# The check results live in the catalog index beside the definitions and are
# expired on their own clock, matched to the hourly bucket retention.
template_catalog_check_retention_days: 35

# The shared indices the central stamped-against-indexed check reads. The
# worker-local index is checked on the worker by alice-stamper.
template_catalog_shared_indices: "application-logs-central,infologger"

# How many completed hours each pass checks, and how far behind the current
# hour it starts, so the last publication of a bucket has landed before it is
# compared against the index.
template_catalog_check_hours: 1
template_catalog_check_lag_hours: 1
template_catalog_check_page: 200
template_catalog_check_max_buckets: 5000
