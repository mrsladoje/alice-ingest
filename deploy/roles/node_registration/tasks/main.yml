---

- name: Ensure the directory that holds the registration script exists
  ansible.builtin.file:
    path: "{{ node_registration_dest | dirname }}"
    state: directory
    owner: "{{ node_registration_owner }}"
    group: "{{ node_registration_group }}"
    mode: "{{ node_registration_dir_mode }}"

- name: Install the node self-registration script
  ansible.builtin.copy:
    src: register_node.sh
    dest: "{{ node_registration_dest }}"
    owner: "{{ node_registration_owner }}"
    group: "{{ node_registration_group }}"
    mode: "{{ node_registration_mode }}"
  notify: "{{ node_registration_notify }}"
