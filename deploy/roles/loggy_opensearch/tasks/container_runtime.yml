- name: Install the container runtime
  ansible.builtin.dnf:
    name: "{{ opensearch_container_runtime_packages }}"
    state: present

- name: Read the installed podman version
  ansible.builtin.command:
    cmd: podman --version
  register: _podman_version
  changed_when: false

- name: Assert podman is new enough to generate systemd units from quadlet files
  ansible.builtin.assert:
    that:
      - (_podman_version.stdout.split()[2] is version(opensearch_container_min_podman_version, '>='))
    fail_msg: >-
      podman {{ _podman_version.stdout.split()[2] }} cannot read
      {{ opensearch_quadlet_dir }}. Quadlet arrived in podman
      {{ opensearch_container_min_podman_version }}, and every OpenSearch instance
      here is declared as a .container unit.
    success_msg: "podman {{ _podman_version.stdout.split()[2] }} supports quadlet."

- name: Ensure the quadlet unit directory exists
  ansible.builtin.file:
    path: "{{ opensearch_quadlet_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check whether the OpenSearch image is already present
  ansible.builtin.command:
    cmd: "podman image exists {{ opensearch_container_image }}"
  register: _opensearch_image_present
  changed_when: false
  failed_when: false

- name: Pull the OpenSearch image, once for every instance on this machine
  ansible.builtin.command:
    cmd: "podman pull {{ opensearch_container_image }}"
  when: _opensearch_image_present.rc != 0
  changed_when: true
