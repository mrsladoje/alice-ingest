- name: Render the alerting monitors bootstrap script
  ansible.builtin.template:
    src: alerting.sh.j2
    dest: "{{ dashboards_bootstrap_alerting_script }}"
    owner: root
    group: root
    mode: "0750"

- name: Stage monitor definitions
  ansible.builtin.copy:
    src: monitors/
    dest: "{{ dashboards_bootstrap_monitors_dir }}/"
    owner: root
    group: root
    mode: "0640"

- name: Upsert alerting monitors (idempotent by name, every run)
  ansible.builtin.command:
    cmd: "{{ dashboards_bootstrap_alerting_script }}"
  environment:
    OS_URL: "http://localhost:{{ opensearch_http_port }}"
    MONITORS_DIR: "{{ dashboards_bootstrap_monitors_dir }}"
    AD_ANOMALY_GRADE_THRESHOLD: "{{ ad_anomaly_grade_threshold }}"
    AD_ANOMALY_CONFIDENCE_THRESHOLD: "{{ ad_anomaly_confidence_threshold }}"
    TREND_LAG_FLOOR_MS: "{{ trend_lag_floor_ms }}"
    TREND_ENTRY_LAG_CEILING_MS: "{{ trend_entry_lag_ceiling_ms }}"
    TREND_ENTITY_CAP: "{{ trend_entity_cap_warn }}"
    TREND_MIN_SLICE_DOCS: "{{ trend_min_slice_docs }}"
    TREND_MIN_SLICE_ERRORS: "{{ trend_min_slice_errors }}"
    TREND_MIN_LAG_DOCS: "{{ trend_min_lag_docs }}"
    FLEET_SILENCE_FRACTION: "{{ fleet_silence_fraction }}"
    FORECAST_DISK_THRESHOLD_PERCENT: "{{ forecast_disk_threshold_percent }}"
    ALERTING_MAX_ACTIONABLE_ALERT_COUNT: "{{ alerting_max_actionable_alert_count }}"
    BREAKGLASS_SINK_URL: "http://127.0.0.1:{{ notification_ingest_port }}/notifications"
  changed_when: true
