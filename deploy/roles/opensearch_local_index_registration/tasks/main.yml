---

- name: Ensure the directory that holds the registration script exists
  ansible.builtin.file:
    path: "{{ opensearch_local_index_registration_dest | dirname }}"
    state: directory
    owner: "{{ opensearch_local_index_registration_owner }}"
    group: "{{ opensearch_local_index_registration_group }}"
    mode: "{{ opensearch_local_index_registration_dir_mode }}"

- name: Install the node self-registration script
  ansible.builtin.copy:
    src: register_node.sh
    dest: "{{ opensearch_local_index_registration_dest }}"
    owner: "{{ opensearch_local_index_registration_owner }}"
    group: "{{ opensearch_local_index_registration_group }}"
    mode: "{{ opensearch_local_index_registration_mode }}"
  notify: "{{ opensearch_local_index_registration_notify }}"
