# The central maintenance of the template catalog: definition expiry,
# query-history expiry, and the two counting checks.
#
# The worker half of the old catalog producer is gone. Every record is stamped
# in-band by roles/sweet_collector, which also publishes the definitions, the
# bucket counts and the watermarks. This role only expires and audits them.
#
# Nothing here is worker-local. Every index it touches lives on the storage
# tier, so the job runs on the control host and reaches the cluster through that
# host's own OpenSearch node.
---
- name: Ensure the app root exists
  ansible.builtin.file:
    path: "{{ template_catalog_app_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure the shared contract directory exists
  ansible.builtin.file:
    path: "{{ alice_shared_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ship the template contract the maintenance job imports
  ansible.builtin.copy:
    src: "{{ alice_shared_contract_file }}"
    dest: "{{ alice_shared_dir }}/template_contract.py"
    owner: root
    group: root
    mode: "0644"
  notify: restart alice-catalog-maintenance timer

- name: Install the central catalog maintenance task on the one host that runs it
  ansible.builtin.copy:
    src: catalog_maintenance.py
    dest: "{{ template_catalog_maintenance_script }}"
    owner: root
    group: root
    mode: "0755"
  notify: restart alice-catalog-maintenance timer

- name: Template the catalog maintenance systemd unit
  ansible.builtin.template:
    src: alice-catalog-maintenance.service.j2
    dest: /etc/systemd/system/{{ template_catalog_maintenance_service_name }}.service
    owner: root
    group: root
    mode: "0644"
  notify: restart alice-catalog-maintenance timer

- name: Template the catalog maintenance systemd timer
  ansible.builtin.template:
    src: alice-catalog-maintenance.timer.j2
    dest: /etc/systemd/system/{{ template_catalog_maintenance_service_name }}.timer
    owner: root
    group: root
    mode: "0644"
  notify: restart alice-catalog-maintenance timer

- name: Enable the catalog maintenance timer
  ansible.builtin.systemd:
    name: "{{ template_catalog_maintenance_service_name }}.timer"
    enabled: true
    state: started
    daemon_reload: true
