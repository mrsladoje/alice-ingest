anomaly_detection_monitors_script: /opt/sweet/init/monitors.sh
anomaly_detection_monitors_dir: /opt/sweet/init/monitors
anomaly_detection_detectors_script: /opt/sweet/init/detectors.sh
anomaly_detection_forecasters_script: /opt/sweet/init/forecasters.sh
anomaly_detection_detectors_dir: /opt/sweet/init/detectors
anomaly_detection_forecasters_dir: /opt/sweet/init/forecasters

ad_anomaly_grade_threshold: 0.7
ad_anomaly_confidence_threshold: 0.7
forecast_disk_threshold_percent: 85
fleet_silence_fraction: 0.5

trend_lag_floor_ms: 250
trend_entry_lag_ceiling_ms: 3600000
trend_entity_cap_warn: 1800
trend_min_slice_docs: 50
trend_min_slice_errors: 10
trend_min_lag_docs: 100

ad_metrics_window_delay_minutes: 1
ad_log_window_delay_minutes: 2

# One forecaster, on the one metric with an absolute threshold and a slow,
# smooth trend: filesystem fill per OpenSearch node. Disks fill over hours to
# days, so the interval is an hour, and 168 hourly points is the 7 days the
# metrics index holds. The horizon predicts a day ahead. An RCF model needs
# about 40 points before it forecasts, so the lane is silent for its first
# two days on a fresh cluster.
#
# max_primary_shards stays pinned. The result index otherwise takes one
# primary per data node with auto_expand_replicas 0-2, which is 15 shards for
# a few thousand tiny documents.
forecast_interval_minutes: 60
forecast_window_delay_minutes: 1
forecast_horizon: 24
forecast_history: 168
forecast_max_primary_shards: 1
forecast_result_retention: "14d"

fleet_collector_node_ids: []
