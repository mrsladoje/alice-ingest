- name: Stage the shared PIT/search_after cursor and identity modules beside the services that import them
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - {src: roster_publish.py, dest: "{{ dashboards_roster_publish_script }}"}
    - {src: discover_roster.py, dest: "{{ dashboards_discover_roster_script }}"}
  loop_control:
    label: "{{ item.dest }}"
  notify:
    - restart alice-metrics

- name: Publish the immutable fleet roster — before the poller, which reads it to derive collector absence
  ansible.builtin.import_tasks: roster.yml

- name: Metrics poller service (cockpit health panels) — after bootstrap so cockpit-metrics exists first
  ansible.builtin.import_tasks: metrics.yml
