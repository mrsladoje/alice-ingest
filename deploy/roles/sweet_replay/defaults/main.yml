# Role-local defaults. The cross-cutting parameters (s3_*, run_tag,
# *_replay_rate, *_max_objects, infologger_tcp_port, log_root,
# replay_http_port, node_count, replay_venv_path, replay_app_root, the
# vault-backed secrets) live in group_vars/all.yml and are read directly.
---

# Stands in for the engine's NODES_ROOT. The role creates exactly one symlink
# under it, "<node_id>" -> log_root, so the engine's per-collector writes land
# in this machine's log_root. No other collector's directory is ever created:
# the wrapper filters every foreign tarball before the engine resolves a name.
replay_nodes_root: /var/log/alice-replay-root

# Addresses permitted through the firewall to replay_http_port. Empty here so
# the role never names an inventory group; group_vars resolves it to the
# control host, which drives the replay button on the ops page.
replay_allowed_client_addresses: []

replay_service_name: alice-replay
replay_aws_dir: /root/.aws
replay_aws_credentials_file: "{{ replay_aws_dir }}/credentials"

# Where the engine records that AUTOSTART_REPLAY has already run once, so a
# restart never re-ingests. Lives in log_root because, on this machine,
# log_root is this partition's NODES_ROOT/<collector> directory.
replay_autostart_marker: "{{ log_root }}/.replay-autostart-done"

# Families a first-boot autostart loads. The deploy arms the engine and leaves
# it idle; the operator fires it.
replay_autostart_families: "infologger,dds,stdout"
replay_autostart: false

# The replay engine this role installs, read from the controller. The role
# carries its own copy in files/, so it stands on its own.
replay_engine_source: "{{ role_path }}/files/replay.py"

# Repeated in every role that writes a firewalld rule, so each role stands on
# its own and one inventory line can switch the whole stack.
alice_manage_firewalld: true

# The replay engine is not part of the logging stack's core budget. In
# production the logs arrive on their own and nothing like this runs; here it
# stands in for them, so it gets its own processors and must not take the
# collector's. Empty leaves it unpinned.
replay_cpuset: ""

# Empty leaves the unit unbounded.
replay_memory_high: ""
replay_memory_max: ""

# --- the captured families ---------------------------------------------------
#
# InfoLogger, DDS and the process tree come out of the S3 archive. The
# InfoLogger daemon log, the journal and the run orchestrator's log do not:
# they are written on a live EPN and nothing backs them up. A bundle captured
# on a live EPN is the only way a machine with no live stream can carry them.
#
# replay_bundle_src and replay_bundle_root live in group_vars/all.yml, because
# the collector role reads them too: it points its systemd input at the shipped
# journal.
#
# The daemon log grows by about 930 lines a day on the farm. Replaying it at
# the speed of the disk would put months of connection churn into one second
# and make every saturation figure meaningless.
ildaemon_replay_rate: 20

# The run orchestrator writes about 100,000 lines a day, roughly one a second.
# Paced for the same reason as the daemon log.
odc_replay_rate: 200

# Where the replay writes it, which must be what the collector's
# collector_odc_log_path globs over. The capture's own file names are kept, so
# a bundle holding two days replays as two files and the tail follows the same
# rotation it would see on the farm.
odc_replay_log_dir: /var/log/odc/staging
