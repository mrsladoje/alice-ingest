# authored by the replay unit agent
# =============================================================================
# roles/sweet_replay — native (venv + systemd) S3-replay engine, one per VM.
#
# SCOPE (quality bar #2, native fidelity — determined by reading
# images/node/Dockerfile, images/node/supervisord-collector.conf vs.
# supervisord-self-contained.conf, and docker-compose.yml vs.
# docker-compose.mocks.yaml):
#   - docker-compose.yml (the REAL 'make run' stack) starts node-01/02/03
#     with NO command: override, so the Dockerfile's default CMD applies —
#     `supervisord -c /etc/supervisord-collector.conf`, which runs ONLY
#     Fluent Bit. images/node/producers/*.py (dds/stdout/infologger mock
#     generators) are started ONLY by supervisord-self-contained.conf, which
#     is exclusively docker-compose.mocks.yaml's command: override.
#   - The real stack's only producer is the separate `replay` service
#     (images/replay/replay.py, `python replay.py serve`), which streams
#     real CERN S3 logs into the shared node volumes / TCP :5170.
#   - Therefore THIS role ports images/replay/replay.py only. The mock
#     producers under images/node/producers/ are mocks-stack-only and are
#     deliberately NOT deployed here — porting them would drift from what
#     'make run' (the real stack) actually runs.
#
# SINGLE-PARTITION DESIGN (LOCKED topology: each VM replays ONLY its own
# epn_partition slice, InfoLogger strictly to localhost): replay.py's own
# NODE_COUNT/NODES_ROOT/COLLECTOR_HOSTS fan-out assumes ONE process serving
# ALL collectors. files/replay_partition_wrapper.py imports the engine and
# monkeypatches its list_objects()/il_connect() extension points to narrow the
# SAME fan-out logic to this VM's slice — see that file's module docstring for
# the full reasoning (why a directory/symlink trick alone can't handle
# InfoLogger, whose per-collector routing is row-level, not object-level).
#
# The engine was treated as PRESERVED — deployed byte-for-byte, with every
# divergence pushed into the wrapper — until the source-coverage work of
# 4 Sep 2026. It could not stay that way: the engine flattened every process
# log of a node into one stdout file, which destroyed the program name before
# Fluent Bit ever read a line, and no monkeypatch seam reaches that loop. The
# engine now writes one file per process under stdout/<host>/ and rebuilds a
# real per-line event time. The rule that replaced PRESERVED: the wrapper still
# owns every deployment-shaped divergence, and the engine is edited only for
# defects in what the archive itself produces.
# =============================================================================
---

# --- Python runtime ----------------------------------------------------------
- name: Install Python3 (dnf) for the replay venv
  ansible.builtin.dnf:
    name:
      - python3
      - python3-pip
    state: present

- name: Open the replay trigger ({{ replay_http_port }}/tcp) to the allowed clients only
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv4"
      source address="{{ item }}"
      port port="{{ replay_http_port }}" protocol="tcp"
      accept
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ replay_allowed_client_addresses }}"
  when: alice_manage_firewalld

- name: Ensure the app root exists (replay.py + partition wrapper land here)
  ansible.builtin.file:
    path: "{{ replay_app_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy the replay engine (the same file the mocks stack runs)
  ansible.builtin.copy:
    src: "{{ replay_engine_source }}"
    dest: "{{ replay_app_root }}/replay.py"
    owner: root
    group: root
    mode: "0644"
  notify: restart alice-replay

- name: Copy the single-partition wrapper (imports replay.py, see its docstring)
  ansible.builtin.copy:
    src: replay_partition_wrapper.py
    dest: "{{ replay_app_root }}/replay_partition_wrapper.py"
    owner: root
    group: root
    mode: "0644"
  notify: restart alice-replay

# --- the captured bundle, when there is one ---------------------------------
- name: Ensure the bundle root exists
  ansible.builtin.file:
    path: "{{ replay_bundle_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: replay_bundle_src | length > 0

# Ships the InfoLogger daemon log and the journal captured from a real EPN.
# Neither is in S3 and neither can be synthesised: the daemon log is the only
# saturation signal on a node, and libsystemd reads journal FILES, so an export
# would have to be re-parsed by something that is not the production input.
- name: Ship the captured EPN bundle
  ansible.posix.synchronize:
    src: "{{ replay_bundle_src }}/"
    dest: "{{ replay_bundle_root }}/"
    delete: true
    rsync_opts:
      - "--chmod=D755,F644"
  when: replay_bundle_src | length > 0
  notify: restart alice-replay

- name: Say when there is no bundle, rather than leaving two sources silently absent
  ansible.builtin.debug:
    msg: >-
      No REPLAY_BUNDLE_SRC, so the InfoLogger daemon log, the journal and the
      run orchestrator's log are not
      replayed on this VM. Both are live-node sources with no S3 archive behind
      them; capture one with tools/epnsurvey/mkbundle.sh <epn> <dir> and deploy
      with REPLAY_BUNDLE_SRC=<dir>.
  when: replay_bundle_src | length == 0

- name: Create/update the replay venv and install boto3 into it
  ansible.builtin.pip:
    name: boto3
    state: present
    virtualenv: "{{ replay_venv_path }}"
    virtualenv_command: /usr/bin/python3 -m venv
  notify: restart alice-replay

# --- S3 credentials (vault-only, quality bar #5) ------------------------------
- name: Ensure /root/.aws exists
  ansible.builtin.file:
    path: "{{ replay_aws_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Template the AWS credentials profile from vault
  ansible.builtin.template:
    src: aws-credentials.j2
    dest: "{{ replay_aws_credentials_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: restart alice-replay

# --- Local log_root + this VM's slice of replay.py's NODES_ROOT layout -------
# replay.py writes DDS under NODES_ROOT/<collector-name>/dds/<host>.log and
# each process log under NODES_ROOT/<collector-name>/stdout/<host>/<file>.log
# via os.makedirs(exist_ok=True). Pointing NODES_ROOT/<our node_id> at log_root
# via a symlink means those writes land exactly where the LOCAL Fluent Bit tails
# (log_root/dds/*.log, log_root/stdout/*/*.log — see
# images/node/fluent-bit/collector.yaml), with zero code changes and zero
# extra disk usage for the two partitions this VM never touches (the
# wrapper's list_objects() filter means no other collector name is ever
# resolved here, so os.makedirs() for one never happens).
- name: Ensure the local Fluent Bit log_root exists (defensive — collector role also owns this)
  ansible.builtin.file:
    path: "{{ log_root }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - dds
    - stdout

- name: Ensure the replay partition-root parent directory exists
  ansible.builtin.file:
    path: "{{ replay_nodes_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Symlink this VM's replay partition-root to the local log_root
  ansible.builtin.file:
    src: "{{ log_root }}"
    dest: "{{ replay_nodes_root }}/{{ node_id }}"
    state: link
    force: true
    follow: false

# --- systemd unit --------------------------------------------------------
- name: Template the alice-replay systemd unit
  ansible.builtin.template:
    src: replay.service.j2
    dest: /etc/systemd/system/{{ replay_service_name }}.service
    owner: root
    group: root
    mode: "0644"
  notify: restart alice-replay

- name: Ensure alice-replay drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/{{ replay_service_name }}.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Drop the cached earliest-event time unless the configured clock is shifted
  ansible.builtin.file:
    path: "{{ replay_clock_cache }}"
    state: absent
  when: replay_clock | default('preserved') != 'shifted'

# clock.conf is operational runtime state owned by playbooks/replay.yml.  An ordinary
# deployment must not replace REPLAY_LOOP=true (or the selected pace) with the
# group default and restart an active soak.  Fresh hosts already receive every
# default in replay.service.j2; operators change them through make replay*.

- name: Apply any pending restart now, before the one-shot autostart can be interrupted
  ansible.builtin.meta: flush_handlers

- name: Enable and start alice-replay
  ansible.builtin.systemd:
    name: "{{ replay_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
