shifter_service_name: alice-shifter
shifter_script: /opt/loggy/shifter.py
shifter_static_dir: /opt/loggy/live
shifter_cockpit_url: "/app/dashboards"

shifter_bind: 0.0.0.0
shifter_token: ""

shifter_buffer_rows: 10000

# Held for a viewer who connects mid-stream, so a fresh page is not blank.
shifter_replay_rows: 500

# Per viewer. A full queue drops for that viewer; it is never allowed to grow.
shifter_client_queue_max: 2000

# How long a tab may sit in the background before the page drops its stream.
# A visible tab is never dropped, so a wall display keeps running. Set 0 to
# turn the whole behaviour off.
shifter_hidden_grace_seconds: 120

# The query lane. The shifter view runs its own searches through the lane
# server rather than from the browser, so OpenSearch keeps one caller, one
# credential and one origin. Leave shifter_opensearch_url empty and the
# Query button reports that query mode is not configured; the live stream is
# unaffected either way.
shifter_opensearch_url: "http://{{ hostvars[groups['control'][0]].ansible_host }}:{{ hostvars[groups['control'][0]].opensearch_http_port }}"
shifter_opensearch_indices: "infologger,application-logs-central"
shifter_opensearch_user: ""
shifter_opensearch_password: ""
shifter_opensearch_verify: true

# What one Query press returns in total, and the ceiling a viewer may raise it
# to. The rows do not arrive at once: the page fetches shifter_query_page_rows
# and then pulls older pages as the shifter scrolls up towards them.
shifter_query_default_rows: 5000
shifter_query_max_rows: 20000
shifter_query_page_rows: 500

# auto  = shrink the page if terser or esbuild is on the control node, ship the
#         readable source if neither is, so a deploy never depends on a tool.
# always = fail the deploy when neither is there.
# never  = always ship the readable source.
shifter_minify: auto

shifter_templates_enabled: true

# Where the frozen mining recipe and masker are shipped, and the bucket and
# local-index names the Templates page reads. The patterns default to what
# the contract publishes; the prefix is what the collector names its
# per-worker local index.
shifter_templating_dir: /opt/loggy/templating
shifter_drain3_version: "0.9.11"
shifter_buckets_5m_pattern: "template-buckets-5m-*"
shifter_buckets_1h_pattern: "template-buckets-1h-*"
shifter_local_index_prefix: "application-logs-local-"

shifter_template_concurrent_queries: 2
shifter_template_encoders: 1
shifter_template_page_rows: 50
shifter_template_lines_rows: 50
shifter_template_lines_ceiling: 500
shifter_template_watched_max: 100
shifter_template_note_max_chars: 2000
shifter_template_label_history_max: 50

shifter_episode_refresh_seconds: 30
shifter_view_refresh_seconds: 300
shifter_search_timeout_seconds: 30
shifter_search_terminate_after: 200000

shifter_semantic_enabled: true
shifter_semantic_backend: "model2vec"
shifter_semantic_max_groups: 20000

shifter_semantic_model_repo: "minishlab/potion-retrieval-32M"
shifter_semantic_model_revision: "6fc8051fab2a1e0ee76689cf08c853792ac285e7"
shifter_semantic_model_path: /opt/loggy/models/potion-retrieval-32M

shifter_semantic_venv: /opt/loggy/shifter-venv
shifter_semantic_pythons: [python3.13, python3.12, python3.11, python3.10]
shifter_semantic_model2vec_version: "0.9.0"

shifter_vector_cache_bytes: 67108864
shifter_catalog_cache_bytes: 33554432
shifter_response_cache_bytes: 16777216
shifter_aggregation_bytes: 50331648
shifter_live_lane_bytes: 33554432
shifter_process_base_bytes: 134217728

shifter_memory_high: "1G"
shifter_memory_max: "2G"

shifter_allowed_client_addresses: []

# Repeated in every role that writes a firewalld rule, so each role still
# stands on its own and one inventory line can switch the whole stack. The
# farm inventory sets it false: firewalld is inactive on the EPN network.
alice_manage_firewalld: true
