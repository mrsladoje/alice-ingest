- name: Ensure the app root and the catalog directory exist on the control host
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ alice_app_root }}"
    - "{{ alice_bootstrap_root }}"

- name: Stage the signal identity catalog the contract test reads
  ansible.builtin.copy:
    src: signal_catalog.json
    dest: "{{ alice_bootstrap_signal_catalog }}"
    owner: root
    group: root
    mode: "0644"

- name: Stage the cursor and identity modules the projector and its contract test import
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - {src: os_cursor.py, dest: "{{ alice_os_cursor_script }}"}
    - {src: signal_identity.py, dest: "{{ alice_signal_identity_script }}"}
  loop_control:
    label: "{{ item.dest }}"

- name: Stage the signal contract test on the control host
  ansible.builtin.copy:
    src: test_signal_contract.py
    dest: "{{ signal_projector_contract_test }}"
    owner: root
    group: root
    mode: "0755"

- name: Install the notification ingest service script
  ansible.builtin.copy:
    src: notification_ingest.py
    dest: "{{ signal_projector_notification_ingest_script }}"
    owner: root
    group: root
    mode: "0755"
  notify: restart alice-notification-ingest

- name: Template the alice-notification-ingest systemd unit
  ansible.builtin.template:
    src: alice-notification-ingest.service.j2
    dest: /etc/systemd/system/{{ signal_projector_notification_ingest_service_name }}.service
    owner: root
    group: root
    mode: "0644"
  notify: restart alice-notification-ingest

- name: Enable and start alice-notification-ingest
  ansible.builtin.systemd:
    name: "{{ signal_projector_notification_ingest_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Stage the signal projector implementation on the control host for its contract test
  ansible.builtin.copy:
    src: signal_projector.py
    dest: "{{ signal_projector_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Flush handlers so the asserted processes are the restarted ones
  ansible.builtin.meta: flush_handlers
