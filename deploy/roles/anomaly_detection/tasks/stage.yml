- name: Render the anomaly detectors bootstrap script
  ansible.builtin.template:
    src: detectors.sh.j2
    dest: "{{ dashboards_bootstrap_detectors_script }}"
    owner: root
    group: root
    mode: "0750"

- name: Render the forecaster bootstrap script
  ansible.builtin.template:
    src: forecasters.sh.j2
    dest: "{{ dashboards_bootstrap_forecasters_script }}"
    owner: root
    group: root
    mode: "0750"

- name: Stage detector definitions
  ansible.builtin.copy:
    src: detectors/
    dest: "{{ dashboards_bootstrap_detectors_dir }}/"
    owner: root
    group: root
    mode: "0640"

- name: Stage forecaster definitions
  ansible.builtin.copy:
    src: forecasters/
    dest: "{{ dashboards_bootstrap_forecasters_dir }}/"
    owner: root
    group: root
    mode: "0640"

- name: Stage the historical-analysis backtest runner
  ansible.builtin.copy:
    src: backtest.py
    dest: "{{ dashboards_backtest_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Stage the detection-layer verify script
  ansible.builtin.copy:
    src: verify_detection.py
    dest: "{{ dashboards_bootstrap_verify_script }}"
    owner: root
    group: root
    mode: "0750"
