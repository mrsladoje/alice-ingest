# roles/template_catalog — one oneshot service and a timer, on the workers.
#
# The collector routes by severity, so 96.9 % of the process tree never leaves
# the node it was written on. That is deliberate. This carries the TEMPLATE of
# those lines to the shared catalog without carrying the lines, so the catalog
# is complete while the raw informational traffic still stays local.
---
- name: Ensure the app root exists
  ansible.builtin.file:
    path: "{{ template_catalog_app_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure the shipped templating directory exists
  ansible.builtin.file:
    path: "{{ template_catalog_templating_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Copied, not reimplemented. The recipe tables and the masker are the same
# objects the archive miner uses, so a template mined here and the same template
# mined offline are the same string. A second copy of the rules would drift and
# the drift would be invisible until two catalogs disagreed.
- name: Ship the frozen mining recipe and masker from tools/templating
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ template_catalog_templating_dir }}/{{ item | basename }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - ../../../tools/templating/drainbench.py
    - ../../../tools/templating/masking.py
  notify: restart alice-template-catalog timer

- name: Install the catalog service
  ansible.builtin.copy:
    src: template_catalog.py
    dest: "{{ template_catalog_script }}"
    owner: root
    group: root
    mode: "0755"
  notify: restart alice-template-catalog timer

- name: Create the catalog venv and install drain3 into it
  ansible.builtin.pip:
    name: drain3
    state: present
    virtualenv: "{{ template_catalog_venv }}"
    virtualenv_command: /usr/bin/python3 -m venv
  notify: restart alice-template-catalog timer

- name: Template the catalog systemd unit
  ansible.builtin.template:
    src: alice-template-catalog.service.j2
    dest: /etc/systemd/system/{{ template_catalog_service_name }}.service
    owner: root
    group: root
    mode: "0644"
  notify: restart alice-template-catalog timer

- name: Template the catalog systemd timer
  ansible.builtin.template:
    src: alice-template-catalog.timer.j2
    dest: /etc/systemd/system/{{ template_catalog_service_name }}.timer
    owner: root
    group: root
    mode: "0644"
  notify: restart alice-template-catalog timer

- name: Enable the catalog timer
  ansible.builtin.systemd:
    name: "{{ template_catalog_service_name }}.timer"
    enabled: true
    state: started
    daemon_reload: true
