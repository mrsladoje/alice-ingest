- name: Ensure the app root and the definitions directory exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ alice_app_root }}"
    - "{{ alice_bootstrap_root }}"

- name: Stage the signal identity catalog that classifies every monitor and detector below
  ansible.builtin.copy:
    src: signal_catalog.json
    dest: "{{ alice_bootstrap_signal_catalog }}"
    owner: root
    group: root
    mode: "0644"

- name: Render the monitors upsert script
  ansible.builtin.template:
    src: monitors.sh.j2
    dest: "{{ anomaly_detection_monitors_script }}"
    owner: root
    group: root
    mode: "0750"

- name: Render the detectors upsert script
  ansible.builtin.template:
    src: detectors.sh.j2
    dest: "{{ anomaly_detection_detectors_script }}"
    owner: root
    group: root
    mode: "0750"

- name: Render the forecasters upsert script
  ansible.builtin.template:
    src: forecasters.sh.j2
    dest: "{{ anomaly_detection_forecasters_script }}"
    owner: root
    group: root
    mode: "0750"

- name: Stage monitor definitions
  ansible.builtin.copy:
    src: monitors/
    dest: "{{ anomaly_detection_monitors_dir }}/"
    owner: root
    group: root
    mode: "0640"

- name: Stage detector definitions
  ansible.builtin.copy:
    src: detectors/
    dest: "{{ anomaly_detection_detectors_dir }}/"
    owner: root
    group: root
    mode: "0640"

- name: Stage forecaster definitions
  ansible.builtin.copy:
    src: forecasters/
    dest: "{{ anomaly_detection_forecasters_dir }}/"
    owner: root
    group: root
    mode: "0640"

- name: Stage the cursor and identity modules the backtest runner imports
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - {src: os_cursor.py, dest: "{{ alice_os_cursor_script }}"}
    - {src: signal_identity.py, dest: "{{ alice_signal_identity_script }}"}
  loop_control:
    label: "{{ item.dest }}"

- name: Stage the historical-analysis backtest runner
  ansible.builtin.copy:
    src: backtest.py
    dest: "{{ anomaly_detection_backtest_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Stage the detection-layer verify script
  ansible.builtin.copy:
    src: verify_detection.py
    dest: "{{ alice_bootstrap_verify_script }}"
    owner: root
    group: root
    mode: "0750"
