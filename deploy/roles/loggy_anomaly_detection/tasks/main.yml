- name: Stage the monitor, detector and forecaster definitions, their upsert scripts, and the verify and backtest runners
  ansible.builtin.import_tasks: stage.yml

- name: Notification channels and alerting monitors
  ansible.builtin.import_tasks: monitors.yml

- name: Anomaly detectors, the forecaster and the verify gate, after the metrics poller has filled their source index
  ansible.builtin.import_tasks: detection.yml
