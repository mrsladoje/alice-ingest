- name: Swap file (skipped where the machine is sized to run without one)
  when: common_manage_swapfile
  block:
  - name: Check whether the swap file already exists
    ansible.builtin.stat:
      path: "{{ common_swapfile_path }}"
    register: _swapfile

  - name: Create the swap file (dd, not fallocate — swapon rejects XFS unwritten extents)
    ansible.builtin.command:
      cmd: >-
        dd if=/dev/zero of={{ common_swapfile_path }}
        bs=1M count={{ common_swapfile_size_mb }} status=none
    when: not _swapfile.stat.exists
    changed_when: true

  - name: Restrict the swap file to root
    ansible.builtin.file:
      path: "{{ common_swapfile_path }}"
      owner: root
      group: root
      mode: "0600"

  - name: Format the swap file
    ansible.builtin.command:
      cmd: "mkswap {{ common_swapfile_path }}"
    when: not _swapfile.stat.exists
    changed_when: true

  - name: Record the swap file in /etc/fstab so it survives a reboot
    ansible.posix.mount:
      src: "{{ common_swapfile_path }}"
      path: none
      fstype: swap
      opts: sw
      state: present

  - name: Read the active swap areas
    ansible.builtin.command:
      cmd: swapon --show=NAME --noheadings
    register: _swapon
    changed_when: false

  - name: Activate the swap file
    ansible.builtin.command:
      cmd: "swapon {{ common_swapfile_path }}"
    when: common_swapfile_path not in _swapon.stdout_lines
    changed_when: true

  - name: Set vm.swappiness so the swap file is actually used under pressure
    ansible.posix.sysctl:
      name: vm.swappiness
      value: "{{ common_swappiness | string }}"
      sysctl_file: "{{ common_sysctl_conf_file }}"
      sysctl_set: true
      state: present
      reload: true

# update_cache is deliberately off. dnf fetches metadata by itself whenever it
# actually has to resolve a missing package, so forcing a refresh on every run
# only buys a network round trip and a ~700MB dnf process on a node that has
# none to spare. lock_timeout and the async bound stop a stuck transaction or a
# leftover lock from an interrupted run turning into an unbounded wait.
- name: Install baseline packages
  block:
    - name: Install baseline packages
      ansible.builtin.dnf:
        name: "{{ common_packages }}"
        state: present
        update_cache: false
        lock_timeout: 60
      async: "{{ common_dnf_timeout }}"
      poll: 5

  rescue:
    - name: Say what a dnf failure here means
      ansible.builtin.fail:
        msg: >-
          dnf did not finish on {{ inventory_hostname }} within
          {{ common_dnf_timeout }}s, or it failed outright. Underlying result:
          {{ ansible_failed_result.msg | default('none reported') }}.
          Every baseline package is normally already installed, so this task
          should return in seconds. A stall here means the node is starved for
          memory, or a previous interrupted run left an rpm transaction lock
          behind.

- name: Set system timezone to UTC
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Ensure chronyd is enabled and running (correct wall-clock across the 5-node cluster)
  ansible.builtin.systemd:
    name: chronyd
    enabled: true
    state: started

- name: Set vm.max_map_count for OpenSearch (persistent + live)
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "{{ common_vm_max_map_count | string }}"
    sysctl_file: "{{ common_sysctl_conf_file }}"
    sysctl_set: true
    state: present
    reload: true

- name: Ensure firewalld is enabled and running
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started
  when: alice_manage_firewalld

- name: Open the world-reachable TCP ports this host is asked to expose
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ common_open_tcp_ports }}"
  when: alice_manage_firewalld
