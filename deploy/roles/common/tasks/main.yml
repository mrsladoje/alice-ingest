- name: Check whether the swap file already exists
  ansible.builtin.stat:
    path: "{{ common_swapfile_path }}"
  register: _swapfile

- name: Create the swap file (dd, not fallocate — swapon rejects XFS unwritten extents)
  ansible.builtin.command:
    cmd: >-
      dd if=/dev/zero of={{ common_swapfile_path }}
      bs=1M count={{ common_swapfile_size_mb }} status=none
  when: not _swapfile.stat.exists
  changed_when: true

- name: Restrict the swap file to root
  ansible.builtin.file:
    path: "{{ common_swapfile_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Format the swap file
  ansible.builtin.command:
    cmd: "mkswap {{ common_swapfile_path }}"
  when: not _swapfile.stat.exists
  changed_when: true

- name: Record the swap file in /etc/fstab so it survives a reboot
  ansible.posix.mount:
    src: "{{ common_swapfile_path }}"
    path: none
    fstype: swap
    opts: sw
    state: present

- name: Read the active swap areas
  ansible.builtin.command:
    cmd: swapon --show=NAME --noheadings
  register: _swapon
  changed_when: false

- name: Activate the swap file
  ansible.builtin.command:
    cmd: "swapon {{ common_swapfile_path }}"
  when: common_swapfile_path not in _swapon.stdout_lines
  changed_when: true

- name: Set vm.swappiness so the swap file is actually used under pressure
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ common_swappiness | string }}"
    sysctl_file: "{{ common_sysctl_conf_file }}"
    sysctl_set: true
    state: present
    reload: true

- name: Install baseline packages
  ansible.builtin.dnf:
    name: "{{ common_packages }}"
    state: present
    update_cache: true

- name: Set system timezone to UTC
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Ensure chronyd is enabled and running (correct wall-clock across the 5-node cluster)
  ansible.builtin.systemd:
    name: chronyd
    enabled: true
    state: started

- name: Set vm.max_map_count for OpenSearch (persistent + live)
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "{{ common_vm_max_map_count | string }}"
    sysctl_file: "{{ common_sysctl_conf_file }}"
    sysctl_set: true
    state: present
    reload: true

- name: Create the local log directory tree ({{ log_root }})
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ common_log_dirs }}"

- name: Ensure firewalld is enabled and running
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started

- name: Open OpenSearch HTTP (9200/tcp) between all 5 cluster nodes
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv4"
      source address="{{ item }}"
      port port="{{ opensearch_http_port }}" protocol="tcp"
      accept
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ opensearch_cluster_hosts }}"

- name: Open OpenSearch transport (9300/tcp) between all 5 cluster nodes
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv4"
      source address="{{ item }}"
      port port="{{ opensearch_transport_port }}" protocol="tcp"
      accept
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ opensearch_cluster_hosts }}"

- name: Open the Dashboards external port (5601/tcp, nginx TLS+basic-auth) on the control host
  ansible.posix.firewalld:
    port: "{{ dashboards_external_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  when: inventory_hostname in groups['control']
