# Everything the worker tier does to a log line, in the order it must happen.
#
# stamper.yml first: alice-stamper must be listening before Fluent Bit starts,
# because Fluent Bit's Forward output writes to its socket and its Forward input
# reads the socket the stamper writes back to. A collector that starts first only
# buffers and retries.

- name: Install the template stamper
  ansible.builtin.import_tasks: stamper.yml

- name: Install and configure Fluent Bit
  ansible.builtin.import_tasks: collector.yml
