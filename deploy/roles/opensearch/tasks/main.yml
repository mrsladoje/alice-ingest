- name: Add official OpenSearch 2.x yum repository
  ansible.builtin.yum_repository:
    name: opensearch-2.x
    description: OpenSearch 2.x repository
    baseurl: "{{ opensearch_yum_repo_baseurl }}"
    enabled: true
    gpgcheck: true
    gpgkey: "{{ opensearch_yum_repo_gpgkey }}"

- name: Check whether the OpenSearch package is already installed
  ansible.builtin.command: rpm -q opensearch
  register: _opensearch_installed
  changed_when: false
  failed_when: false

- name: Install OpenSearch under a temporary SHA1-permitting crypto policy (RHEL9 blocks the SHA1-signed OpenSearch key and package)
  when: _opensearch_installed.rc != 0
  block:
    - name: Temporarily allow SHA1 signatures in the system crypto policy
      ansible.builtin.command: update-crypto-policies --set DEFAULT:SHA1
      changed_when: true

    - name: Import the OpenSearch RPM GPG signing keys into the rpm keyring
      ansible.builtin.rpm_key:
        state: present
        key: "{{ item }}"
      loop:
        - https://artifacts.opensearch.org/publickeys/opensearch.pgp
        - https://artifacts.opensearch.org/publickeys/opensearch-release.pgp

    - name: Install OpenSearch RPM (version-pinned to match the compose image tag)
      ansible.builtin.dnf:
        name: "{{ opensearch_package }}"
        state: present
        update_cache: true
      environment:
        OPENSEARCH_INITIAL_ADMIN_PASSWORD: "{{ opensearch_install_throwaway_admin_password }}"
  always:
    - name: Restore the default crypto policy (disallow SHA1 again)
      ansible.builtin.command: update-crypto-policies --set DEFAULT
      changed_when: true

- name: Ensure OpenSearch data directory exists with correct ownership
  ansible.builtin.file:
    path: "{{ opensearch_data_path }}"
    state: directory
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_group }}"
    mode: "0750"

- name: Ensure OpenSearch log directory exists with correct ownership
  ansible.builtin.file:
    path: "{{ opensearch_log_path }}"
    state: directory
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_group }}"
    mode: "0750"

- name: Template opensearch.yml (cluster identity, inventory-derived discovery, security disabled)
  ansible.builtin.template:
    src: opensearch.yml.j2
    dest: "{{ opensearch_config_dir }}/opensearch.yml"
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_group }}"
    mode: "0640"
  notify: restart opensearch

- name: Template JVM heap options (trimmed for m2.medium — see group_vars/all.yml opensearch_heap_size)
  ansible.builtin.template:
    src: heap.options.j2
    dest: "{{ opensearch_jvm_options_d }}/heap.options"
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_group }}"
    mode: "0640"
  notify: restart opensearch

- name: Ensure systemd drop-in directory exists for the opensearch unit
  ansible.builtin.file:
    path: "{{ opensearch_systemd_dropin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Template systemd drop-in (LimitMEMLOCK/LimitNOFILE, ported from compose's ulimits block)
  ansible.builtin.template:
    src: ulimits-override.conf.j2
    dest: "{{ opensearch_systemd_dropin_dir }}/ulimits-override.conf"
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart opensearch

- name: Apply pending unit/config changes before first start
  ansible.builtin.meta: flush_handlers

- name: Enable and start the opensearch service
  ansible.builtin.systemd:
    name: "{{ opensearch_service_name }}"
    enabled: true
    state: started

- name: Wait for this node's OpenSearch HTTP API to respond (first boot / fresh install)
  ansible.builtin.uri:
    url: "http://localhost:{{ opensearch_http_port }}/"
    status_code: 200
  register: _opensearch_boot_check
  until: _opensearch_boot_check.status == 200
  retries: 60
  delay: 5
