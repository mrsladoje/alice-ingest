- name: Open OpenSearch HTTP ({{ opensearch_http_port }}/tcp) to every other cluster node
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv4"
      source address="{{ item }}"
      port port="{{ opensearch_http_port }}" protocol="tcp"
      accept
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ opensearch_cluster_hosts }}"

- name: Open OpenSearch transport ({{ opensearch_transport_port }}/tcp) to every other cluster node
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv4"
      source address="{{ item }}"
      port port="{{ opensearch_transport_port }}" protocol="tcp"
      accept
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ opensearch_cluster_hosts }}"

- name: Add the official OpenSearch yum repository
  ansible.builtin.yum_repository:
    name: "opensearch-{{ opensearch_version.split('.')[0] }}.x"
    description: "OpenSearch {{ opensearch_version.split('.')[0] }}.x repository"
    baseurl: "{{ opensearch_yum_repo_baseurl }}"
    enabled: true
    gpgcheck: true
    gpgkey: "{{ opensearch_yum_repo_gpgkey }}"

- name: Import the OpenSearch RPM GPG signing key into the rpm keyring
  ansible.builtin.rpm_key:
    state: present
    key: "{{ opensearch_yum_repo_gpgkey }}"

- name: Install OpenSearch RPM (version-pinned, security demo config suppressed)
  ansible.builtin.dnf:
    name: "{{ opensearch_package }}"
    state: present
    update_cache: true
  environment:
    DISABLE_INSTALL_DEMO_CONFIG: "true"

- name: Ensure OpenSearch data directory exists with correct ownership
  ansible.builtin.file:
    path: "{{ opensearch_data_path }}"
    state: directory
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_group }}"
    mode: "0750"

- name: Ensure OpenSearch log directory exists with correct ownership
  ansible.builtin.file:
    path: "{{ opensearch_log_path }}"
    state: directory
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_group }}"
    mode: "0750"

- name: Ensure the shared per-node environment directory exists
  ansible.builtin.file:
    path: "{{ opensearch_node_env_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: >-
    Publish the info-tier index settings register_node.sh needs — these are
    index settings, so they are owned here rather than by the collector whose
    unit happens to load them
  ansible.builtin.template:
    src: opensearch-node.env.j2
    dest: "{{ opensearch_node_env_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Template opensearch.yml (cluster identity, inventory-derived discovery, security disabled)
  ansible.builtin.template:
    src: opensearch.yml.j2
    dest: "{{ opensearch_config_dir }}/opensearch.yml"
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_group }}"
    mode: "0640"
  notify: restart opensearch

- name: Template JVM heap options (trimmed for m2.medium — see group_vars/all.yml opensearch_heap_size)
  ansible.builtin.template:
    src: heap.options.j2
    dest: "{{ opensearch_jvm_options_d }}/heap.options"
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_group }}"
    mode: "0640"
  notify: restart opensearch

- name: Ensure systemd drop-in directory exists for the opensearch unit
  ansible.builtin.file:
    path: "{{ opensearch_systemd_dropin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Template systemd drop-in (LimitMEMLOCK/LimitNOFILE, ported from compose's ulimits block)
  ansible.builtin.template:
    src: ulimits-override.conf.j2
    dest: "{{ opensearch_systemd_dropin_dir }}/ulimits-override.conf"
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart opensearch

- name: Apply pending unit/config changes before first start
  ansible.builtin.meta: flush_handlers

- name: Enable and start the opensearch service
  ansible.builtin.systemd:
    name: "{{ opensearch_service_name }}"
    enabled: true
    state: started

- name: Wait for this node's OpenSearch HTTP API to respond (first boot / fresh install)
  ansible.builtin.uri:
    url: "http://localhost:{{ opensearch_http_port }}/"
    status_code: 200
  register: _opensearch_boot_check
  until: _opensearch_boot_check.status == 200
  retries: 60
  delay: 5

- name: List installed OpenSearch plugins
  ansible.builtin.command:
    cmd: "{{ opensearch_plugin_bin }} list"
  register: _opensearch_plugins
  changed_when: false

- name: Assert detection and alerting plugins are present
  ansible.builtin.assert:
    that:
      - item in _opensearch_plugins.stdout
    fail_msg: >-
      Required plugin {{ item }} missing from `opensearch-plugin list`.
      Got: {{ _opensearch_plugins.stdout }}
    success_msg: "plugin present: {{ item }}"
  loop: "{{ opensearch_required_plugins }}"

- name: Assert anomaly-detection REST API answers
  ansible.builtin.uri:
    url: "http://localhost:{{ opensearch_http_port }}/_plugins/_anomaly_detection/detectors/_search"
    method: POST
    body_format: json
    body:
      size: 0
      query:
        match_all: {}
    status_code: [200, 404]
  register: _ad_api_check
  retries: 10
  delay: 3
  until: _ad_api_check.status in [200, 404]

- name: Assert the anomaly-detection 404 is only the not-yet-created config index
  ansible.builtin.assert:
    that:
      - _ad_api_check.status == 200 or
        (_ad_api_check.json.error.type | default('')) == 'index_not_found_exception'
    fail_msg: >-
      The anomaly-detection REST API returned {{ _ad_api_check.status }} with an
      unexpected body: {{ _ad_api_check.json | default(_ad_api_check.content) }}
    success_msg: >-
      anomaly-detection REST API answers
      ({{ 'config index present' if _ad_api_check.status == 200
          else '.opendistro-anomaly-detectors not created yet — the plugin
                creates it with the first detector, during the dashboards
                bootstrap' }})
