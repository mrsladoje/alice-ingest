- name: Ensure this instance's configuration directory exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ opensearch_config_dir }}"
    - "{{ opensearch_jvm_options_d }}"

- name: Check whether the OpenSearch image is already present
  ansible.builtin.command:
    cmd: "podman image exists {{ opensearch_container_image }}"
  register: _opensearch_image_present
  changed_when: false
  failed_when: false

- name: Pull the OpenSearch image
  ansible.builtin.command:
    cmd: "podman pull {{ opensearch_container_image }}"
  when: _opensearch_image_present.rc != 0
  changed_when: true

- name: Template the quadlet unit for this instance
  ansible.builtin.template:
    src: opensearch.container.j2
    dest: "{{ opensearch_quadlet_dir }}/{{ opensearch_container_name }}.container"
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart opensearch
