# Installs the S3 log replay engine on one worker, as a venv plus a systemd
# unit, and narrows it to this machine's own partition through
# files/replay_partition_wrapper.py. The engine owns what the archive
# produces; the wrapper owns every deployment-shaped divergence: the
# partition filter, InfoLogger strictly to localhost, the shifted clock and
# the loop. See the wrapper's module docstring.
---

# --- Python runtime ----------------------------------------------------------
- name: Install Python3 (dnf) for the replay venv
  ansible.builtin.dnf:
    name:
      - python3
      - python3-pip
    state: present

- name: Open the replay trigger ({{ replay_http_port }}/tcp) to the allowed clients only
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv4"
      source address="{{ item }}"
      port port="{{ replay_http_port }}" protocol="tcp"
      accept
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ replay_allowed_client_addresses }}"
  when: alice_manage_firewalld

- name: Ensure the app root exists (replay.py + partition wrapper land here)
  ansible.builtin.file:
    path: "{{ replay_app_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy the replay engine
  ansible.builtin.copy:
    src: "{{ replay_engine_source }}"
    dest: "{{ replay_app_root }}/replay.py"
    owner: root
    group: root
    mode: "0644"
  notify: restart alice-replay

- name: Copy the single-partition wrapper
  ansible.builtin.copy:
    src: replay_partition_wrapper.py
    dest: "{{ replay_app_root }}/replay_partition_wrapper.py"
    owner: root
    group: root
    mode: "0644"
  notify: restart alice-replay

# --- the captured bundle, when there is one ---------------------------------
- name: Ensure the bundle root exists
  ansible.builtin.file:
    path: "{{ replay_bundle_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: replay_bundle_src | length > 0

# Ships the InfoLogger daemon log, the journal and the run orchestrator's log
# captured from a live EPN. None is in S3 and none can be synthesised: the
# daemon log is the only saturation signal on a machine, and libsystemd reads
# journal files, so an export would have to be re-parsed by something that is
# not the production input.
- name: Ship the captured EPN bundle
  ansible.posix.synchronize:
    src: "{{ replay_bundle_src }}/"
    dest: "{{ replay_bundle_root }}/"
    delete: true
    rsync_opts:
      - "--chmod=D755,F644"
  when: replay_bundle_src | length > 0
  notify: restart alice-replay

- name: Say when there is no bundle, rather than leaving two sources silently absent
  ansible.builtin.debug:
    msg: >-
      No REPLAY_BUNDLE_SRC, so the InfoLogger daemon log, the journal and the
      run orchestrator's log are not replayed on this machine. All three are
      live-node sources with no S3 archive behind them; capture a bundle on a
      live EPN and deploy with REPLAY_BUNDLE_SRC=<dir>.
  when: replay_bundle_src | length == 0

- name: Create/update the replay venv and install boto3 into it
  ansible.builtin.pip:
    name: boto3
    state: present
    virtualenv: "{{ replay_venv_path }}"
    virtualenv_command: /usr/bin/python3 -m venv
  notify: restart alice-replay

# --- S3 credentials, vault-only --------------------------------------------
- name: Ensure /root/.aws exists
  ansible.builtin.file:
    path: "{{ replay_aws_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Template the AWS credentials profile from vault
  ansible.builtin.template:
    src: aws-credentials.j2
    dest: "{{ replay_aws_credentials_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: restart alice-replay

# --- Local log_root and this machine's slice of the engine's NODES_ROOT ------
# The engine writes DDS under NODES_ROOT/<collector>/dds/<host>.log and each
# process log under NODES_ROOT/<collector>/stdout/<host>/<file>.log. Pointing
# NODES_ROOT/<node_id> at log_root through a symlink lands those writes where
# the local Fluent Bit tails, with no engine change. The wrapper filters every
# foreign tarball before the engine resolves a collector name, so no other
# collector's directory is ever created.
- name: Ensure the local Fluent Bit log_root exists (the collector role owns it too)
  ansible.builtin.file:
    path: "{{ log_root }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - dds
    - stdout

- name: Ensure the replay partition-root parent directory exists
  ansible.builtin.file:
    path: "{{ replay_nodes_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Symlink this machine's replay partition-root to the local log_root
  ansible.builtin.file:
    src: "{{ log_root }}"
    dest: "{{ replay_nodes_root }}/{{ node_id }}"
    state: link
    force: true
    follow: false

# --- systemd unit --------------------------------------------------------
- name: Template the alice-replay systemd unit
  ansible.builtin.template:
    src: replay.service.j2
    dest: /etc/systemd/system/{{ replay_service_name }}.service
    owner: root
    group: root
    mode: "0644"
  notify: restart alice-replay

- name: Ensure alice-replay drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/{{ replay_service_name }}.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Drop the cached earliest-event time unless the configured clock is shifted
  ansible.builtin.file:
    path: "{{ replay_clock_cache }}"
    state: absent
  when: replay_clock | default('preserved') != 'shifted'

# clock.conf is runtime state owned by the replay playbook. A deployment must
# not replace REPLAY_LOOP=true, or the selected pace, with the group default
# and restart an active run. Fresh hosts already receive every default from
# replay.service.j2; operators change them through the replay playbook.

- name: Apply any pending restart now, before the one-shot autostart can be interrupted
  ansible.builtin.meta: flush_handlers

- name: Enable and start alice-replay
  ansible.builtin.systemd:
    name: "{{ replay_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
