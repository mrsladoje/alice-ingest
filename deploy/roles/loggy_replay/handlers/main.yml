# A restart is data-safe because the replay is repeatable, but it terminates an
# in-flight pass and does not re-trigger it. The role therefore never rewrites
# the replay playbook's runtime drop-in on an ordinary deployment. A real
# engine, unit or credential change still requires this handler; the status
# playbook reports the resulting idle worker so the operator knows to trigger
# it again.
---

- name: Restart alice-replay
  ansible.builtin.systemd:
    name: "{{ replay_service_name }}"
    state: restarted
    daemon_reload: true
  listen: restart alice-replay
