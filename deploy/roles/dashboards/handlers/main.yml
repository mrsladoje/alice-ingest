- name: Restart opensearch-dashboards
  ansible.builtin.systemd:
    name: "{{ dashboards_service_name }}"
    state: restarted
    daemon_reload: true
  listen: restart opensearch-dashboards

- name: Restart nginx
  ansible.builtin.systemd:
    name: nginx
    state: restarted
  listen: restart nginx

- name: Restart alice-ops
  ansible.builtin.systemd:
    name: "{{ dashboards_ops_service_name }}"
    state: restarted
    daemon_reload: true
  listen: restart alice-ops

- name: Restart alice-metrics
  ansible.builtin.systemd:
    name: "{{ dashboards_metrics_service_name }}"
    state: restarted
    daemon_reload: true
  listen: restart alice-metrics

- name: Restart alice-trend-rollup
  ansible.builtin.systemd:
    name: "{{ dashboards_trend_rollup_service_name }}"
    state: restarted
    daemon_reload: true
  listen: restart alice-trend-rollup

- name: Restart alice-anomaly-digest
  ansible.builtin.systemd:
    name: "{{ dashboards_anomaly_digest_service_name }}"
    state: restarted
    daemon_reload: true
  listen: restart alice-anomaly-digest

- name: Restart alice-signal-projector
  ansible.builtin.systemd:
    name: "{{ dashboards_signal_projector_service_name }}"
    state: restarted
    daemon_reload: true
  failed_when: false
  listen: restart alice-signal-projector

- name: Restart alice-notification-ingest
  ansible.builtin.systemd:
    name: "{{ dashboards_notification_ingest_service_name }}"
    state: restarted
    daemon_reload: true
  failed_when: false
  listen: restart alice-notification-ingest
