- name: Ensure the app root exists on the background node
  ansible.builtin.file:
    path: "{{ dashboards_app_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure the bootstrap root exists on the background node
  ansible.builtin.file:
    path: "{{ dashboards_bootstrap_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: "'digest' in background_services"

- name: Stage the shared cursor and identity modules the digest imports
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - {src: os_cursor.py, dest: "{{ dashboards_os_cursor_script }}"}
    - {src: signal_identity.py, dest: "{{ dashboards_signal_identity_script }}"}
  loop_control:
    label: "{{ item.dest }}"
  when: "'digest' in background_services"
  notify: restart alice-anomaly-digest

- name: Stage the signal catalog the digest reads
  ansible.builtin.copy:
    src: signal_catalog.json
    dest: "{{ dashboards_bootstrap_signal_catalog }}"
    owner: root
    group: root
    mode: "0644"
  when: "'digest' in background_services"
  notify: restart alice-anomaly-digest

- name: Verify the staged signal catalog parses
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "import json; json.load(open('{{ dashboards_bootstrap_signal_catalog }}'))"
  changed_when: false
  when: "'digest' in background_services"
