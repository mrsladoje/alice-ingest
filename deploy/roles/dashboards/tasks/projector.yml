- name: Stage the signal contract test on the control host
  ansible.builtin.copy:
    src: test_signal_contract.py
    dest: "{{ dashboards_signal_contract_test }}"
    owner: root
    group: root
    mode: "0755"

- name: Install the notification ingest service script
  ansible.builtin.copy:
    src: notification_ingest.py
    dest: "{{ dashboards_notification_ingest_script }}"
    owner: root
    group: root
    mode: "0755"
  notify: restart alice-notification-ingest

- name: Template the alice-notification-ingest systemd unit
  ansible.builtin.template:
    src: alice-notification-ingest.service.j2
    dest: /etc/systemd/system/{{ dashboards_notification_ingest_service_name }}.service
    owner: root
    group: root
    mode: "0644"
  notify: restart alice-notification-ingest

- name: Enable and start alice-notification-ingest
  ansible.builtin.systemd:
    name: "{{ dashboards_notification_ingest_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Stage the signal projector implementation on the control host for its contract test
  ansible.builtin.copy:
    src: signal_projector.py
    dest: "{{ dashboards_signal_projector_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Create the projector's app and catalog directories on its offload host
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ dashboards_app_root }}"
    - "{{ dashboards_bootstrap_root }}"
  delegate_to: "{{ signal_projector_host }}"

- name: Stage the projector's shared modules on its offload host
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - {src: os_cursor.py, dest: "{{ dashboards_os_cursor_script }}"}
    - {src: signal_identity.py, dest: "{{ dashboards_signal_identity_script }}"}
  loop_control:
    label: "{{ item.dest }}"
  register: _projector_remote_modules
  delegate_to: "{{ signal_projector_host }}"

- name: Stage the projector's readable signal catalog on its offload host
  ansible.builtin.copy:
    src: signal_catalog.json
    dest: "{{ dashboards_bootstrap_signal_catalog }}"
    owner: root
    group: root
    mode: "0644"
  register: _projector_remote_catalog
  delegate_to: "{{ signal_projector_host }}"

- name: Stage the causal edges the projector ranks candidate causes from
  ansible.builtin.copy:
    src: causal_edges.json
    dest: "{{ dashboards_bootstrap_causal_edges }}"
    owner: root
    group: root
    mode: "0644"
  register: _projector_remote_edges
  delegate_to: "{{ signal_projector_host }}"

- name: Prove an unprivileged projector process can parse its remote catalog
  ansible.builtin.command:
    argv:
      - /usr/sbin/runuser
      - -u
      - nobody
      - --
      - /usr/bin/python3
      - -c
      - "import json; json.load(open('{{ dashboards_bootstrap_signal_catalog }}'))"
  changed_when: false
  delegate_to: "{{ signal_projector_host }}"

- name: Install the signal projector script on its offload host
  ansible.builtin.copy:
    src: signal_projector.py
    dest: "{{ dashboards_signal_projector_script }}"
    owner: root
    group: root
    mode: "0755"
  register: _projector_remote_script
  delegate_to: "{{ signal_projector_host }}"

- name: Template the alice-signal-projector systemd unit on its offload host
  ansible.builtin.template:
    src: alice-signal-projector.service.j2
    dest: /etc/systemd/system/{{ dashboards_signal_projector_service_name }}.service
    owner: root
    group: root
    mode: "0644"
  register: _projector_remote_unit
  delegate_to: "{{ signal_projector_host }}"

- name: Prove the offload host can reach Alertmanager before starting the projector
  ansible.builtin.uri:
    url: "http://{{ hostvars[groups['control'][0]].ansible_host }}:{{ alertmanager_port }}/-/ready"
    status_code: [200]
  register: _remote_alertmanager_ready
  retries: 12
  delay: 5
  until: _remote_alertmanager_ready.status == 200
  delegate_to: "{{ signal_projector_host }}"

- name: Enable and start the projector on its offload host, restarting only when its inputs changed
  ansible.builtin.systemd:
    name: "{{ dashboards_signal_projector_service_name }}"
    enabled: true
    state: >-
      {{ 'restarted'
         if ((_projector_remote_modules.changed | default(false))
             or (_projector_remote_catalog.changed | default(false))
             or (_projector_remote_edges.changed | default(false))
             or (_projector_remote_script.changed | default(false))
             or (_projector_remote_unit.changed | default(false)))
         else 'started' }}
    daemon_reload: true
  delegate_to: "{{ signal_projector_host }}"

- name: Flush handlers so the asserted processes are the restarted ones
  ansible.builtin.meta: flush_handlers

- name: Read the projector memory bounds from the running systemd unit
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - show
      - "{{ dashboards_signal_projector_service_name }}"
      - --property=MemoryHigh
      - --property=MemoryMax
  register: _projector_memory_bounds
  changed_when: false
  delegate_to: "{{ signal_projector_host }}"

- name: Assert the projector is actually running inside finite memory bounds
  ansible.builtin.assert:
    that:
      - >-
        (_projector_memory_bounds.stdout |
        regex_search('(?m)^MemoryHigh=[1-9][0-9]*$')) is not none
      - >-
        (_projector_memory_bounds.stdout |
        regex_search('(?m)^MemoryMax=[1-9][0-9]*$')) is not none
    fail_msg: >-
      The running projector has no finite systemd memory bounds:
      {{ _projector_memory_bounds.stdout_lines | default([]) }}
    success_msg: >-
      The projector is bounded by
      {{ _projector_memory_bounds.stdout_lines | default([]) | join(', ') }}.

- name: Record the earliest acceptable projector heartbeat time
  ansible.builtin.command:
    argv:
      - /usr/bin/date
      - -u
      - +%Y-%m-%dT%H:%M:%S.000Z
  register: _projector_gate_started
  changed_when: false
  delegate_to: "{{ signal_projector_host }}"

- name: Prove the signal projector completed a cycle
  block:
    - name: Confirm this node's OpenSearch still answers before waiting on the projector
      ansible.builtin.uri:
        url: "http://localhost:{{ opensearch_http_port }}/_cluster/health?timeout=5s"
        timeout: 10
        status_code: 200
      register: _os_alive
      until: _os_alive.status == 200
      retries: 6
      delay: 5
      delegate_to: "{{ signal_projector_host }}"

    # The projector writes its heartbeat only after a full cycle returns, and
    # the first cycle after a restart reads the whole overlap window. Even on
    # the offload host that can take minutes, not the two this used to allow.
    - name: Wait for the newest signal-projector heartbeat to prove a successful cycle
      ansible.builtin.uri:
        url: "http://localhost:{{ opensearch_http_port }}/{{ cockpit_metrics_index }}/_search"
        method: POST
        body_format: json
        body:
          size: 1
          sort:
            - "@timestamp": desc
          query:
            bool:
              filter:
                - term:
                    kind: projector
                - range:
                    "@timestamp":
                      gte: "{{ _projector_gate_started.stdout }}"
        status_code: 200
        timeout: 10
      register: _projector_heartbeat
      until:
        - (_projector_heartbeat.json.hits.hits | default([]) | length) == 1
        - >-
          (((_projector_heartbeat.json.hits.hits | default([]) | first | default({})).get('_source', {})).get('projector_cycle_ok', 0) | int)
          == 1
      retries: "{{ projector_gate_retries }}"
      delay: "{{ projector_gate_delay }}"
      delegate_to: "{{ signal_projector_host }}"

  rescue:
    - name: Collect why the projector produced no heartbeat
      ansible.builtin.shell:
        cmd: "{{ item }}"
      loop:
        - "systemctl status {{ dashboards_signal_projector_service_name }} --no-pager | tail -20"
        - "systemctl show {{ dashboards_signal_projector_service_name }} --property=Result --property=NRestarts --property=MemoryCurrent --property=MemoryPeak --property=ExecMainStatus"
        - "journalctl -u {{ dashboards_signal_projector_service_name }} -n 60 --no-pager"
        - "journalctl -k -n 100 --no-pager | grep -Ei 'oom|out of memory|killed process' | tail -20"
        - "free -m"
        - "swapon --show"
        - "systemctl status opensearch --no-pager | tail -12"
        - "journalctl -u opensearch -n 40 --no-pager"
        - "curl -s -m 5 'http://localhost:{{ opensearch_http_port }}/_cluster/health?pretty' || echo 'OpenSearch did not answer within 5s'"
        - >-
          curl -s -m 5
          'http://localhost:{{ opensearch_http_port }}/_cat/nodes?v&h=name,heap.percent,ram.percent,cpu,node.role'
          || echo 'OpenSearch did not answer within 5s'
        - >-
          curl -s -m 10 -H 'Content-Type: application/json'
          'http://localhost:{{ opensearch_http_port }}/{{ cockpit_metrics_index }}/_search?pretty'
          -d '{"size":3,"sort":[{"@timestamp":"desc"}],"query":{"term":{"kind":"projector"}}}'
          || echo 'OpenSearch did not answer within 10s'
        - >-
          curl -s -m 5
          'http://{{ hostvars[groups['control'][0]].ansible_host }}:{{ alertmanager_port }}/-/ready'
          || echo 'Alertmanager did not answer from the projector host within 5s'
        - "date -u +%Y-%m-%dT%H:%M:%S.000Z"
      register: _projector_why
      changed_when: false
      failed_when: false
      delegate_to: "{{ signal_projector_host }}"

    - name: Report why the projector produced no heartbeat
      ansible.builtin.debug:
        msg: "{{ (item.stdout_lines | default([])) }}"
      loop: "{{ _projector_why.results | default([]) }}"
      loop_control:
        label: "{{ item.item | default('') }}"

    - name: Record that the projector gate did not prove a cycle
      ansible.builtin.set_fact:
        projector_gate_failed: true
        projector_gate_started_at: "{{ _projector_gate_started.stdout }}"

    - name: Report the projector gate as unproven and continue so the rest of the deploy converges
      ansible.builtin.debug:
        msg: >-
          PROJECTOR GATE UNPROVEN — the signal projector wrote no
          successful-cycle heartbeat within
          {{ projector_gate_retries | int * projector_gate_delay | int }}s of
          {{ _projector_gate_started.stdout }}. The diagnosis is printed above.
          Read it in this order: the last three kind=projector documents say
          whether the projector ever writes at all and what projector_cycle_ok
          it reports; the node's own UTC clock beside them says whether the
          heartbeat timestamps are simply outside the window this gate asks
          for; free -m and swapon say whether the node ran out of memory during
          the cycle; the journal says whether the cycle raised. This no longer
          stops the deploy — the remaining plays run, and the deploy still
          exits non-zero at the end so this is never mistaken for a pass.

- name: Assert the offloaded projector stayed up
  ansible.builtin.systemd:
    name: "{{ dashboards_signal_projector_service_name }}"
  register: _projector_state
  retries: 6
  delay: 5
  until: _projector_state.status.ActiveState == "active"
  delegate_to: "{{ signal_projector_host }}"

- name: Assert the notification receiver stayed up (a dead receiver silently drops every notification)
  ansible.builtin.systemd:
    name: "{{ dashboards_notification_ingest_service_name }}"
  register: _notify_state
  retries: 6
  delay: 5
  until: _notify_state.status.ActiveState == "active"

- name: Assert the notification receiver durably accepts a probe
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ notification_ingest_port }}/healthz"
    status_code: [200]
  register: _ingest_health
  retries: 6
  delay: 5
  until: _ingest_health.status == 200

- name: Prove the emitted-signal contract without waiting for a live signal
  ansible.builtin.command:
    cmd: "python3 {{ dashboards_signal_contract_test }}"
  environment:
    SIGNAL_CATALOG: "{{ dashboards_bootstrap_signal_catalog }}"
    CLUSTER_ID: "{{ cluster_id }}"
  changed_when: false

- name: Re-verify the signal layer now that the projector exists
  ansible.builtin.command:
    cmd: "python3 {{ dashboards_bootstrap_verify_script }}"
  environment:
    OS_URL: "http://localhost:{{ opensearch_http_port }}"
    EXPECTED_MONITORS: "{{ expected_monitors }}"
    EXPECTED_DETECTORS: "{{ expected_detectors }}"
    EXPECTED_FORECASTERS: "{{ expected_forecasters }}"
    ROLLUP_INDEX: "{{ trend_rollup_index }}"
    METRICS_INDEX: "{{ cockpit_metrics_index }}"
    ROSTER_INDEX: "{{ fleet_roster_index }}"
    SIGNALS_INDEX: "{{ signals_index }}"
    INCIDENTS_INDEX: "{{ incidents_index }}"
    NOTIFICATIONS_INDEX: "{{ notifications_index }}"
    LANE_STATE_INDEX: "{{ lane_state_index }}"
    SIGNAL_CATALOG: "{{ dashboards_bootstrap_signal_catalog }}"
    ALERTING_MAX_ACTIONABLE_ALERT_COUNT: "{{ alerting_max_actionable_alert_count }}"
    EXPECT_PUSH_HEARTBEATS: "false"
    CHECK_EPISODE_GROUPING: "true"
    GROUPING_SINCE: "{{ _projector_gate_started.stdout }}"
  changed_when: false
