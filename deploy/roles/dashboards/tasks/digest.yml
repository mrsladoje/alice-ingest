- name: Install the anomaly digest script
  ansible.builtin.copy:
    src: anomaly_digest.py
    dest: "{{ dashboards_anomaly_digest_script }}"
    owner: root
    group: root
    mode: "0755"
  notify: restart alice-anomaly-digest

- name: Install the historical-analysis backtest runner (imports anomaly_digest, so it lives beside it)
  ansible.builtin.copy:
    src: backtest.py
    dest: "{{ dashboards_backtest_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Template the alice-anomaly-digest systemd unit
  ansible.builtin.template:
    src: alice-anomaly-digest.service.j2
    dest: /etc/systemd/system/{{ dashboards_anomaly_digest_service_name }}.service
    owner: root
    group: root
    mode: "0644"
  notify: restart alice-anomaly-digest

- name: Enable and start alice-anomaly-digest
  ansible.builtin.systemd:
    name: "{{ dashboards_anomaly_digest_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Apply a pending digest restart before asserting its traversal
  ansible.builtin.meta: flush_handlers

- name: Record the earliest acceptable digest cycle completion time
  ansible.builtin.command:
    argv:
      - /usr/bin/date
      - +%s
  register: _digest_gate_started
  changed_when: false

- name: Wait for the digest to complete a new lossless traversal cycle
  ansible.builtin.uri:
    url: "http://localhost:{{ opensearch_http_port }}/{{ lane_state_index }}/_doc/anomaly-realtime"
    status_code: [200, 404]
    return_content: true
  register: _digest_lane
  until:
    - _digest_lane.status == 200
    - >-
      (((_digest_lane.json | default({})).get('_source', {})).get('updated_at', 0) | int)
      >= ((_digest_gate_started.stdout | int) * 1000)
  retries: 24
  delay: 5
