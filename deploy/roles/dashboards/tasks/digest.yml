- name: Install the anomaly digest script
  ansible.builtin.copy:
    src: anomaly_digest.py
    dest: "{{ dashboards_anomaly_digest_script }}"
    owner: root
    group: root
    mode: "0755"
  notify: restart alice-anomaly-digest

- name: Install the historical-analysis backtest runner (imports anomaly_digest, so it lives beside it)
  ansible.builtin.copy:
    src: backtest.py
    dest: "{{ dashboards_backtest_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Template the alice-anomaly-digest systemd unit
  ansible.builtin.template:
    src: alice-anomaly-digest.service.j2
    dest: /etc/systemd/system/{{ dashboards_anomaly_digest_service_name }}.service
    owner: root
    group: root
    mode: "0644"
  notify: restart alice-anomaly-digest

- name: Enable and start alice-anomaly-digest
  ansible.builtin.systemd:
    name: "{{ dashboards_anomaly_digest_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
