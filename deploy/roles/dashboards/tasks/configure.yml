- name: Template /etc/opensearch-dashboards/opensearch_dashboards.yml
  ansible.builtin.template:
    src: opensearch_dashboards.yml.j2
    dest: "{{ dashboards_config_file }}"
    owner: "{{ dashboards_system_user }}"
    group: "{{ dashboards_system_group }}"
    mode: "0640"
  notify: restart opensearch-dashboards

- name: Ensure the systemd drop-in directory exists for OpenSearch Dashboards
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ dashboards_service_name }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Cap Dashboards memory and keep it inside the ALICE slice
  ansible.builtin.template:
    src: dashboards-memory-override.conf.j2
    dest: "/etc/systemd/system/{{ dashboards_service_name }}.service.d/memory-override.conf"
    owner: root
    group: root
    mode: "0644"
  notify: restart opensearch-dashboards

- name: Enable and start OpenSearch Dashboards
  ansible.builtin.systemd:
    name: "{{ dashboards_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for the local Dashboards API to answer (127.0.0.1, loopback-only by design)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ dashboards_internal_port }}/api/status"
    status_code: 200
  register: _dashboards_up
  until: _dashboards_up.status == 200
  retries: 60
  delay: 5
