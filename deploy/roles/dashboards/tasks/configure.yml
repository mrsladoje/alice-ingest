- name: Template /etc/opensearch-dashboards/opensearch_dashboards.yml
  ansible.builtin.template:
    src: opensearch_dashboards.yml.j2
    dest: "{{ dashboards_config_file }}"
    owner: "{{ dashboards_system_user }}"
    group: "{{ dashboards_system_group }}"
    mode: "0640"
  notify: restart opensearch-dashboards

- name: Enable and start OpenSearch Dashboards
  ansible.builtin.systemd:
    name: "{{ dashboards_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for the local Dashboards API to answer (127.0.0.1, loopback-only by design)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ dashboards_internal_port }}/api/status"
    status_code: 200
  register: _dashboards_up
  until: _dashboards_up.status == 200
  retries: 60
  delay: 5
