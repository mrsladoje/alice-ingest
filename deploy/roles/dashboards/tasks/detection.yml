- name: Wait for the metrics poller to land its first documents in {{ cockpit_metrics_index }}
  ansible.builtin.uri:
    url: "http://localhost:{{ opensearch_http_port }}/{{ cockpit_metrics_index }}/_count"
    method: POST
    body_format: json
    body:
      query:
        term:
          kind: "{{ item }}"
    status_code: [200, 404]
  register: _metrics_seeded
  until: (_metrics_seeded.json.count | default(0) | int) > 0
  retries: 20
  delay: 6
  loop:
    - node
    - osd
  loop_control:
    label: "kind={{ item }}"

- name: Upsert and start anomaly detectors (idempotent by name, every run)
  ansible.builtin.command:
    cmd: "{{ dashboards_bootstrap_detectors_script }}"
  environment:
    OS_URL: "http://localhost:{{ opensearch_http_port }}"
    DETECTORS_DIR: "{{ dashboards_bootstrap_detectors_dir }}"
    AD_METRICS_WINDOW_DELAY_MINUTES: "{{ ad_metrics_window_delay_minutes }}"
    AD_LOG_WINDOW_DELAY_MINUTES: "{{ ad_log_window_delay_minutes }}"
  changed_when: true

- name: Upsert and start the disk-fill forecaster (idempotent by name, every run)
  ansible.builtin.command:
    cmd: "{{ dashboards_bootstrap_forecasters_script }}"
  environment:
    OS_URL: "http://localhost:{{ opensearch_http_port }}"
    FORECASTERS_DIR: "{{ dashboards_bootstrap_forecasters_dir }}"
    FORECAST_INTERVAL_MINUTES: "{{ forecast_interval_minutes }}"
    FORECAST_WINDOW_DELAY_MINUTES: "{{ forecast_window_delay_minutes }}"
    FORECAST_HORIZON: "{{ forecast_horizon }}"
    FORECAST_HISTORY: "{{ forecast_history }}"
    FORECAST_MAX_PRIMARY_SHARDS: "{{ forecast_max_primary_shards }}"
    FORECAST_RESULT_RETENTION: "{{ forecast_result_retention }}"
  changed_when: true

- name: Remove the bootstrap seed documents now that every detector exists (templates.sh re-seeds on the next run, before the detector update)
  ansible.builtin.uri:
    url: "http://localhost:{{ opensearch_http_port }}/{{ item }}/_doc/alice-bootstrap-seed?refresh=true"
    method: DELETE
    status_code: [200, 404]
  register: _seed_cleanup
  failed_when: false
  loop: "{{ ['infologger', 'generic-log-other']
            + (groups['workers']
               | map('extract', hostvars, 'node_id')
               | map('regex_replace', '^(.*)$', 'generic-log-info-\\1')
               | list) }}"

- name: Report bootstrap seed cleanup (a leftover seed is inert, so this never fails the deploy)
  ansible.builtin.debug:
    msg: >-
      {{ item.item }} -> HTTP {{ item.status | default('unreachable') }}
      {{ '(removed)' if item.status | default(0) == 200
         else '(already absent)' if item.status | default(0) == 404
         else '(LEFT IN PLACE — harmless: no host, node or severity field, so it forms no entity anywhere)' }}
  loop: "{{ _seed_cleanup.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Verify the detection layer (monitors, detectors, ISM)
  ansible.builtin.command:
    cmd: "python3 {{ dashboards_bootstrap_verify_script }}"
  environment:
    OS_URL: "http://localhost:{{ opensearch_http_port }}"
    EXPECTED_MONITORS: "{{ expected_monitors }}"
    EXPECTED_DETECTORS: "{{ expected_detectors }}"
    EXPECTED_FORECASTERS: "{{ expected_forecasters }}"
    ROLLUP_INDEX: "{{ trend_rollup_index }}"
    METRICS_INDEX: "{{ cockpit_metrics_index }}"
    ROSTER_INDEX: "{{ fleet_roster_index }}"
    SIGNALS_INDEX: "{{ signals_index }}"
    INCIDENTS_INDEX: "{{ incidents_index }}"
    NOTIFICATIONS_INDEX: "{{ notifications_index }}"
    LANE_STATE_INDEX: "{{ lane_state_index }}"
    SIGNAL_CATALOG: "{{ dashboards_bootstrap_signal_catalog }}"
    ALERTING_MAX_ACTIONABLE_ALERT_COUNT: "{{ alerting_max_actionable_alert_count }}"
    EXPECT_PUSH_HEARTBEATS: "false"
    DETECTORS_DIR: "{{ dashboards_bootstrap_detectors_dir }}"
  changed_when: false
