- name: Wait for the metrics poller to land its first documents in {{ cockpit_metrics_index }}
  ansible.builtin.uri:
    url: "http://localhost:{{ opensearch_http_port }}/{{ cockpit_metrics_index }}/_count"
    method: POST
    body_format: json
    body:
      query:
        term:
          kind: "{{ item }}"
    status_code: [200, 404]
  register: _metrics_seeded
  until: (_metrics_seeded.json.count | default(0) | int) > 0
  retries: 20
  delay: 6
  loop:
    - node
    - fluentbit
    - osd
  loop_control:
    label: "kind={{ item }}"

- name: Upsert and start anomaly detectors (idempotent by name, every run)
  ansible.builtin.command:
    cmd: "{{ dashboards_bootstrap_detectors_script }}"
  environment:
    OS_URL: "http://localhost:{{ opensearch_http_port }}"
    DETECTORS_DIR: "{{ dashboards_bootstrap_detectors_dir }}"
    AD_METRICS_WINDOW_DELAY_MINUTES: "{{ ad_metrics_window_delay_minutes }}"
    AD_LOG_WINDOW_DELAY_MINUTES: "{{ ad_log_window_delay_minutes }}"
  changed_when: true

- name: Verify the detection layer (monitors, detectors, ISM)
  ansible.builtin.command:
    cmd: "python3 {{ dashboards_bootstrap_verify_script }}"
  environment:
    OS_URL: "http://localhost:{{ opensearch_http_port }}"
    EXPECTED_MONITORS: "{{ expected_monitors }}"
    EXPECTED_DETECTORS: "{{ expected_detectors }}"
    ROLLUP_INDEX: "{{ trend_rollup_index }}"
    DETECTORS_DIR: "{{ dashboards_bootstrap_detectors_dir }}"
  changed_when: false
