- name: Ensure the bootstrap scripts directory exists
  ansible.builtin.file:
    path: "{{ dashboards_bootstrap_root }}"
    state: directory
    owner: root
    group: root
    # DynamicUser services need to traverse this directory to read the one
    # public, non-secret signal catalog below.  Scripts and definitions keep
    # their own root-only modes.
    mode: "0755"

- name: Render the tier-aware OpenSearch index-template bootstrap script
  ansible.builtin.template:
    src: templates.sh.j2
    dest: "{{ dashboards_bootstrap_templates_script }}"
    owner: root
    group: root
    mode: "0750"

- name: Render the Dashboards index-pattern bootstrap script
  ansible.builtin.template:
    src: patterns.sh.j2
    dest: "{{ dashboards_bootstrap_patterns_script }}"
    owner: root
    group: root
    mode: "0750"

- name: Render the alerting monitors bootstrap script
  ansible.builtin.template:
    src: alerting.sh.j2
    dest: "{{ dashboards_bootstrap_alerting_script }}"
    owner: root
    group: root
    mode: "0750"

- name: Render the anomaly detectors bootstrap script
  ansible.builtin.template:
    src: detectors.sh.j2
    dest: "{{ dashboards_bootstrap_detectors_script }}"
    owner: root
    group: root
    mode: "0750"

- name: Render the ISM retention bootstrap script
  ansible.builtin.template:
    src: ism.sh.j2
    dest: "{{ dashboards_bootstrap_ism_script }}"
    owner: root
    group: root
    mode: "0750"

- name: Stage monitor definitions
  ansible.builtin.copy:
    src: monitors/
    dest: "{{ dashboards_bootstrap_monitors_dir }}/"
    owner: root
    group: root
    mode: "0640"

- name: Stage detector definitions
  ansible.builtin.copy:
    src: detectors/
    dest: "{{ dashboards_bootstrap_detectors_dir }}/"
    owner: root
    group: root
    mode: "0640"

- name: Stage the signal identity catalog (one explicit per-monitor and per-detector classifier, never inferred from an index name)
  ansible.builtin.copy:
    src: signal_catalog.json
    dest: "{{ dashboards_bootstrap_signal_catalog }}"
    owner: root
    group: root
    # alice-anomaly-digest and alice-signal-projector use DynamicUser=true,
    # so neither can join a stable Unix group.  The catalog contains only
    # public classifiers, never credentials; make that file readable while
    # leaving the neighboring detector/monitor definitions root-only.
    mode: "0644"

- name: Prove a sandbox-style unprivileged service can read and parse the signal identity catalog
  ansible.builtin.command:
    argv:
      - /usr/sbin/runuser
      - -u
      - nobody
      - --
      - /usr/bin/python3
      - -c
      - "import json; json.load(open('{{ dashboards_bootstrap_signal_catalog }}'))"
  changed_when: false

- name: Ensure the control-node app root exists
  ansible.builtin.file:
    path: "{{ dashboards_app_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Stage the shared PIT/search_after cursor and identity modules beside the services that import them
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - {src: os_cursor.py, dest: "{{ dashboards_os_cursor_script }}"}
    - {src: signal_identity.py, dest: "{{ dashboards_signal_identity_script }}"}
    - {src: roster_publish.py, dest: "{{ dashboards_roster_publish_script }}"}
    - {src: discover_roster.py, dest: "{{ dashboards_discover_roster_script }}"}
    - {src: score_injection.py, dest: "{{ dashboards_score_injection_script }}"}
  loop_control:
    label: "{{ item.dest }}"
  notify:
    - restart alice-metrics
    - restart alice-signal-projector

- name: Stage the detection-layer verify script
  ansible.builtin.copy:
    src: verify_detection.py
    dest: "{{ dashboards_bootstrap_verify_script }}"
    owner: root
    group: root
    mode: "0750"

- name: Stage the ALICE Cockpit saved-objects NDJSON
  ansible.builtin.copy:
    src: cockpit.ndjson
    dest: "{{ dashboards_bootstrap_cockpit_ndjson }}"
    owner: root
    group: root
    mode: "0640"

- name: Stage the index-pattern field-catalog hydration script
  ansible.builtin.copy:
    src: hydrate_patterns.py
    dest: "{{ dashboards_bootstrap_hydrate_script }}"
    owner: root
    group: root
    mode: "0750"

- name: Apply index templates, ingest pipeline and pre-create all indices (idempotent, every run)
  ansible.builtin.command:
    cmd: "{{ dashboards_bootstrap_templates_script }}"
  environment:
    OS_URL: "http://localhost:{{ opensearch_http_port }}"
  changed_when: true

- name: Apply ISM retention policies (idempotent, every run)
  ansible.builtin.command:
    cmd: "{{ dashboards_bootstrap_ism_script }}"
  environment:
    OS_URL: "http://localhost:{{ opensearch_http_port }}"
  changed_when: true

- name: Create the per-source Dashboards index patterns (idempotent, every run)
  ansible.builtin.command:
    cmd: "{{ dashboards_bootstrap_patterns_script }}"
  environment:
    OSD_URL: "http://127.0.0.1:{{ dashboards_internal_port }}"
    OS_URL: "http://localhost:{{ opensearch_http_port }}"
  changed_when: true

- name: Import the ALICE Cockpit saved objects (idempotent overwrite, every run)
  ansible.builtin.command:
    argv:
      - curl
      - -s
      - -o
      - /tmp/cockpit-import.json
      - -w
      - "%{http_code}"
      - -XPOST
      - "http://127.0.0.1:{{ dashboards_internal_port }}/api/saved_objects/_import?overwrite=true"
      - -H
      - "osd-xsrf: true"
      - --form
      - "file=@{{ dashboards_bootstrap_cockpit_ndjson }}"
  register: _cockpit_import
  changed_when: true
  retries: 10
  delay: 6
  until: _cockpit_import.stdout is search('200')

- name: Verify the import succeeded for every saved object
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import json, sys
        expected = sum(1 for line in open("{{ dashboards_bootstrap_cockpit_ndjson }}") if line.strip())
        r = json.load(open("/tmp/cockpit-import.json"))
        ok = r.get("success") is True and r.get("successCount") == expected and not r.get("errors")
        print(f"import success={r.get('success')} count={r.get('successCount')}/{expected} errors={r.get('errors', [])}")
        sys.exit(0 if ok else 1)
  changed_when: false

- name: Hydrate every index pattern with its serialized field catalog
  ansible.builtin.command:
    cmd: "python3 {{ dashboards_bootstrap_hydrate_script }}"
  environment:
    OSD_URL: "http://127.0.0.1:{{ dashboards_internal_port }}"
    EXTRA_PATTERNS: "infologger,generic-log-info-*,generic-log-other"
  register: _hydrate
  changed_when: true

- name: Set the unified pattern as the default Discover index
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ dashboards_internal_port }}/api/opensearch-dashboards/settings/defaultIndex"
    method: POST
    headers:
      osd-xsrf: "true"
    body_format: json
    body:
      value: alice-unified
    status_code: [200]
  register: _set_default_index
  retries: 5
  delay: 3
  until: _set_default_index.status == 200

- name: Land users on the ALICE Cockpit dashboard by default
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ dashboards_internal_port }}/api/opensearch-dashboards/settings/defaultRoute"
    method: POST
    headers:
      osd-xsrf: "true"
    body_format: json
    body:
      value: "/app/dashboards#/view/alice-cockpit"
    status_code: [200]
  register: _set_default_route
  retries: 5
  delay: 3
  until: _set_default_route.status == 200

- name: Upsert alerting monitors (idempotent by name, every run)
  ansible.builtin.command:
    cmd: "{{ dashboards_bootstrap_alerting_script }}"
  environment:
    OS_URL: "http://localhost:{{ opensearch_http_port }}"
    MONITORS_DIR: "{{ dashboards_bootstrap_monitors_dir }}"
    AD_ANOMALY_GRADE_THRESHOLD: "{{ ad_anomaly_grade_threshold }}"
    AD_ANOMALY_CONFIDENCE_THRESHOLD: "{{ ad_anomaly_confidence_threshold }}"
    TREND_LAG_FLOOR_MS: "{{ trend_lag_floor_ms }}"
    TREND_ENTRY_LAG_CEILING_MS: "{{ trend_entry_lag_ceiling_ms }}"
    TREND_ENTITY_CAP: "{{ trend_entity_cap_warn }}"
    TREND_MIN_SLICE_DOCS: "{{ trend_min_slice_docs }}"
    TREND_MIN_SLICE_ERRORS: "{{ trend_min_slice_errors }}"
    TREND_MIN_LAG_DOCS: "{{ trend_min_lag_docs }}"
    FLEET_SILENCE_FRACTION: "{{ fleet_silence_fraction }}"
    ALERTING_MAX_ACTIONABLE_ALERT_COUNT: "{{ alerting_max_actionable_alert_count }}"
    BREAKGLASS_SINK_URL: "http://127.0.0.1:{{ notification_ingest_port }}/notifications"
  changed_when: true
