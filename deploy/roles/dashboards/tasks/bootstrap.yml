- name: Ensure the bootstrap scripts directory exists
  ansible.builtin.file:
    path: "{{ dashboards_bootstrap_root }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Render the tier-aware OpenSearch index-template bootstrap script
  ansible.builtin.template:
    src: templates.sh.j2
    dest: "{{ dashboards_bootstrap_templates_script }}"
    owner: root
    group: root
    mode: "0750"

- name: Render the Dashboards index-pattern bootstrap script
  ansible.builtin.template:
    src: patterns.sh.j2
    dest: "{{ dashboards_bootstrap_patterns_script }}"
    owner: root
    group: root
    mode: "0750"

- name: Stage the ALICE Cockpit saved-objects NDJSON
  ansible.builtin.copy:
    src: cockpit.ndjson
    dest: "{{ dashboards_bootstrap_cockpit_ndjson }}"
    owner: root
    group: root
    mode: "0640"

- name: Run the OpenSearch index-template/ISM bootstrap (one-shot, marker-guarded)
  ansible.builtin.command:
    cmd: "{{ dashboards_bootstrap_templates_script }}"
    creates: "{{ dashboards_bootstrap_templates_marker }}"
  environment:
    OS_URL: "http://localhost:{{ opensearch_http_port }}"
  changed_when: true
  notify: record templates bootstrap done

- name: Run the Dashboards index-pattern bootstrap (one-shot, marker-guarded)
  ansible.builtin.command:
    cmd: "{{ dashboards_bootstrap_patterns_script }}"
    creates: "{{ dashboards_bootstrap_patterns_marker }}"
  environment:
    OSD_URL: "http://127.0.0.1:{{ dashboards_internal_port }}"
    OS_URL: "http://localhost:{{ opensearch_http_port }}"
  changed_when: true
  notify: record patterns bootstrap done

- name: Import the ALICE Cockpit saved objects (idempotent overwrite, every run)
  ansible.builtin.command:
    argv:
      - curl
      - -s
      - -o
      - /tmp/cockpit-import.json
      - -w
      - "%{http_code}"
      - -XPOST
      - "http://127.0.0.1:{{ dashboards_internal_port }}/api/saved_objects/_import?overwrite=true"
      - -H
      - "osd-xsrf: true"
      - --form
      - "file=@{{ dashboards_bootstrap_cockpit_ndjson }}"
  register: _cockpit_import
  changed_when: true
  retries: 10
  delay: 6
  until: _cockpit_import.stdout is search('200')
  failed_when: false

- name: Set the unified pattern as the default Discover index
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ dashboards_internal_port }}/api/opensearch-dashboards/settings/defaultIndex"
    method: POST
    headers:
      osd-xsrf: "true"
    body_format: json
    body:
      value: alice-unified
    status_code: [200]
  register: _set_default_index
  retries: 5
  delay: 3
  until: _set_default_index.status == 200
  failed_when: false
