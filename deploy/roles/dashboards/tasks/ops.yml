- name: Ensure the app root exists for the control-node services
  ansible.builtin.file:
    path: "{{ dashboards_ops_script | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the ops trigger service script
  ansible.builtin.copy:
    src: ops_server.py
    dest: "{{ dashboards_ops_script }}"
    owner: root
    group: root
    mode: "0755"
  notify: restart alice-ops

- name: Create the poison-replay state and report directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ dashboards_poison_replay_state_dir }}"
    - "{{ dashboards_poison_replay_report_dir }}"

- name: Install the controlled poison-replay calibration script
  ansible.builtin.copy:
    src: poison_replay.py
    dest: "{{ dashboards_poison_replay_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Template the one-shot poison-replay systemd unit
  ansible.builtin.template:
    src: alice-poison-replay.service.j2
    dest: /etc/systemd/system/{{ dashboards_poison_replay_service_name }}.service
    owner: root
    group: root
    mode: "0644"

- name: Install the fresh-replay reset script (used by both make replay-fresh and the ops page button)
  ansible.builtin.copy:
    src: reset_derived.py
    dest: "{{ dashboards_reset_derived_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Template the alice-ops systemd unit
  ansible.builtin.template:
    src: alice-ops.service.j2
    dest: /etc/systemd/system/{{ dashboards_ops_service_name }}.service
    owner: root
    group: root
    mode: "0644"
  notify: restart alice-ops

- name: Enable and start alice-ops
  ansible.builtin.systemd:
    name: "{{ dashboards_ops_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
