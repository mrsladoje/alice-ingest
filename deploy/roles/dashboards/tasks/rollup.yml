- name: Install the trend rollup script
  ansible.builtin.copy:
    src: trend_rollup.py
    dest: "{{ dashboards_trend_rollup_script }}"
    owner: root
    group: root
    mode: "0755"
  notify: restart alice-trend-rollup

- name: Template the alice-trend-rollup systemd unit
  ansible.builtin.template:
    src: alice-trend-rollup.service.j2
    dest: /etc/systemd/system/{{ dashboards_trend_rollup_service_name }}.service
    owner: root
    group: root
    mode: "0644"
  notify: restart alice-trend-rollup

- name: Enable and start alice-trend-rollup
  ansible.builtin.systemd:
    name: "{{ dashboards_trend_rollup_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Flush handlers so a restarted rollup is asserted, not the old process
  ansible.builtin.meta: flush_handlers

- name: Assert alice-trend-rollup stayed up (the whole trend lane depends on it)
  ansible.builtin.systemd:
    name: "{{ dashboards_trend_rollup_service_name }}"
  register: _trend_rollup_state
  retries: 6
  delay: 5
  until: _trend_rollup_state.status.ActiveState == "active"
