- name: Install the metrics poller script
  ansible.builtin.copy:
    src: metrics_poller.py
    dest: "{{ dashboards_metrics_script }}"
    owner: root
    group: root
    mode: "0755"
  notify: restart alice-metrics

- name: Template the alice-metrics systemd unit
  ansible.builtin.template:
    src: alice-metrics.service.j2
    dest: /etc/systemd/system/{{ dashboards_metrics_service_name }}.service
    owner: root
    group: root
    mode: "0644"
  notify: restart alice-metrics

- name: Enable and start alice-metrics
  ansible.builtin.systemd:
    name: "{{ dashboards_metrics_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Purge cockpit-metrics samples for Fluent Bit collectors outside the current roster
  ansible.builtin.uri:
    url: "http://localhost:{{ opensearch_http_port }}/{{ cockpit_metrics_index }}/_delete_by_query?refresh=true&conflicts=proceed"
    method: POST
    body_format: json
    body:
      query:
        bool:
          filter:
            - term:
                kind: fluentbit
          must_not:
            - terms:
                collector_id: "{{ groups['workers'] | map('extract', hostvars, 'node_id') | list }}"
    status_code: [200, 404]
  register: _fb_roster_purge
  changed_when: (_fb_roster_purge.json.deleted | default(0) | int) > 0

- name: Report the purge
  ansible.builtin.debug:
    msg: "removed {{ _fb_roster_purge.json.deleted | default(0) }} Fluent Bit samples for collectors not in {{ groups['workers'] | map('extract', hostvars, 'node_id') | list }}"
