- name: Install the metrics poller script
  ansible.builtin.copy:
    src: metrics_poller.py
    dest: "{{ dashboards_metrics_script }}"
    owner: root
    group: root
    mode: "0755"
  notify: restart alice-metrics

- name: Template the alice-metrics systemd unit
  ansible.builtin.template:
    src: alice-metrics.service.j2
    dest: /etc/systemd/system/{{ dashboards_metrics_service_name }}.service
    owner: root
    group: root
    mode: "0644"
  notify: restart alice-metrics

- name: Enable and start alice-metrics
  ansible.builtin.systemd:
    name: "{{ dashboards_metrics_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
