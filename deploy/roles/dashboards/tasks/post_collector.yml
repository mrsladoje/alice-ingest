- name: Wait for every rostered collector to push its Fluent Bit heartbeat
  ansible.builtin.uri:
    url: "http://localhost:{{ opensearch_http_port }}/{{ cockpit_metrics_index }}/_count"
    method: POST
    body_format: json
    body:
      query:
        bool:
          filter:
            - term:
                kind: fluentbit
            - term:
                collector_id: "{{ hostvars[item].node_id }}"
            - range:
                "@timestamp":
                  gte: now-5m
    status_code: [200, 404]
  register: _collector_heartbeat
  until: (_collector_heartbeat.json.count | default(0) | int) > 0
  retries: 20
  delay: 6
  loop: "{{ groups['workers'] }}"
  loop_control:
    label: "{{ hostvars[item].node_id }}"
  when: collector_health_push_enabled | bool

- name: Verify the complete detection layer after collector cutover
  ansible.builtin.command:
    cmd: "python3 {{ dashboards_bootstrap_verify_script }}"
  environment:
    OS_URL: "http://localhost:{{ opensearch_http_port }}"
    EXPECTED_MONITORS: "{{ expected_monitors }}"
    EXPECTED_DETECTORS: "{{ expected_detectors }}"
    EXPECTED_FORECASTERS: "{{ expected_forecasters }}"
    ROLLUP_INDEX: "{{ trend_rollup_index }}"
    METRICS_INDEX: "{{ cockpit_metrics_index }}"
    ROSTER_INDEX: "{{ fleet_roster_index }}"
    DIGEST_INDEX: "{{ anomaly_digest_index }}"
    SIGNALS_INDEX: "{{ signals_index }}"
    INCIDENTS_INDEX: "{{ incidents_index }}"
    NOTIFICATIONS_INDEX: "{{ notifications_index }}"
    LANE_STATE_INDEX: "{{ lane_state_index }}"
    SIGNAL_CATALOG: "{{ dashboards_bootstrap_signal_catalog }}"
    ALERTING_MAX_ACTIONABLE_ALERT_COUNT: "{{ alerting_max_actionable_alert_count }}"
    EXPECT_PUSH_HEARTBEATS: "{{ collector_health_push_enabled | bool | ternary('true', 'false') }}"
  changed_when: false
