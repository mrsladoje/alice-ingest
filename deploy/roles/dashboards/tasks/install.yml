- name: Add the official OpenSearch Dashboards yum repository
  ansible.builtin.yum_repository:
    name: opensearch-dashboards
    description: OpenSearch Dashboards Repository
    baseurl: "https://artifacts.opensearch.org/releases/bundle/opensearch-dashboards/{{ opensearch_version.split('.')[0] }}.x/yum"
    enabled: true
    gpgcheck: true
    repo_gpgcheck: false
    gpgkey: https://artifacts.opensearch.org/publickeys/opensearch-release.pgp

- name: Import the OpenSearch RPM GPG signing key into the rpm keyring
  ansible.builtin.rpm_key:
    state: present
    key: https://artifacts.opensearch.org/publickeys/opensearch-release.pgp

- name: Install OpenSearch Dashboards {{ opensearch_version }}
  ansible.builtin.dnf:
    name: "opensearch-dashboards-{{ opensearch_version }}"
    state: present
