# Which of the role's two jobs this host does. site.yml turns it on for the one
# play that runs against the control host, after the rolling health gate.
opensearch_configure_cluster: false

# The version is declared here as well as in group_vars/all.yml, because the two
# defaults below interpolate it. A role whose own defaults reference a variable
# it does not declare cannot run outside this repository. group_vars/all.yml
# carries the site value and outranks this line; the dashboards role reads the
# same name to pin its own RPM, so the two products stay on one version.
opensearch_version: "3.7.0"

opensearch_yum_repo_baseurl: "https://artifacts.opensearch.org/releases/bundle/opensearch/{{ opensearch_version.split('.')[0] }}.x/yum"
opensearch_yum_repo_gpgkey: "https://artifacts.opensearch.org/publickeys/opensearch-release.pgp"

opensearch_package: "opensearch-{{ opensearch_version }}"

opensearch_install_method: native

opensearch_instance_id: default

opensearch_container_image: "docker.io/opensearchproject/opensearch:{{ opensearch_version }}"
opensearch_container_name: "opensearch-{{ opensearch_instance_id }}"
opensearch_container_config_dir: /usr/share/opensearch/config
opensearch_container_data_path: /usr/share/opensearch/data
opensearch_container_log_path: /usr/share/opensearch/logs
opensearch_container_uid: 1000
opensearch_container_gid: 1000
opensearch_quadlet_dir: /etc/containers/systemd
opensearch_container_runtime_packages:
  - podman
opensearch_container_min_podman_version: "4.4"
opensearch_container_start_timeout_seconds: 900

opensearch_service_name: "{{ 'opensearch' if opensearch_install_method == 'native' else opensearch_container_name }}"

opensearch_service_enabled: "{{ opensearch_install_method == 'native' }}"

# Supplied by the playbook. The role names no inventory group of its own, so
# these three arrive as plain lists resolved in group_vars/all.yml.
opensearch_cluster_hosts: []
opensearch_seed_hosts: []
opensearch_initial_cluster_manager_nodes: []

opensearch_transport_port: 9300

opensearch_vm_max_map_count: 262144
opensearch_sysctl_conf_file: /etc/sysctl.d/99-opensearch.conf

opensearch_data_path: "{{ '/var/lib/opensearch' if opensearch_install_method == 'native' else '/var/lib/opensearch/' ~ opensearch_instance_id }}"
opensearch_log_path: "{{ '/var/log/opensearch' if opensearch_install_method == 'native' else '/var/log/opensearch/' ~ opensearch_instance_id }}"

opensearch_path_data_setting: "{{ opensearch_data_path if opensearch_install_method == 'native' else opensearch_container_data_path }}"
opensearch_path_logs_setting: "{{ opensearch_log_path if opensearch_install_method == 'native' else opensearch_container_log_path }}"

opensearch_dir_owner: "{{ opensearch_user if opensearch_install_method == 'native' else opensearch_container_uid }}"
opensearch_dir_group: "{{ opensearch_group if opensearch_install_method == 'native' else opensearch_container_gid }}"

# Declared here rather than in group_vars/all.yml so that a group or host
# assignment in inventory.yml actually wins. Role defaults rank below every
# group var; a name that also exists in group_vars/all.yml cannot be overridden
# from inside the inventory file.
opensearch_heap_size: "1g"

# Reference only, read by nobody. The measured EPN-farm worker value: a soak
# swept 1, 2 and 3 GB over two burst shapes and found no difference, because
# the queue that absorbs a burst is Fluent Bit's, upstream of this heap.
opensearch_worker_heap_size: "1g"

# A cap, never a floor — opensearch.yml.j2 takes the smaller of this and the
# processors the machine really has.
opensearch_worker_processors: 4
opensearch_worker_index_buffer_size: "5%"

opensearch_limit_nofile: 65536

# A cpuset, written as systemd writes it: logical processor numbers, both
# threads of every physical core. Empty means no reservation. The farm needs a
# reservation rather than a share weight, because a weight limits the average
# and lets a neighbour win the burst.
#
# On a worker this holds the collector AND this node together. The soak
# measured splitting them apart and found no effect, so they share one set.
opensearch_cpuset: ""

# The cgroup memory bounds on the unit, the same two names on both install
# paths: the RPM's drop-in and the quadlet unit each read them.
# The farm requires a hard MemoryMax on every service placed on a shared EPN
# node. Empty leaves the unit unbounded. Keep MemoryMax well above the heap:
# the JVM needs direct buffers and metaspace on top of it, and a container
# that cannot fit its heap does not start.
opensearch_memory_high: ""
opensearch_memory_max: ""

# The cluster runs without the security plugin, so every port it opens is
# unauthenticated and firewalld is the only boundary. Turning this off means
# providing TLS material, an internal user database and a role mapping, none of
# which this role holds.
opensearch_security_disabled: true

# Addresses the node binds. _local_ keeps the loopback listener the collector
# and the cluster configuration scripts use; ansible_host is added by the template.
opensearch_network_host:
  - _local_

# First boot on a fresh install has to unpack, start a JVM and form a cluster.
# 60 attempts at 5 seconds allows 5 minutes.
opensearch_boot_wait_retries: 60
opensearch_boot_wait_delay: 5

# The anomaly-detection plugin answers as soon as its REST handler registers,
# which is later than the HTTP port opening.
opensearch_ad_api_retries: 10
opensearch_ad_api_delay: 3

opensearch_user: opensearch
opensearch_group: opensearch

opensearch_home: /usr/share/opensearch
opensearch_plugin_bin: "{{ opensearch_home }}/bin/opensearch-plugin"
opensearch_plugin_list_cmd: "{{ opensearch_plugin_bin ~ ' list' if opensearch_install_method == 'native' else 'podman exec ' ~ opensearch_container_name ~ ' opensearch-plugin list' }}"
opensearch_config_dir: "{{ '/etc/opensearch' if opensearch_install_method == 'native' else '/etc/opensearch/' ~ opensearch_instance_id }}"
opensearch_jvm_options_d: "{{ opensearch_config_dir }}/jvm.options.d"
opensearch_systemd_dropin_dir: "/etc/systemd/system/{{ opensearch_service_name }}.service.d"

# The info-tier index settings this cluster publishes to its nodes, so a worker
# registering itself at boot writes the same template the control host writes.
#
# The retention policy name is deliberately NOT a variable here. The policy is
# created by name in the sweet_opensearch role (ism.sh.j2) and asserted by
# name in verify_detection.py, and register_node.sh falls back to the same
# literal. A variable would only let this end of the pair move.
opensearch_node_env_dir: /etc/sweet
opensearch_node_env_file: "{{ opensearch_node_env_dir }}/opensearch-node.env"

# The worker's own boot-time self-heal, and the rendered index template it reads.
# Installed by the install mode on workers; fluent-bit.service names the script as
# its ExecStartPre, the way its unit already names opensearch-node.env.
opensearch_register_script: /opt/sweet/register_node.sh
opensearch_register_script_dir: /opt/sweet
opensearch_local_index_template_file: "{{ opensearch_node_env_dir }}/local-index-template.json"

opensearch_required_plugins:
  - opensearch-anomaly-detection
  - opensearch-alerting
  - opensearch-notifications
  - opensearch-notifications-core
  - opensearch-job-scheduler
  - opensearch-index-management
  - opensearch-sql

# Repeated in every role that writes a firewalld rule, so each role still
# stands on its own and one inventory line can switch the whole stack. See
# roles/common/defaults/main.yml for why the EPN farm sets this false.
alice_manage_firewalld: true

# ---------------------------------------------------------------------------
# Configure the cluster — read only when opensearch_configure_cluster is true.
# ---------------------------------------------------------------------------

# The shared script directory. The alice_runtime role writes its own
# scripts into the same directory and creates it with the same owner, group and
# mode, so neither role owns it and the two cannot drift.
opensearch_cluster_config_root: /opt/sweet/init

opensearch_cluster_config_templates_script: "{{ opensearch_cluster_config_root }}/templates.sh"

# templates.sh reads every request body from here, as "$(dirname "$0")/schema".
# One file per OpenSearch object; the name prefix is the kind.
opensearch_cluster_config_schema_root: "{{ opensearch_cluster_config_root }}/schema"
opensearch_cluster_config_ism_script: "{{ opensearch_cluster_config_root }}/ism.sh"

# Supplied by the playbook. The role names no inventory group of its own.
opensearch_cluster_config_worker_node_ids: []
