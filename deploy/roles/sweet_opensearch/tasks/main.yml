# Two disjoint jobs, and a host does exactly one of them.
#
#   node             configures this machine and starts its OpenSearch. Runs on
#                    all five, and site.yml gates the batch behind a rolling
#                    health check before anything reads the cluster.
#   cluster_bootstrap applies the schema and the retention policies. Cluster-wide
#                    and idempotent, so it must run once, on the control host,
#                    and only after that gate.
#
# The two cannot share a play: the bootstrap needs a cluster that already
# answers, which is not true while the batch is still coming up.

- name: Configure this node and start its OpenSearch
  ansible.builtin.include_tasks: node.yml
  when: not (opensearch_cluster_bootstrap | bool)

- name: Apply the cluster-wide schema, settings and retention (control host, once)
  ansible.builtin.include_tasks: cluster_bootstrap.yml
  when: opensearch_cluster_bootstrap | bool
