- name: Set vm.max_map_count for OpenSearch (persistent + live)
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "{{ opensearch_vm_max_map_count | string }}"
    sysctl_file: "{{ opensearch_sysctl_conf_file }}"
    sysctl_set: true
    state: present
    reload: true

- name: Install OpenSearch natively from the vendor RPM
  ansible.builtin.include_tasks: install_native.yml
  when: opensearch_install_method == 'native'

- name: Prepare the container runtime on this machine and pull the image once
  ansible.builtin.include_tasks: container_runtime.yml
  when: opensearch_install_method == 'container'

- name: Ensure the shared per-node environment directory exists
  ansible.builtin.file:
    path: "{{ opensearch_node_env_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: >-
    Publish the info-tier index settings register_node.sh needs — these are
    index settings, so they are owned here rather than by the collector whose
    unit happens to load them
  ansible.builtin.template:
    src: opensearch-node.env.j2
    dest: "{{ opensearch_node_env_file }}"
    owner: root
    group: root
    mode: "0644"

- name: >-
    Install the worker's boot-time self-heal and the index template it reads —
    fluent-bit.service names this script as its ExecStartPre, the way its unit
    already names opensearch-node.env
  when: node_tier == 'worker'
  block:
    - name: Ensure the directory that holds the registration script exists
      ansible.builtin.file:
        path: "{{ opensearch_register_script_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Render this worker's own local index template
      ansible.builtin.template:
        src: schema-per-worker/index-logs-application-local.json.j2
        dest: "{{ opensearch_local_index_template_file }}"
        owner: root
        group: root
        mode: "0644"
      vars:
        node: "{{ node_id }}"

    - name: Install the node self-registration script
      ansible.builtin.copy:
        src: register_node.sh
        dest: "{{ opensearch_register_script }}"
        owner: root
        group: root
        mode: "0755"

- name: Configure, start and prove every OpenSearch instance this machine carries
  ansible.builtin.include_tasks: instance.yml
  loop: "{{ opensearch_instances }}"
  loop_control:
    loop_var: opensearch_instance
    label: "{{ opensearch_instance.id }}"
