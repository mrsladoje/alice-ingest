- name: Ensure this instance's configuration directory exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ opensearch_config_dir }}"
    - "{{ opensearch_jvm_options_d }}"

- name: Template the quadlet unit for this instance
  ansible.builtin.template:
    src: opensearch.container.j2
    dest: "{{ opensearch_quadlet_dir }}/{{ opensearch_container_name }}.container"
    owner: root
    group: root
    mode: "0644"
  register: _opensearch_unit
