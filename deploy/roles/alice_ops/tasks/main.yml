- name: Ops trigger service (replay button) behind nginx
  ansible.builtin.import_tasks: ops.yml

- name: Stage the shared PIT/search_after cursor and identity modules beside the services that import them
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - {src: score_injection.py, dest: "{{ dashboards_score_injection_script }}"}
  loop_control:
    label: "{{ item.dest }}"
  notify:
    - restart alice-metrics
