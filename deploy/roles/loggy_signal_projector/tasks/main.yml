- name: Ensure the app root and the catalog directory exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ alice_app_root }}"
    - "{{ alice_bootstrap_root }}"

- name: Stage the signal identity catalog (one explicit per-monitor and per-detector classifier, never inferred from an index name)
  ansible.builtin.copy:
    src: signal_catalog.json
    dest: "{{ alice_bootstrap_signal_catalog }}"
    owner: root
    group: root
    mode: "0644"
  register: _projector_remote_catalog

- name: Prove a sandbox-style unprivileged service can read and parse the signal identity catalog
  ansible.builtin.command:
    argv:
      - /usr/sbin/runuser
      - -u
      - nobody
      - --
      - /usr/bin/python3
      - -c
      - "import json; json.load(open('{{ alice_bootstrap_signal_catalog }}'))"
  changed_when: false

- name: Stage the causal edges (one declaration per edge; proven decides whether it explains or suppresses)
  ansible.builtin.copy:
    src: causal_edges.json
    dest: "{{ alice_bootstrap_causal_edges }}"
    owner: root
    group: root
    mode: "0644"
  register: _projector_remote_edges

- name: Verify the staged causal edges parse and every edge is complete
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - >-
        import json,sys;
        d=json.load(open('{{ alice_bootstrap_causal_edges }}'));
        e=d['edges'];
        bad=[x for x in e if not x.get('cause') or not x.get('symptom')
             or not x.get('equal') or 'proven' not in x];
        sys.exit('incomplete causal edges: %s' % bad[:3] if bad else 0)
  changed_when: false

- name: Stage the cursor and identity modules the projector imports
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - {src: os_cursor.py, dest: "{{ alice_os_cursor_script }}"}
    - {src: signal_identity.py, dest: "{{ alice_signal_identity_script }}"}
  loop_control:
    label: "{{ item.dest }}"
  register: _projector_remote_modules

- name: Install the signal projector script on the projector host
  ansible.builtin.copy:
    src: signal_projector.py
    dest: "{{ signal_projector_script }}"
    owner: root
    group: root
    mode: "0755"
  register: _projector_remote_script

- name: Template the signal projector systemd unit on the projector host
  ansible.builtin.template:
    src: alice-signal-projector.service.j2
    dest: /etc/systemd/system/{{ signal_projector_service_name }}.service
    owner: root
    group: root
    mode: "0644"
  register: _projector_remote_unit

- name: Prove the projector host can reach Alertmanager before starting the projector
  ansible.builtin.uri:
    url: "http://{{ alertmanager_host_address }}:{{ alertmanager_port }}/-/ready"
    status_code: [200]
  register: _remote_alertmanager_ready
  retries: 12
  delay: 5
  until: _remote_alertmanager_ready.status == 200

- name: Enable and start the projector, restarting it only when its inputs changed
  ansible.builtin.systemd:
    name: "{{ signal_projector_service_name }}"
    enabled: true
    state: >-
      {{ 'restarted'
         if ((_projector_remote_modules.changed | default(false))
             or (_projector_remote_catalog.changed | default(false))
             or (_projector_remote_edges.changed | default(false))
             or (_projector_remote_script.changed | default(false))
             or (_projector_remote_unit.changed | default(false)))
         else 'started' }}
    daemon_reload: true

- name: Read the projector memory bounds from the running systemd unit
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - show
      - "{{ signal_projector_service_name }}"
      - --property=MemoryHigh
      - --property=MemoryMax
  register: _projector_memory_bounds
  changed_when: false

- name: Assert the projector is actually running inside finite memory bounds
  ansible.builtin.assert:
    that:
      - >-
        (_projector_memory_bounds.stdout |
        regex_search('(?m)^MemoryHigh=[1-9][0-9]*$')) is not none
      - >-
        (_projector_memory_bounds.stdout |
        regex_search('(?m)^MemoryMax=[1-9][0-9]*$')) is not none
    fail_msg: >-
      The running projector has no finite systemd memory bounds:
      {{ _projector_memory_bounds.stdout_lines | default([]) }}
    success_msg: >-
      The projector is bounded by
      {{ _projector_memory_bounds.stdout_lines | default([]) | join(', ') }}.

- name: Record the earliest acceptable projector heartbeat time
  ansible.builtin.command:
    argv:
      - /usr/bin/date
      - -u
      - +%Y-%m-%dT%H:%M:%S.000Z
  register: _projector_gate_started
  changed_when: false

- name: Prove the signal projector completed a cycle
  block:
    - name: Confirm this node's OpenSearch still answers before waiting on the projector
      ansible.builtin.uri:
        url: "http://localhost:{{ opensearch_http_port }}/_cluster/health?timeout=5s"
        timeout: 10
        status_code: 200
      register: _os_alive
      until: _os_alive.status == 200
      retries: 6
      delay: 5

    # The projector writes its heartbeat only after a full cycle returns, and
    # the first cycle after a restart reads the whole overlap window. That
    # takes minutes, which is what projector_gate_retries has to cover.
    - name: Wait for the newest signal-projector heartbeat to prove a successful cycle
      ansible.builtin.uri:
        url: "http://localhost:{{ opensearch_http_port }}/{{ cockpit_metrics_index }}/_search"
        method: POST
        body_format: json
        body:
          size: 1
          sort:
            - "@timestamp": desc
          query:
            bool:
              filter:
                - term:
                    kind: projector
                - range:
                    "@timestamp":
                      gte: "{{ _projector_gate_started.stdout }}"
        status_code: 200
        timeout: 10
      register: _projector_heartbeat
      until:
        - (_projector_heartbeat.json.hits.hits | default([]) | length) == 1
        - >-
          (((_projector_heartbeat.json.hits.hits | default([]) | first | default({})).get('_source', {})).get('projector_cycle_ok', 0) | int)
          == 1
      retries: "{{ projector_gate_retries }}"
      delay: "{{ projector_gate_delay }}"

  rescue:
    - name: Collect why the projector produced no heartbeat
      ansible.builtin.shell:
        cmd: "{{ item }}"
      loop:
        - "systemctl status {{ signal_projector_service_name }} --no-pager | tail -20"
        - "systemctl show {{ signal_projector_service_name }} --property=Result --property=NRestarts --property=MemoryCurrent --property=MemoryPeak --property=ExecMainStatus"
        - "journalctl -u {{ signal_projector_service_name }} -n 60 --no-pager"
        - "journalctl -k -n 100 --no-pager | grep -Ei 'oom|out of memory|killed process' | tail -20"
        - "free -m"
        - "swapon --show"
        - "systemctl status opensearch --no-pager | tail -12"
        - "journalctl -u opensearch -n 40 --no-pager"
        - "curl -s -m 5 'http://localhost:{{ opensearch_http_port }}/_cluster/health?pretty' || echo 'OpenSearch did not answer within 5s'"
        - >-
          curl -s -m 5
          'http://localhost:{{ opensearch_http_port }}/_cat/nodes?v&h=name,heap.percent,ram.percent,cpu,node.role'
          || echo 'OpenSearch did not answer within 5s'
        - >-
          curl -s -m 10 -H 'Content-Type: application/json'
          'http://localhost:{{ opensearch_http_port }}/{{ cockpit_metrics_index }}/_search?pretty'
          -d '{"size":3,"sort":[{"@timestamp":"desc"}],"query":{"term":{"kind":"projector"}}}'
          || echo 'OpenSearch did not answer within 10s'
        - >-
          curl -s -m 5
          'http://{{ alertmanager_host_address }}:{{ alertmanager_port }}/-/ready'
          || echo 'Alertmanager did not answer from the projector host within 5s'
        - "date -u +%Y-%m-%dT%H:%M:%S.000Z"
      register: _projector_why
      changed_when: false
      failed_when: false

    - name: Report why the projector produced no heartbeat
      ansible.builtin.debug:
        msg: "{{ (item.stdout_lines | default([])) }}"
      loop: "{{ _projector_why.results | default([]) }}"
      loop_control:
        label: "{{ item.item | default('') }}"

    - name: Record that the projector gate did not prove a cycle
      ansible.builtin.set_fact:
        projector_gate_failed: true
        projector_gate_started_at: "{{ _projector_gate_started.stdout }}"

    - name: Report the projector gate as unproven and continue so the rest of the deploy converges
      ansible.builtin.debug:
        msg: >-
          PROJECTOR GATE UNPROVEN — the signal projector wrote no
          successful-cycle heartbeat within
          {{ projector_gate_retries | int * projector_gate_delay | int }}s of
          {{ _projector_gate_started.stdout }}. The diagnosis is printed above.
          Read it in this order: the last three kind=projector documents say
          whether the projector ever writes at all and what projector_cycle_ok
          it reports; the node's own UTC clock beside them says whether the
          heartbeat timestamps are simply outside the window this gate asks
          for; free -m and swapon say whether the node ran out of memory during
          the cycle; the journal says whether the cycle raised. This does not
          stop the deploy — the remaining plays run, and the deploy still
          exits non-zero at the end so this is never mistaken for a pass.

- name: Assert the projector stayed up
  ansible.builtin.systemd:
    name: "{{ signal_projector_service_name }}"
  register: _projector_state
  retries: 6
  delay: 5
  until: _projector_state.status.ActiveState == "active"
