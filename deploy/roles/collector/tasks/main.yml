- name: Add official Fluent Bit yum repository (packages.fluentbit.io)
  ansible.builtin.yum_repository:
    name: fluent-bit
    description: Fluent Bit
    baseurl: "{{ collector_repo_baseurl }}"
    gpgcheck: true
    gpgkey: "{{ collector_repo_gpgkey }}"
    enabled: true

# Before the install, not after. A version that loses data at rotation must not
# be reachable by forgetting to set a variable.
- name: Refuse a Fluent Bit version known to lose data at rotation
  ansible.builtin.assert:
    that:
      - collector_allow_blocked_version | bool
        or not (fluent_bit_version is match('^(' ~ (collector_blocked_version_prefixes | map('regex_escape') | join('|')) ~ ')'))
    fail_msg: >-
      fluent_bit_version is {{ fluent_bit_version }}, which this repository
      refuses to install. 5.x loses bytes appended to a file after logrotate
      renames it away — see docs/SOAK_RESULTS.md round 10, where it is
      reproduced against 3.2.8, 4.0.1 and 4.0.14, none of which lose them.
      Pin a 4.x version, or set collector_allow_blocked_version to true if you
      have re-tested rotation on this build.
    quiet: true
  when: collector_blocked_version_prefixes | length > 0

- name: Install fluent-bit RPM (pinned to fluent_bit_version, matches images/node/Dockerfile)
  ansible.builtin.dnf:
    name: "{{ collector_service_name }}-{{ fluent_bit_version }}"
    state: present
    allow_downgrade: true

- name: >-
    {{ 'Open' if collector_metrics_scrape_open else 'Close' }} the Fluent Bit
    metrics endpoint ({{ fluent_bit_http_port }}/tcp) to the control node —
    after the push cutover nothing scrapes it, so the rule is removed and the
    endpoint is loopback-only
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv4"
      source address="{{ collector_metrics_scrape_source }}"
      port port="{{ fluent_bit_http_port }}" protocol="tcp"
      accept
    permanent: true
    immediate: true
    state: "{{ 'enabled' if collector_metrics_scrape_open else 'disabled' }}"
  when: alice_manage_firewalld

- name: Ensure the collector app root exists
  ansible.builtin.file:
    path: "{{ collector_health_script | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the Fluent Bit self-health sampler (run by the exec input, not by a second daemon)
  ansible.builtin.copy:
    src: fb_health.py
    dest: "{{ collector_health_script }}"
    owner: root
    group: root
    mode: "0755"
  notify: restart fluent-bit

- name: Ensure the per-node environment directory exists
  ansible.builtin.file:
    path: "{{ collector_env_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: >-
    Write the per-node environment file (rule R3 — this machine's identity stops
    living only in the central inventory, so it can register itself at boot)
  ansible.builtin.template:
    src: node.env.j2
    dest: "{{ collector_env_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: restart fluent-bit

- name: >-
    Install the node self-registration script (Item 3 — the same file the
    control host runs once per worker during the deploy)
  ansible.builtin.include_role:
    name: opensearch_local_index_registration
  vars:
    opensearch_local_index_registration_dest: "{{ collector_register_script }}"
    opensearch_local_index_registration_mode: "0755"
    opensearch_local_index_registration_notify:
      - restart fluent-bit

- name: Create the log directory tree the tail inputs watch ({{ log_root }})
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ log_root }}"
    - "{{ log_root }}/dds"
    # The replay engine creates <host>/ under here itself, one directory per
    # EPN, one file per process. That is what carries the program name.
    - "{{ log_root }}/stdout"

- name: Own the socket directory the stamper loop runs through
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/alice-stamper.conf
    content: "d {{ collector_stamper_socket_dir }} 0755 root root -\n"
    owner: root
    group: root
    mode: "0644"
  register: _collector_tmpfiles

- name: Create the socket directory now, not only at the next boot
  ansible.builtin.command:
    cmd: systemd-tmpfiles --create /etc/tmpfiles.d/alice-stamper.conf
  when: _collector_tmpfiles.changed
  changed_when: true

- name: Create Fluent Bit storage/buffer path (native equivalent of the container's /var/log/flb-storage)
  ansible.builtin.file:
    path: "{{ fluent_bit_storage_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# The systemd input is a compile-time option. A configuration naming an input
# the binary does not have aborts the whole service, so this is checked before
# the template is written rather than discovered by a dead collector.
- name: Ask this Fluent Bit build whether it has the systemd input
  ansible.builtin.command:
    cmd: "{{ collector_binary_path }} --help"
  register: collector_plugin_help
  changed_when: false
  failed_when: false

# This can only turn the journal OFF. collector_journald_enabled says whether we
# want the source; this says whether the binary in front of us can provide it.
- name: Turn the journal off when the packaged build cannot read it
  ansible.builtin.set_fact:
    collector_journald_enabled: "{{ collector_journald_enabled | bool
      and 'systemd' in (collector_plugin_help.stdout | default('')) }}"

- name: Say so, rather than leaving a silently missing source
  ansible.builtin.debug:
    msg: >-
      The journal is not collected on this host: fluent-bit
      {{ fluent_bit_version }} was built without the systemd input. Kernel
      faults and unit failures will be absent from OpenSearch until the build
      is replaced.
  when: not (collector_journald_enabled | bool)

- name: Port parsers.yaml (verbatim from images/node/fluent-bit/parsers.yaml)
  ansible.builtin.template:
    src: parsers.yaml.j2
    dest: "{{ collector_config_dir }}/parsers.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: restart fluent-bit

- name: Port collector.yaml (from images/node/fluent-bit/collector.yaml, seams templated per contract)
  ansible.builtin.template:
    src: collector.yaml.j2
    dest: "{{ collector_config_dir }}/collector.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: restart fluent-bit

- name: Create systemd drop-in directory for fluent-bit.service
  ansible.builtin.file:
    path: "{{ collector_systemd_dropin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Systemd drop-in — point ExecStart at collector.yaml instead of the packaged fluent-bit.conf
  ansible.builtin.template:
    src: fluent-bit-override.conf.j2
    dest: "{{ collector_systemd_dropin_dir }}/override.conf"
    owner: root
    group: root
    mode: "0644"
  notify:
    - daemon-reload fluent-bit
    - restart fluent-bit

- name: Apply pending Fluent Bit config/unit changes now
  ansible.builtin.meta: flush_handlers

- name: Ensure fluent-bit is enabled and running
  ansible.builtin.systemd:
    name: "{{ collector_service_name }}"
    enabled: true
    state: started
