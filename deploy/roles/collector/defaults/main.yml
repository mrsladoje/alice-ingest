collector_repo_baseurl: "https://packages.fluentbit.io/centos/$releasever/"
collector_repo_gpgkey: "https://packages.fluentbit.io/fluentbit.key"

fluent_bit_version: "5.0.8"

collector_service_name: fluent-bit
collector_binary_path: /opt/fluent-bit/bin/fluent-bit
collector_config_dir: /etc/fluent-bit
collector_systemd_dropin_dir: /etc/systemd/system/fluent-bit.service.d

collector_health_script: /opt/alice-ingest/fb_health.py
collector_health_interval_seconds: "{{ cockpit_metrics_interval_seconds }}"

# Rule R3 — the one file that tells this machine which machine it is.
collector_env_dir: /etc/alice-ingest
collector_env_file: "{{ collector_env_dir }}/node.env"

# Item 3 — run as ExecStartPre, so a node registers itself at every boot.
collector_register_script: /opt/alice-ingest/register_node.sh

# ExecStartPre counts against the unit's start timeout, and register_node.sh
# waits for the local OpenSearch. This must stay above that wait's worst case:
# REGISTER_WAIT_ATTEMPTS x (REGISTER_WAIT_MAX_TIME + REGISTER_WAIT_SLEEP).
collector_start_timeout_seconds: 600

# Written by the opensearch role, read by register_node.sh through the unit's
# second EnvironmentFile. Not optional: a missing file would send a worker back
# to register_node.sh's own built-in defaults without saying so.
collector_opensearch_env_file: /etc/alice-ingest/opensearch-node.env

fluent_bit_storage_path: /var/log/flb-storage
fluent_bit_http_port: 2020
fluent_bit_http_listen: 127.0.0.1

# Service-level, so this also delays the live lane by the same 1 second.
# Chosen by soak round 2: against the shipped 5, the collector's own processor
# cost falls 24.5 % and its peak memory 28.0 %. See docs/SOAK_RESULTS.md.
fluent_bit_flush_seconds: 1

fluent_bit_log_buffer_limit: "256M"
fluent_bit_log_retry_limit: 10

# Reference value only, read by nobody. The farm figure for the line above,
# recorded here so the staging figure is never mistaken for the design figure.
fluent_bit_log_farm_buffer_limit: "2G"

# The same reservation the worker's OpenSearch node holds — see
# opensearch_cpuset. The two share one set on purpose.
fluent_bit_cpuset: ""

fluent_bit_memory_high: "384M"
fluent_bit_memory_max: "768M"

# false leaves the metrics endpoint loopback-only and removes the firewall rule.
collector_metrics_scrape_open: false

# Repeated in every role that writes a firewalld rule, so each role still
# stands on its own and one inventory line can switch the whole stack. See
# roles/common/defaults/main.yml for why the EPN farm sets this false.
alice_manage_firewalld: true
