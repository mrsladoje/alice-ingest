- name: >-
    Reject an unparsable admission-control mode here rather than at the cluster
    settings PUT, which carries the detection pacing down with it
  ansible.builtin.assert:
    that:
      - admission_control_mode in ['disabled', 'monitor_only', 'enforced']
    fail_msg: >-
      admission_control_mode is '{{ admission_control_mode }}'.
      AdmissionControlMode.fromName parses only disabled, monitor_only and
      enforced, and throws on everything else. OpenSearch answers 400 to the
      whole persistent settings body, so the anomaly-detection batch pacing in
      the same call is lost with it and templates.sh exits non-zero.
    quiet: true

- name: Assert the worker roster reached this role
  ansible.builtin.assert:
    that:
      - opensearch_bootstrap_worker_node_ids | length > 0
    fail_msg: >-
      opensearch_bootstrap_worker_node_ids is empty. templates.sh and ism.sh
      write one index template, one write alias and one retention policy per
      worker node identity, so an empty list bootstraps a cluster with no info
      tier at all. The playbook supplies this list; see group_vars/all.yml.
    quiet: true

- name: Ensure the bootstrap scripts directory exists
  ansible.builtin.file:
    path: "{{ opensearch_bootstrap_root }}"
    state: directory
    owner: root
    group: root
    # The dashboards role stages a world-readable signal catalog in the same
    # directory for its DynamicUser services to traverse. Scripts and
    # definitions keep their own root-only modes.
    mode: "0755"

- name: Render the tier-aware OpenSearch index-template bootstrap script
  ansible.builtin.template:
    src: templates.sh.j2
    dest: "{{ opensearch_bootstrap_templates_script }}"
    owner: root
    group: root
    mode: "0750"

- name: >-
    Install the node self-registration script beside it — templates.sh calls
    this once per worker, and each worker runs the same file as ExecStartPre, so
    the per-worker index template has exactly one definition
  ansible.builtin.include_role:
    name: opensearch_local_index_registration
  vars:
    opensearch_local_index_registration_dest: "{{ opensearch_bootstrap_register_node_script }}"
    opensearch_local_index_registration_mode: "0750"

- name: Render the ISM retention bootstrap script
  ansible.builtin.template:
    src: ism.sh.j2
    dest: "{{ opensearch_bootstrap_ism_script }}"
    owner: root
    group: root
    mode: "0750"

- name: Apply index templates, ingest pipeline and pre-create all indices (idempotent, every run)
  ansible.builtin.command:
    cmd: "{{ opensearch_bootstrap_templates_script }}"
  environment:
    OS_URL: "http://localhost:{{ opensearch_http_port }}"
  changed_when: true

- name: Apply ISM retention policies (idempotent, every run)
  ansible.builtin.command:
    cmd: "{{ opensearch_bootstrap_ism_script }}"
  environment:
    OS_URL: "http://localhost:{{ opensearch_http_port }}"
  changed_when: true
