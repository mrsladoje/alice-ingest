    <text x="110" y="94.5">1</text>
    <circle cx="110" cy="193" r="7.5" fill="#ffffff" stroke="#101010" stroke-width="1"/>
    <text x="110" y="196.5">2</text>
    <circle cx="110" cy="261" r="7.5" fill="#ffffff" stroke="#101010" stroke-width="1"/>
    <text x="110" y="264.5">3</text>
    <circle cx="152" cy="417" r="7.5" fill="#ffffff" stroke="#101010" stroke-width="1"/>
    <text x="152" y="420.5">4</text>
    <circle cx="229" cy="477" r="7.5" fill="#ffffff" stroke="#101010" stroke-width="1"/>
    <text x="229" y="480.5">5</text>
    <circle cx="226" cy="346" r="7.5" fill="#ffffff" stroke="#101010" stroke-width="1"/>
    <text x="226" y="349.5">6</text>
