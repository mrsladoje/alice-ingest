<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 820 540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Logging today. One EPN worker, the central InfoLogger server with its one table, and a desktop browser. Beside the road, the three things a node writes that never take it, and the three limits of today.">
  <defs>
    <marker id="mk-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#101010"/>
    </marker>
    <marker id="mk-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#6b6b66"/>
    </marker>
  </defs>

  <g font-family="Menlo, monospace" font-size="11" letter-spacing="0.18em">
    <text x="0" y="12" fill="#6b6b66">01</text>
    <text x="24" y="12" fill="#101010">ONE EPN WORKER</text>
    <text x="320" y="12" fill="#6b6b66">02</text>
    <text x="344" y="12" fill="#101010">CENTRAL, ONE FOR THE FARM</text>
    <text x="624" y="12" fill="#6b6b66">03</text>
    <text x="648" y="12" fill="#101010">A DESKTOP</text>
  </g>

  <rect x="0" y="22" width="296" height="516" fill="#f1f1ec"/>
  <rect x="320" y="22" width="280" height="362" fill="#f1f1ec"/>
  <rect x="624" y="22" width="196" height="222" fill="#f1f1ec"/>

  <rect x="16" y="40" width="264" height="66" fill="#fdf1f0" stroke="#e1251b" stroke-width="1.6"/>
  <text x="148" y="64" font-size="14" font-weight="600" fill="#e1251b" text-anchor="middle">Application messages</text>
  <text x="148" y="82" font-size="12" fill="#6b6b66" text-anchor="middle">a process sends them through libInfoLogger,</text>
  <text x="148" y="96" font-size="12" fill="#6b6b66" text-anchor="middle">or pipes its stdout in</text>

  <path d="M148,106 V156" fill="none" stroke="#101010" stroke-width="1.25" marker-end="url(#mk-ink)"/>
  <text x="156" y="135" font-family="Menlo, monospace" font-size="10" fill="#6b6b66" text-anchor="start">local socket</text>

  <rect x="16" y="158" width="264" height="62" fill="#ffffff" stroke="#101010" stroke-width="1.1"/>
  <text x="148" y="182" font-size="14" font-weight="600" fill="#101010" text-anchor="middle">Local daemon</text>
  <text x="148" y="201" font-size="12" fill="#6b6b66" text-anchor="middle">infoLoggerD, one per node</text>

  <path d="M280,189 H334" fill="none" stroke="#101010" stroke-width="1.25" marker-end="url(#mk-ink)"/>
  <text x="308" y="181" font-family="Menlo, monospace" font-size="10" fill="#6b6b66" text-anchor="middle">tcp 6006</text>

  <path d="M16,246 H280" stroke="#d6d6cf" stroke-width="1"/>
  <text x="16" y="270" font-family="Menlo, monospace" font-size="11" letter-spacing="0.18em" fill="#101010">ALSO WRITTEN HERE</text>
  <text x="16" y="286" font-size="11.5" fill="#3a3a36">None of it takes that road.</text>

  <rect x="16" y="300" width="264" height="66" fill="#ffffff" stroke="#101010" stroke-width="1.1"/>
  <text x="148" y="324" font-size="14" font-weight="600" fill="#101010" text-anchor="middle">Log files on disk</text>
  <text x="148" y="342" font-size="12" fill="#6b6b66" text-anchor="middle">process stdout and</text>
  <text x="148" y="356" font-size="12" fill="#6b6b66" text-anchor="middle">the O2 process logs</text>

  <rect x="16" y="378" width="264" height="66" fill="#ffffff" stroke="#101010" stroke-width="1.1"/>
  <text x="148" y="402" font-size="14" font-weight="600" fill="#101010" text-anchor="middle">The machine’s journal</text>
  <text x="148" y="420" font-size="12" fill="#6b6b66" text-anchor="middle">systemd, every service</text>
  <text x="148" y="434" font-size="12" fill="#6b6b66" text-anchor="middle">on the node</text>

  <rect x="16" y="456" width="264" height="66" fill="#f1f1ec" stroke="#6b6b66" stroke-width="1.1"/>
  <text x="148" y="480" font-size="14" font-weight="600" fill="#6b6b66" text-anchor="middle">Host metrics</text>
  <text x="148" y="498" font-size="12" fill="#6b6b66" text-anchor="middle">processor, memory, disk</text>
  <text x="148" y="512" font-size="12" fill="#6b6b66" text-anchor="middle">monitoring already collects these</text>

  <rect x="336" y="158" width="248" height="62" fill="#ffffff" stroke="#101010" stroke-width="1.1"/>
  <text x="460" y="182" font-size="14" font-weight="600" fill="#101010" text-anchor="middle">Central server</text>
  <text x="460" y="201" font-size="12" fill="#6b6b66" text-anchor="middle">infoLoggerServer, one for the farm</text>

  <path d="M460,220 V270" fill="none" stroke="#101010" stroke-width="1.25" marker-end="url(#mk-ink)"/>
  <text x="468" y="249" font-family="Menlo, monospace" font-size="10" fill="#6b6b66" text-anchor="start">tcp 3306</text>

  <rect x="336" y="272" width="248" height="62" fill="#ffffff" stroke="#101010" stroke-width="1.1"/>
  <image xlink:href="logos/mysql-logo-official.svg" x="422" y="281" width="76" height="23"/>
  <text x="460" y="323" font-family="Menlo, monospace" font-size="10" fill="#6b6b66" text-anchor="middle">one table: messages</text>

  <path d="M336,348 V354 H584 V348" fill="none" stroke="#e1251b" stroke-width="1.1"/>
  <text x="460" y="372" font-size="12.5" fill="#e1251b" text-anchor="middle">One process and one table for the whole farm</text>

  <path d="M460,158 V136 Q460,130 466,130 H716 Q722,130 722,136 V156" fill="none" stroke="#101010" stroke-width="1.25" marker-end="url(#mk-ink)"/>
  <text x="591" y="125" font-family="Menlo, monospace" font-size="10" fill="#6b6b66" text-anchor="middle">live push, tcp 6102</text>

  <path d="M584,303 H722 V222" fill="none" stroke="#6b6b66" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#mk-soft)"/>
  <text x="653" y="296" font-family="Menlo, monospace" font-size="10" fill="#6b6b66" text-anchor="middle">query, tcp 3306</text>

  <rect x="640" y="158" width="164" height="62" fill="#ffffff" stroke="#101010" stroke-width="1.1"/>
  <text x="722" y="182" font-size="14" font-weight="600" fill="#101010" text-anchor="middle">Desktop browser</text>
  <text x="722" y="201" font-size="12" fill="#6b6b66" text-anchor="middle">infoBrowser, read by hand</text>

  <text x="320" y="412" font-family="Menlo, monospace" font-size="11" letter-spacing="0.18em" fill="#6b6b66">04</text>
  <text x="344" y="412" font-family="Menlo, monospace" font-size="11" letter-spacing="0.18em" fill="#101010">THE LIMITS TODAY</text>
  <path d="M320,420 H820" stroke="#d6d6cf" stroke-width="1"/>

  <circle cx="323" cy="437" r="3" fill="#101010"/>
  <text x="334" y="441" font-family="Menlo, monospace" font-size="11" font-weight="600" letter-spacing="0.18em" fill="#101010">ONE SQL TABLE</text>
  <text x="334" y="457" font-size="11.5" fill="#101010">Every message in the farm lands in one messages table.</text>

  <circle cx="323" cy="475" r="3" fill="#101010"/>
  <text x="334" y="479" font-family="Menlo, monospace" font-size="11" font-weight="600" letter-spacing="0.18em" fill="#101010">NO AGGREGATION</text>
  <text x="334" y="495" font-size="11.5" fill="#101010">infoBrowser lists single lines. It draws no counts over time.</text>

  <circle cx="323" cy="513" r="3" fill="#101010"/>
  <text x="334" y="517" font-family="Menlo, monospace" font-size="11" font-weight="600" letter-spacing="0.18em" fill="#101010">ONE POLICY, ONE COPY</text>
  <text x="334" y="533" font-size="11.5" fill="#101010">One retention rule covers every message. Nothing is replicated.</text>
</svg>
