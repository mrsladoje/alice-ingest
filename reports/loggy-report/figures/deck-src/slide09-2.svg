          <text class="d-t is-mid" style="font-size:14px;font-weight:600;letter-spacing:-0.01em;fill:#101010;text-anchor:middle" x="100" y="384">The collector</text>
          <text class="d-s is-mid" style="font-size:12px;fill:#6b6b66;text-anchor:middle" x="100" y="410">still reading lines</text>
          <path class="d-line" style="fill:none;stroke:#101010;stroke-width:1.25" d="M180,391 H196" marker-end="url(#mk08a)"></path>

          <rect class="d-card is-hot" style="fill:#fdf1f0;stroke:#e1251b;stroke-width:1.6" x="208" y="349" width="246" height="84"></rect>
          <text class="d-t is-mid is-hot" style="font-size:14px;font-weight:600;letter-spacing:-0.01em;fill:#e1251b;text-anchor:middle" x="331" y="384">256 MB on disk</text>
          <text class="d-s is-mid" style="font-size:12px;fill:#6b6b66;text-anchor:middle" x="331" y="410">one buffer for each lane, 10 retries</text>

          <path class="d-line is-dash" style="fill:none;stroke:#6b6b66;stroke-width:1.25;stroke-dasharray:4 4" d="M454,391 H478"></path>
          <path class="d-x" style="fill:none;stroke:#e1251b;stroke-width:1.8" d="M484,385 L496,397"></path>
