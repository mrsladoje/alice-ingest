<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 820 582" role="img"
             aria-label="Two bands. Band one, what the collector does to a line, drawn as five stages left to right with arrows between them. Input: read each line, from a file, a socket or a script. Tag: give it a name — dds, stdout, infologger or health. Filter: parse and stamp, pulling fields out of the text and adding the arrival clock. Retag, drawn in red as the design decision: sort by severity into info or everything else. Output: send it on, to the OpenSearch node on this machine. Band two, drawn in red, what the disk buffer really is. If OpenSearch is down the collector keeps reading lines and writes them into a 256 megabyte buffer on disk, one for each lane with ten retries, while the connection to OpenSearch is broken. That buffer holds an outage between 50 seconds and 109 minutes. After that the record is gone, because there is no second destination. Below a rule, the verdict: it is a hiccup safety layer, not durability. Every input writes to this local disk buffer first, and it survives a restart of Fluent Bit and a short network outage. It does not survive losing the node, and those records are gone. Real durability is a replicated queue, and Kafka is on the roadmap.">
          <defs>
            <marker id="mk08a" viewBox="0 0 10 10" refX="9" refY="5"
                    markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
              <path d="M0,1 L10,5 L0,9 z" class="d-head" style="fill:#101010"></path>
            </marker>
            <marker id="mk08b" viewBox="0 0 10 10" refX="9" refY="5"
                    markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
              <path d="M0,1 L10,5 L0,9 z" class="d-head is-soft" style="fill:#6b6b66"></path>
            </marker>
          </defs>

          <image href="logos/fluentbit-logo-official.svg" x="0" y="0" width="96" height="28"></image>
          <text class="d-vm" style="font-family:Menlo, monospace;font-size:9.5px;letter-spacing:0.04em;fill:#6b6b66" x="108" y="19">one process on every worker VM</text>
          <text class="d-fact is-end" style="font-size:10.5px;fill:#3a3a36;text-anchor:end" x="820" y="19">4 inputs · 4 tags · 5 outputs</text>
          <path class="d-hair" style="stroke:#d6d6cf;stroke-width:1" d="M0,34 H820"></path>

          <text class="d-num" style="font-family:Menlo, monospace;font-size:11px;fill:#6b6b66" x="0" y="70">01</text>
          <text class="d-stage" style="font-family:Menlo, monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;fill:#101010" x="24" y="70">What it does to a line</text>

