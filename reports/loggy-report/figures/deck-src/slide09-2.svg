          <text class="d-stage is-mid" style="font-family:Menlo, monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;fill:#101010;text-anchor:middle" x="74" y="130">INPUT</text>
          <text class="d-s is-mid" style="font-size:12px;fill:#6b6b66;text-anchor:middle" x="74" y="166">Read each line</text>
          <text class="d-l is-mid" style="font-family:Menlo, monospace;font-size:10px;fill:#6b6b66;text-anchor:middle" x="74" y="198">from a file,</text>
          <text class="d-l is-mid" style="font-family:Menlo, monospace;font-size:10px;fill:#6b6b66;text-anchor:middle" x="74" y="212">a socket, a script</text>
          <path class="d-line" style="fill:none;stroke:#101010;stroke-width:1.25" d="M147,161 H163" marker-end="url(#mk08a)"></path>

