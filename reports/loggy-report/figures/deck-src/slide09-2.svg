          <text class="d-fact is-start" style="font-size:10.5px;fill:#3a3a36;text-anchor:start" x="20" y="544">Every input writes to this local disk buffer first. It survives a restart of Fluent Bit and a short network outage.</text>
          <text class="d-fact is-hot is-start" style="font-size:10.5px;fill:#e1251b;text-anchor:start" x="20" y="560">It does not survive losing the node, and those records are gone. Real durability is a replicated queue, and Kafka is on the roadmap.</text>
