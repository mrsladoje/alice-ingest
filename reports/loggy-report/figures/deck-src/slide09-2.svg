          <text class="d-stage is-mid is-hot" style="font-family:Menlo, monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;fill:#e1251b;text-anchor:middle" x="578" y="130">RETAG</text>
          <text class="d-s is-mid is-hot" style="font-size:12px;fill:#e1251b;text-anchor:middle" x="578" y="166">Sort by severity</text>
          <text class="d-l is-mid is-hot" style="font-family:Menlo, monospace;font-size:10px;fill:#e1251b;text-anchor:middle" x="578" y="198">info,</text>
          <text class="d-l is-mid is-hot" style="font-family:Menlo, monospace;font-size:10px;fill:#e1251b;text-anchor:middle" x="578" y="212">or everything else</text>
          <path class="d-line" style="fill:none;stroke:#101010;stroke-width:1.25" d="M651,161 H667" marker-end="url(#mk08a)"></path>

          <rect class="d-card" style="fill:#ffffff;stroke:#101010;stroke-width:1.1" x="673" y="86" width="146" height="150"></rect>
          <text class="d-stage is-mid" style="font-family:Menlo, monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;fill:#101010;text-anchor:middle" x="746" y="130">OUTPUT</text>
          <text class="d-s is-mid" style="font-size:12px;fill:#6b6b66;text-anchor:middle" x="746" y="166">Send it on</text>
          <text class="d-l is-mid" style="font-family:Menlo, monospace;font-size:10px;fill:#6b6b66;text-anchor:middle" x="746" y="198">to the OpenSearch</text>
          <text class="d-l is-mid" style="font-family:Menlo, monospace;font-size:10px;fill:#6b6b66;text-anchor:middle" x="746" y="212">node on this VM</text>

