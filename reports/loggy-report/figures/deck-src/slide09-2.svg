          <text class="d-s is-mid" style="font-size:12px;fill:#6b6b66;text-anchor:middle" x="242" y="166">Give it a name</text>
          <text class="d-l is-mid" style="font-family:Menlo, monospace;font-size:10px;fill:#6b6b66;text-anchor:middle" x="242" y="198">dds, stdout,</text>
          <text class="d-l is-mid" style="font-family:Menlo, monospace;font-size:10px;fill:#6b6b66;text-anchor:middle" x="242" y="212">infologger, health</text>
          <path class="d-line" style="fill:none;stroke:#101010;stroke-width:1.25" d="M315,161 H331" marker-end="url(#mk08a)"></path>

          <rect class="d-card" style="fill:#ffffff;stroke:#101010;stroke-width:1.1" x="337" y="86" width="146" height="150"></rect>
          <text class="d-stage is-mid" style="font-family:Menlo, monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;fill:#101010;text-anchor:middle" x="410" y="130">FILTER</text>
          <text class="d-s is-mid" style="font-size:12px;fill:#6b6b66;text-anchor:middle" x="410" y="166">Parse and stamp</text>
          <text class="d-l is-mid" style="font-family:Menlo, monospace;font-size:10px;fill:#6b6b66;text-anchor:middle" x="410" y="198">fields out of text,</text>
          <text class="d-l is-mid" style="font-family:Menlo, monospace;font-size:10px;fill:#6b6b66;text-anchor:middle" x="410" y="212">and the clock</text>
