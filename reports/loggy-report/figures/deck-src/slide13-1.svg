<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 820 546" role="img"
           aria-label="Log anomaly detection, in three bands, none of it built. Band one, what is watched today: a plain card says numbers about the logs, counts, error rates and lag, and that lane is built and running; a red card beside it says the log text itself, the words in the line, and nothing reads them. The band is marked as one of the project’s next focuses. Band two, three ways to read the text, drawn as three cards of equal size, with the note that none is chosen and all three are open. Card one, templating alone: collapse a line to its skeleton, so the line Processing timeslice colon forty-one becomes Processing timeslice colon angle-bracket N. Millions of lines become a few thousand templates, and a template never seen before is a free signal. Its trade-off, in red: the signal runs out, because software prints only the messages in its source, so once every template is seen it stops firing. Card two, k-NN alone, nearest-neighbour distance on lines: k-NN means k nearest neighbours, and the distance is the score. Turn each line into a vector, then score a new line by how far it is from the nearest line already seen. Its trade-off, in red: rejected on cost, because every line runs through a model at ingest and millions of vectors sit in memory on machines whose memory is already rationed. Card three, templates then k-NN, the two ideas fused: templates first and then distance, which is a few thousand vectors. Extract the skeletons first, then run the distance test on the templates and not on the lines. Its trade-off, in red: it fixes the cost but inherits some of the saturation, and our own document names this one as still open. Band three, the proposed pipeline, stamped COMING SOON in a solid red badge and drawn inside a red panel. The band is split into two named halves. On the worker, two small cards: extract the template, which is string work with no model, then count each template, one counter per template in one small table. A red arrow labelled push crosses into the second half. In the storage tier, two cards: the template vocabulary, every template seen so far, held once rather than on every worker, and then the scoring, which uses one of the three ways above and runs on the storage tier only. A red brace under the worker half reads: some work here, but not much. Beside it, three lines state that the worker pushes its template counts upward, and any template it has never seen before, and that nothing polls the worker and no model runs on it.">
