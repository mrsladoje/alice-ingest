          <text class="d-bracelabel" style="font-size:12.5px;letter-spacing:-0.005em;fill:#e1251b;text-anchor:middle" x="415" y="316">One process and one table for the whole farm</text>

          <text class="d-num" style="font-family:Menlo, monospace;font-size:11px;fill:#6b6b66" x="0" y="360">05</text>
          <text class="d-stage" style="font-family:Menlo, monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;fill:#101010" x="24" y="360">The limits today</text>
          <path class="d-hair" style="stroke:#d6d6cf;stroke-width:1" d="M0,368 H820"></path>

          <circle class="d-bullet" style="fill:#101010" cx="3" cy="386" r="3"></circle>
          <text class="d-stage is-strong" style="font-family:Menlo, monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;fill:#101010;font-weight:600" x="14" y="390">One SQL table</text>
          <text class="d-fact is-lg" style="font-size:11.5px;fill:#101010" x="14" y="410">Every message in the farm lands</text>
          <text class="d-fact is-lg" style="font-size:11.5px;fill:#101010" x="14" y="425">in one messages table.</text>

          <circle class="d-bullet" style="fill:#101010" cx="283" cy="386" r="3"></circle>
          <text class="d-stage is-strong" style="font-family:Menlo, monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;fill:#101010;font-weight:600" x="294" y="390">No aggregation</text>
          <text class="d-fact is-lg" style="font-size:11.5px;fill:#101010" x="294" y="410">infoBrowser lists single lines.</text>
          <text class="d-fact is-lg" style="font-size:11.5px;fill:#101010" x="294" y="425">It draws no counts over time.</text>

          <circle class="d-bullet" style="fill:#101010" cx="563" cy="386" r="3"></circle>
          <text class="d-stage is-strong" style="font-family:Menlo, monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;fill:#101010;font-weight:600" x="574" y="390">One policy, one copy</text>
          <text class="d-fact is-lg" style="font-size:11.5px;fill:#101010" x="574" y="410">One retention rule covers every</text>
          <text class="d-fact is-lg" style="font-size:11.5px;fill:#101010" x="574" y="425">message. Nothing is replicated.</text>
        </svg>