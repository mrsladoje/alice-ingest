          <rect class="d-panel" style="fill:#f1f1ec" x="450" y="166" width="180" height="122"></rect>
          <rect class="d-panel" style="fill:#f1f1ec" x="650" y="166" width="170" height="122"></rect>

          <path class="d-line" style="fill:none;stroke:#101010;stroke-width:1.25" d="M88,98 V194" marker-end="url(#mk03a)"></path>
          <text class="d-l is-start" style="font-family:Menlo, monospace;font-size:10px;fill:#6b6b66;text-anchor:start" x="96" y="146">local socket</text>

          <rect class="d-ghost" style="fill:#ffffff;stroke:#101010;stroke-width:1.1;opacity:0.32" x="40" y="212" width="110" height="62"></rect>
          <rect class="d-ghost" style="fill:#ffffff;stroke:#101010;stroke-width:1.1;opacity:0.32" x="40" y="206" width="110" height="62"></rect>
          <rect class="d-card" style="fill:#ffffff;stroke:#101010;stroke-width:1.1" x="40" y="200" width="110" height="62"></rect>
          <text class="d-t" style="font-size:14px;font-weight:600;letter-spacing:-0.01em;fill:#101010;text-anchor:middle" x="95" y="229">infoLoggerD</text>
          <text class="d-s" style="font-size:12px;fill:#6b6b66;text-anchor:middle" x="95" y="249">one per node</text>

          <path class="d-line" style="fill:none;stroke:#101010;stroke-width:1.25" d="M150,231 H226" marker-end="url(#mk03a)"></path>
          <text class="d-l" style="font-family:Menlo, monospace;font-size:10px;fill:#6b6b66;text-anchor:middle" x="188" y="223">tcp 6006</text>

          <rect class="d-card is-hot" style="fill:#fdf1f0;stroke:#e1251b;stroke-width:1.6" x="230" y="200" width="160" height="62"></rect>
          <text class="d-t is-hot" style="font-size:14px;font-weight:600;letter-spacing:-0.01em;fill:#e1251b;text-anchor:middle" x="310" y="229">infoLoggerServer</text>
          <text class="d-s is-hot" style="font-size:12px;fill:#e1251b;text-anchor:middle" x="310" y="249">one, central</text>

          <path class="d-line" style="fill:none;stroke:#101010;stroke-width:1.25" d="M390,231 H476" marker-end="url(#mk03a)"></path>
          <text class="d-l" style="font-family:Menlo, monospace;font-size:10px;fill:#6b6b66;text-anchor:middle" x="433" y="223">tcp 3306</text>

          <rect class="d-card is-hot is-logo" style="fill:#ffffff;stroke:#e1251b;stroke-width:1.6" x="480" y="200" width="120" height="62"></rect>
          <image href="logos/mysql-logo-official.svg" x="502" y="211" width="76" height="23"></image>
          <text class="d-s is-hot" style="font-size:12px;fill:#e1251b;text-anchor:middle" x="540" y="253">one table</text>

          <path class="d-line is-dash" style="fill:none;stroke:#6b6b66;stroke-width:1.25;stroke-dasharray:4 4" d="M600,231 H676" marker-end="url(#mk03s)"></path>
          <text class="d-l" style="font-family:Menlo, monospace;font-size:10px;fill:#6b6b66;text-anchor:middle" x="638" y="223">query</text>

          <rect class="d-ghost" style="fill:#ffffff;stroke:#101010;stroke-width:1.1;opacity:0.32" x="680" y="212" width="110" height="62"></rect>
          <rect class="d-ghost" style="fill:#ffffff;stroke:#101010;stroke-width:1.1;opacity:0.32" x="680" y="206" width="110" height="62"></rect>
          <rect class="d-card" style="fill:#ffffff;stroke:#101010;stroke-width:1.1" x="680" y="200" width="110" height="62"></rect>
          <text class="d-t" style="font-size:14px;font-weight:600;letter-spacing:-0.01em;fill:#101010;text-anchor:middle" x="735" y="229">infoBrowser</text>
          <text class="d-s" style="font-size:12px;fill:#6b6b66;text-anchor:middle" x="735" y="249">desktop GUI</text>

          <path class="d-line" style="fill:none;stroke:#101010;stroke-width:1.25" d="M310,200 V183 Q310,177 316,177 H729 Q735,177 735,183 V194"
