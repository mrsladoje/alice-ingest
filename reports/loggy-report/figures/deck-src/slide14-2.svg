        <text class="d-t" style="font-size:14px;font-weight:600;letter-spacing:-0.01em;fill:#101010;text-anchor:middle" x="410" y="66">The numbers</text>
        <text class="d-s" style="font-size:12px;fill:#6b6b66;text-anchor:middle" x="410" y="86">one row per machine</text>
        <text class="d-l" style="font-family:Menlo, monospace;font-size:10px;fill:#6b6b66;text-anchor:middle" x="410" y="103">every thirty seconds</text>

        <text class="d-l" style="font-family:Menlo, monospace;font-size:10px;fill:#6b6b66;text-anchor:middle" x="534" y="66">poll</text>
        <path class="d-line" style="fill:none;stroke:#101010;stroke-width:1.25" d="M548,76 H520" marker-end="url(#a10n)"></path>

        <rect class="d-card" style="fill:#ffffff;stroke:#101010;stroke-width:1.1" x="554" y="42" width="250" height="68"></rect>
        <text class="d-t" style="font-size:14px;font-weight:600;letter-spacing:-0.01em;fill:#101010;text-anchor:middle" x="679" y="66">One poller</text>
        <text class="d-s" style="font-size:12px;fill:#6b6b66;text-anchor:middle" x="679" y="86">asks the cluster and the dashboard</text>
        <text class="d-l" style="font-family:Menlo, monospace;font-size:10px;fill:#6b6b66;text-anchor:middle" x="679" y="103">and who has gone quiet</text>

        <text class="d-num" style="font-family:Menlo, monospace;font-size:11px;fill:#6b6b66" x="0" y="160">02</text>
        <text class="d-stage" style="font-family:Menlo, monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;fill:#101010" x="24" y="160">Three lanes read those numbers</text>
        <text class="d-fact is-end" style="font-size:10.5px;fill:#3a3a36;text-anchor:end" x="820" y="160">28 saved rules and 17 detectors, all inside the cluster.</text>

