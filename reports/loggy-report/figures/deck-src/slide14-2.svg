        <text class="d-l" style="font-family:Menlo, monospace;font-size:10px;fill:#6b6b66;text-anchor:middle" x="690" y="298">A frozen seven-day baseline.</text>
        <text class="d-l" style="font-family:Menlo, monospace;font-size:10px;fill:#6b6b66;text-anchor:middle" x="690" y="312">Nine rules, every ten minutes.</text>

