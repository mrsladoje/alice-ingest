        <text class="d-t is-hot" style="font-size:14px;font-weight:600;letter-spacing:-0.01em;fill:#e1251b;text-anchor:middle" x="141" y="66">Every worker</text>
        <text class="d-s is-hot" style="font-size:12px;fill:#e1251b;text-anchor:middle" x="141" y="86">pushes its own counters</text>
        <text class="d-l is-hot" style="font-family:Menlo, monospace;font-size:10px;fill:#e1251b;text-anchor:middle" x="141" y="103">records in, out, retried, dropped</text>

        <text class="d-l is-hot" style="font-family:Menlo, monospace;font-size:10px;fill:#e1251b;text-anchor:middle" x="283" y="66">push</text>
        <path class="d-line" style="fill:none;stroke:#101010;stroke-width:1.25" d="M266,76 H300" marker-end="url(#a10n)"></path>

