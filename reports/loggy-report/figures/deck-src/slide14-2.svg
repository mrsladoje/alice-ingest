        <text class="d-l is-hot" style="font-family:Menlo, monospace;font-size:10px;fill:#e1251b;text-anchor:middle" x="500" y="266">one cut</text>
        <text class="d-l" style="font-family:Menlo, monospace;font-size:10px;fill:#6b6b66;text-anchor:middle" x="410" y="298">Random Cut Forest, one model</text>
        <text class="d-l" style="font-family:Menlo, monospace;font-size:10px;fill:#6b6b66;text-anchor:middle" x="410" y="312">per machine. No threshold.</text>

