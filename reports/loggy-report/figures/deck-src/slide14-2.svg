        <text class="d-fact is-end" style="font-size:10.5px;fill:#3a3a36;text-anchor:end" x="820" y="13">Nothing reaches into a worker to scrape it.</text>

        <rect class="d-panel" style="fill:#f1f1ec" x="1" y="24" width="818" height="104"></rect>

