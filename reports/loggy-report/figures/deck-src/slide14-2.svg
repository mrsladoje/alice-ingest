        <circle class="d-dot" style="fill:#6b6b66" cx="404" cy="270" r="2.6"></circle>
        <circle class="d-dot" style="fill:#6b6b66" cx="412" cy="254" r="2.6"></circle>
        <circle class="d-dot is-hot" style="fill:#e1251b" cx="500" cy="246" r="3.2"></circle>

        <path class="d-cut is-hot" style="stroke-dashoffset:0;opacity:1;stroke:#e1251b;stroke-width:1.5" pathLength="100" d="M455,234 V288"></path>
        <path class="d-cut is-c2" style="stroke-dashoffset:0;opacity:1" pathLength="100" d="M292,264 H455"></path>
        <path class="d-cut is-c3" style="stroke-dashoffset:0;opacity:1" pathLength="100" d="M358,234 V264"></path>
