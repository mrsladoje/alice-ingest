<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 820 496" role="img"
           aria-label="How trouble is found, in three bands. Band one, where the numbers come from: every worker pushes its own counters into the cluster every thirty seconds, so nothing reaches into a machine to scrape it. Those health rows sit in the same cluster as the logs. One poller asks the cluster and the dashboard for their own health, and notices which worker has gone quiet. Band two, three lanes read those numbers: twenty-eight saved rules and seventeen detectors, all running inside the cluster. Lane one, threshold rules, the cliffs we already know, such as a disk over ninety-two percent full or a collector silent for two minutes; a plain rule, nothing trained. Lane two, Random Cut Forest, which answers how surprising this minute is: a scatter plot shows a crowd of ordinary points that many cuts still leave crowded, and one red point that a single cut isolates. Random Cut Forest keeps one model per machine, so nobody writes a threshold. Lane three, trend rules, for the drift a forest learns as normal, measuring today against a frozen baseline of seven days; nine rules, every ten minutes. Band three, from hits to one alert: many hits from the same rule fold into one episode, one machine and one trouble, opened at the first hit and closed when it is quiet. Alertmanager, marked with the Prometheus flame, then decides when a person is told and how often it repeats. One broken machine is one alert, however many times the rule fires.">
