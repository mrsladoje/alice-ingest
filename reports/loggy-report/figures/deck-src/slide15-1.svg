<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 820 522" role="img"
             aria-label="Five unbuilt items, set as a table with uneven rows, in the order we would build them. Each row gives the item, short bullet points on what it would do, and short bullet points on why it waits and what it costs. Item one is the largest row, outlined in red and marked NEXT: Apache Kafka for durability, a durable queue between the collector and the store. Three brokers would run on the three storage machines. It would run in KRaft mode, which means Kafka keeps its own cluster state, with no separate coordination service beside it. It decouples a slow reader from a fast writer: Fluent Bit writes fast, and OpenSearch reads at its own pace, so a slow or dead store then stops costing records. It waits because nothing needs it yet: two readers today, served by two collector outputs, and a third reader is the trigger. It costs three brokers, a second system to run, and memory these five machines do not have. Item two, more log types: today we take DDS, stdout, InfoLogger and the collector's own health. Missing are the machine's system journal and the ten per-device process logs that slide three names. After that we would parse numbers out of the message body, such as timeframe processing time, compressed timeframe size, and tracks. It waits because the archive we replay holds neither source, so this one needs a real machine, and because the parsers need real message shapes to test against. It costs one input and one parser per machine. Item three, anomaly detection on the log text: today we watch numbers about the logs, not the text, and slide thirteen gives that gap a full page with the three routes we are choosing between. The choice between the routes is not made, and nothing here is built. Item four, the shifter's own view: the cockpit says whether the pipeline is healthy, a shifter asks what the experiment is saying now, and that is a second view, kept close to the InfoLogger one. It needs access to the EPN machines, because we must read the running interface first, and there is no data work, because the fields are already mapped. Item five, authentication inside the cluster: one password guards the web page, behind it no port asks who you are, and a firewall rule is the whole boundary. That is fine on five machines we own and not on the farm. It costs a certificate on every machine, an account for every job, and authentication on every call.">

          <text class="d-stage" style="font-family:Menlo, monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;fill:#101010" x="0" y="13">Not built yet</text>
          <text class="d-fact is-end" style="font-size:10.5px;fill:#3a3a36;text-anchor:end" x="820" y="13">In the order we would build them. Each line names what holds it, and what it costs.</text>

