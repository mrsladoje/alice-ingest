          <text class="d-t is-sm is-start" style="font-size:12.5px;font-weight:600;letter-spacing:-0.01em;fill:#101010;text-anchor:start" x="46" y="409">Placement is data</text>
          <text class="d-fact is-start" style="font-size:10.5px;fill:#3a3a36;text-anchor:start" x="250" y="409">One inventory file says where each service runs. Moving one service to another machine changed no code.</text>
