          <text class="d-t is-sm is-start" style="font-size:12.5px;font-weight:600;letter-spacing:-0.01em;fill:#101010;text-anchor:start" x="46" y="434">Every step converges</text>
          <text class="d-fact is-start" style="font-size:10.5px;fill:#3a3a36;text-anchor:start" x="250" y="434">A failed run is simply run again. Machines, monitors and detectors are created by name, never twice.</text>
