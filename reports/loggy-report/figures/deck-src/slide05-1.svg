<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 820 511" role="img"
             aria-label="Two-tier architecture. Worker tier, two VMs: an alice-replay producer feeds Fluent Bit, which writes to the OpenSearch node on the same machine. Application logs at info severity stay in a local index with one shard and no replicas. InfoLogger and the other application logs take one network hop to the storage tier. Storage tier, three VMs, each an OpenSearch cluster-manager and data node: node-03 also runs Dashboards, nginx and Alertmanager, node-04 runs the trend rollup and signal projector, node-05 runs the live lane. The infologger and application-logs-central indices are held there with one shard and two replicas, one copy on every storage node.">
