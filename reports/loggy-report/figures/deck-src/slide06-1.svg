<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 820 560" role="img"
           aria-label="Federated search inside one cluster, in three parts. Part one, ask once and every node answers: one query, written against one saved pattern, goes to a storage machine, and that machine collects the answers from the others. Three arrows run both ways to the rest of the cluster: the query goes out and the answers come back. Two worker rows are drawn, node-01 and node-02, each holding its own local logs. Below them one card groups node-03, node-04 and node-05 as the storage part of the same cluster. Part two, one cluster and not many: a card of five squares labelled one cluster stands beside a faded card of three separate clusters joined by dashed lines labelled cross-cluster search. The note says we run one cluster, the other way is many clusters joined together by cross-cluster search. Under the heading pros of many clusters: one bad query cannot slow the other clusters, and each cluster upgrades on its own schedule. Beside it, six lines. Under the heading pros of one cluster: built-in cross-cluster search does not scale to a hundred machines; the cluster places shards and replicas itself across all machines; one set of users, roles and saved searches; detection and alerting are streamlined; no federation layer of our own to write and keep alive. Part three, fanout, where not everything is perfect: a search that asks every machine takes processor time on every machine. It is as slow as the slowest machine. Those same machines reconstruct events, which is their real job, so log search must not compete with it. So we ask only when we must: the live lane covers watching, but a question such as which machines saw this error in run 561234 has to ask all of them.">
