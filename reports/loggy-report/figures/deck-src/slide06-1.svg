        </g>

        <text class="d-num" style="font-family:Menlo, monospace;font-size:11px;fill:#6b6b66" x="0" y="242">02</text>
        <text class="d-stage" style="font-family:Menlo, monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;fill:#101010" x="24" y="242">One cluster, not many</text>
        <rect class="d-panel" style="fill:#f1f1ec" x="1" y="250" width="818" height="182"></rect>

        <rect class="d-card" style="fill:#ffffff;stroke:#101010;stroke-width:1.1" x="12" y="260" width="180" height="52"></rect>
        <text class="d-vm is-start" style="font-family:Menlo, monospace;font-size:9.5px;letter-spacing:0.04em;fill:#6b6b66;text-anchor:start" x="22" y="275">ONE CLUSTER</text>
        <rect class="d-card" style="fill:#ffffff;stroke:#101010;stroke-width:1.1" x="22" y="284" width="16" height="16"></rect>
        <rect class="d-card" style="fill:#ffffff;stroke:#101010;stroke-width:1.1" x="56" y="284" width="16" height="16"></rect>
        <rect class="d-card" style="fill:#ffffff;stroke:#101010;stroke-width:1.1" x="90" y="284" width="16" height="16"></rect>
        <rect class="d-card" style="fill:#ffffff;stroke:#101010;stroke-width:1.1" x="124" y="284" width="16" height="16"></rect>
        <rect class="d-card" style="fill:#ffffff;stroke:#101010;stroke-width:1.1" x="158" y="284" width="16" height="16"></rect>

        <rect class="d-card is-soft" style="fill:#f1f1ec;stroke:#6b6b66;stroke-width:1.1" x="204" y="260" width="180" height="52"></rect>
        <text class="d-vm is-start" style="font-family:Menlo, monospace;font-size:9.5px;letter-spacing:0.04em;fill:#6b6b66;text-anchor:start" x="214" y="275">MANY CLUSTERS</text>
        <rect class="d-ghost" style="fill:#ffffff;stroke:#101010;stroke-width:1.1;opacity:0.32" x="214" y="282" width="46" height="18"></rect>
        <rect class="d-ghost" style="fill:#ffffff;stroke:#101010;stroke-width:1.1;opacity:0.32" x="272" y="282" width="46" height="18"></rect>
        <rect class="d-ghost" style="fill:#ffffff;stroke:#101010;stroke-width:1.1;opacity:0.32" x="330" y="282" width="46" height="18"></rect>
        <path class="d-line is-dash" style="fill:none;stroke:#6b6b66;stroke-width:1.25;stroke-dasharray:4 4" d="M260,291 H272"></path>
        <path class="d-line is-dash" style="fill:none;stroke:#6b6b66;stroke-width:1.25;stroke-dasharray:4 4" d="M318,291 H330"></path>
        <text class="d-l is-mid" style="font-family:Menlo, monospace;font-size:10px;fill:#6b6b66;text-anchor:middle" x="294" y="309">cross-cluster search</text>

        <text class="d-fact is-start" style="font-size:10.5px;fill:#3a3a36;text-anchor:start" x="12" y="332">We run one cluster. The other way is many clusters,</text>
        <text class="d-fact is-start" style="font-size:10.5px;fill:#3a3a36;text-anchor:start" x="12" y="344">joined together by cross-cluster search.</text>

        <text class="d-vm is-start" style="font-family:Menlo, monospace;font-size:9.5px;letter-spacing:0.04em;fill:#6b6b66;text-anchor:start" x="12" y="372">PROS OF MANY CLUSTERS</text>
        <path class="d-hair" style="stroke:#d6d6cf;stroke-width:1" d="M12,379 H384"></path>

        <path class="d-plus" style="stroke:#1c7c46;stroke-width:2;stroke-linecap:square" d="M12,392 H22 M17,387 V397"></path>
        <text class="d-fact is-start" style="font-size:10.5px;fill:#3a3a36;text-anchor:start" x="30" y="395">One bad query cannot slow the other clusters.</text>

        <path class="d-plus" style="stroke:#1c7c46;stroke-width:2;stroke-linecap:square" d="M12,410 H22 M17,405 V415"></path>
        <text class="d-fact is-start" style="font-size:10.5px;fill:#3a3a36;text-anchor:start" x="30" y="413">Each cluster upgrades on its own schedule.</text>

        <text class="d-vm is-start" style="font-family:Menlo, monospace;font-size:9.5px;letter-spacing:0.04em;fill:#6b6b66;text-anchor:start" x="436" y="275">PROS OF ONE CLUSTER</text>
        <path class="d-hair" style="stroke:#d6d6cf;stroke-width:1" d="M436,282 H808"></path>

        <path class="d-plus" style="stroke:#1c7c46;stroke-width:2;stroke-linecap:square" d="M436,300 H446 M441,295 V305"></path>
        <text class="d-fact is-start" style="font-size:10.5px;fill:#3a3a36;text-anchor:start" x="454" y="303">Built-in cross-cluster search does not scale to 100 machines.</text>

        <path class="d-plus" style="stroke:#1c7c46;stroke-width:2;stroke-linecap:square" d="M436,324 H446 M441,319 V329"></path>
        <text class="d-fact is-start" style="font-size:10.5px;fill:#3a3a36;text-anchor:start" x="454" y="327">The cluster places shards and replicas itself, across all machines.</text>

        <path class="d-plus" style="stroke:#1c7c46;stroke-width:2;stroke-linecap:square" d="M436,348 H446 M441,343 V353"></path>
        <text class="d-fact is-start" style="font-size:10.5px;fill:#3a3a36;text-anchor:start" x="454" y="351">One set of users, roles and saved searches.</text>

        <path class="d-plus" style="stroke:#1c7c46;stroke-width:2;stroke-linecap:square" d="M436,372 H446 M441,367 V377"></path>
        <text class="d-fact is-start" style="font-size:10.5px;fill:#3a3a36;text-anchor:start" x="454" y="375">Detection and alerting streamlined.</text>

        <path class="d-plus" style="stroke:#1c7c46;stroke-width:2;stroke-linecap:square" d="M436,396 H446 M441,391 V401"></path>
        <text class="d-fact is-start" style="font-size:10.5px;fill:#3a3a36;text-anchor:start" x="454" y="399">No federation layer of our own to write and keep alive.</text>

        <text class="d-num" style="font-family:Menlo, monospace;font-size:11px;fill:#6b6b66" x="0" y="450">04</text>
        <text class="d-stage" style="font-family:Menlo, monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;fill:#101010" x="24" y="450">Fanout — not everything is perfect</text>

        <rect class="d-panel" style="fill:#f1f1ec" x="1" y="458" width="818" height="96"></rect>

        <rect class="d-card" style="fill:#ffffff;stroke:#101010;stroke-width:1.1" x="12" y="470" width="260" height="74"></rect>
        <text class="d-t is-sm is-start" style="font-size:12.5px;font-weight:600;letter-spacing:-0.01em;fill:#101010;text-anchor:start" x="24" y="492">Every machine pays</text>
        <text class="d-fact is-start" style="font-size:10.5px;fill:#3a3a36;text-anchor:start" x="24" y="510">One search asks all of them, so all of</text>
        <text class="d-fact is-start" style="font-size:10.5px;fill:#3a3a36;text-anchor:start" x="24" y="523">them spend processor time on it. It is</text>
        <text class="d-fact is-start" style="font-size:10.5px;fill:#3a3a36;text-anchor:start" x="24" y="536">as slow as the slowest machine.</text>

        <rect class="d-card" style="fill:#ffffff;stroke:#101010;stroke-width:1.1" x="284" y="470" width="260" height="74"></rect>
        <text class="d-t is-sm is-start" style="font-size:12.5px;font-weight:600;letter-spacing:-0.01em;fill:#101010;text-anchor:start" x="296" y="492">Reconstruction comes first</text>
        <text class="d-fact is-start" style="font-size:10.5px;fill:#3a3a36;text-anchor:start" x="296" y="510">Those same machines reconstruct</text>
        <text class="d-fact is-start" style="font-size:10.5px;fill:#3a3a36;text-anchor:start" x="296" y="523">events. That is their real job, and log</text>
        <text class="d-fact is-start" style="font-size:10.5px;fill:#3a3a36;text-anchor:start" x="296" y="536">search must not compete with it.</text>

        <rect class="d-card is-hot" style="fill:#fdf1f0;stroke:#e1251b;stroke-width:1.6" x="556" y="470" width="252" height="74"></rect>
        <text class="d-t is-sm is-start is-hot" style="font-size:12.5px;font-weight:600;letter-spacing:-0.01em;fill:#e1251b;text-anchor:start" x="568" y="492">So we ask only when we must</text>
        <text class="d-fact is-start" style="font-size:10.5px;fill:#3a3a36;text-anchor:start" x="568" y="510">The live lane covers watching. But</text>
        <text class="d-fact is-start" style="font-size:10.5px;fill:#3a3a36;text-anchor:start" x="568" y="523">“which machines saw this error in</text>
        <text class="d-fact is-start" style="font-size:10.5px;fill:#3a3a36;text-anchor:start" x="568" y="536">run 561234?” has to ask all of them.</text>
      </svg>