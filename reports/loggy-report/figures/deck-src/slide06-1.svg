          <circle class="d-pulse" style="fill:#e1251b" r="3.4"><animateMotion dur="4.4s" repeatCount="indefinite" calcMode="linear" path="M540,106 H460 V128 H342" keyPoints="1;1;0;0" keyTimes="0;0.136;0.364;1"></animateMotion><animate attributeName="opacity" dur="4.4s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.136;0.141;0.364;0.369;1"></animate></circle>
          <circle class="d-pulse" style="fill:#e1251b" r="3.4"><animateMotion dur="4.4s" repeatCount="indefinite" calcMode="linear" path="M540,166 H460 V128 H342" keyPoints="1;1;0;0" keyTimes="0;0.136;0.364;1"></animateMotion><animate attributeName="opacity" dur="4.4s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.136;0.141;0.364;0.369;1"></animate></circle>
          <circle class="d-pulse" style="fill:#e1251b" r="3.4"><animateMotion dur="4.4s" repeatCount="indefinite" calcMode="linear" path="M540,76 H460 V128 H342" keyPoints="0;0;1;1" keyTimes="0;0.5;0.727;1"></animateMotion><animate attributeName="opacity" dur="4.4s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5;0.505;0.727;0.732;1"></animate></circle>
          <circle class="d-pulse" style="fill:#e1251b" r="3.4"><animateMotion dur="4.4s" repeatCount="indefinite" calcMode="linear" path="M540,106 H460 V128 H342" keyPoints="0;0;1;1" keyTimes="0;0.5;0.727;1"></animateMotion><animate attributeName="opacity" dur="4.4s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5;0.505;0.727;0.732;1"></animate></circle>
          <circle class="d-pulse" style="fill:#e1251b" r="3.4"><animateMotion dur="4.4s" repeatCount="indefinite" calcMode="linear" path="M540,166 H460 V128 H342" keyPoints="0;0;1;1" keyTimes="0;0.5;0.727;1"></animateMotion><animate attributeName="opacity" dur="4.4s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5;0.505;0.727;0.732;1"></animate></circle>
