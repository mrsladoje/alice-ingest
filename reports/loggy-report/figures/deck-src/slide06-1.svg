        <text class="d-s is-sm" style="font-size:10.5px;fill:#6b6b66;text-anchor:middle" x="84" y="140">(one saved pattern)</text>

        <path class="d-line" style="fill:none;stroke:#101010;stroke-width:1.25" d="M154,128 H176" marker-end="url(#mk05a)"></path>

        <rect class="d-card" style="fill:#ffffff;stroke:#101010;stroke-width:1.1" x="182" y="100" width="160" height="56"></rect>
        <text class="d-t is-sm" style="font-size:12.5px;font-weight:600;letter-spacing:-0.01em;fill:#101010;text-anchor:middle" x="262" y="122">Storage machine</text>
        <text class="d-s is-sm" style="font-size:10.5px;fill:#6b6b66;text-anchor:middle" x="262" y="140">collects the answers</text>

        <path class="d-line" style="fill:none;stroke:#101010;stroke-width:1.25" d="M540,76 H460 V128 H342" marker-start="url(#mk05a)" marker-end="url(#mk05a)"></path>
        <path class="d-line" style="fill:none;stroke:#101010;stroke-width:1.25" d="M540,106 H460 V128 H342" marker-start="url(#mk05a)" marker-end="url(#mk05a)"></path>
        <path class="d-line" style="fill:none;stroke:#101010;stroke-width:1.25" d="M540,166 H460 V128 H342" marker-start="url(#mk05a)" marker-end="url(#mk05a)"></path>

        <text class="d-fact is-start" style="font-size:10.5px;fill:#3a3a36;text-anchor:start" x="14" y="182">Dashboards sends the query to a storage machine.</text>
        <text class="d-fact is-start" style="font-size:10.5px;fill:#3a3a36;text-anchor:start" x="14" y="196">That machine asks the others and merges the answers.</text>

        <rect class="d-card" style="fill:#ffffff;stroke:#101010;stroke-width:1.1" x="546" y="64" width="260" height="24"></rect>
        <text class="d-ix is-start" style="font-family:Menlo, monospace;font-size:9.5px;letter-spacing:0.02em;fill:#101010;text-anchor:start" x="556" y="80">node-01</text>
        <text class="d-ix is-start" style="font-family:Menlo, monospace;font-size:9.5px;letter-spacing:0.02em;fill:#101010;text-anchor:start" x="646" y="80">local logs</text>

        <rect class="d-card" style="fill:#ffffff;stroke:#101010;stroke-width:1.1" x="546" y="94" width="260" height="24"></rect>
        <text class="d-ix is-start" style="font-family:Menlo, monospace;font-size:9.5px;letter-spacing:0.02em;fill:#101010;text-anchor:start" x="556" y="110">node-02</text>
        <text class="d-ix is-start" style="font-family:Menlo, monospace;font-size:9.5px;letter-spacing:0.02em;fill:#101010;text-anchor:start" x="646" y="110">local logs</text>

        <rect class="d-card" style="fill:#ffffff;stroke:#101010;stroke-width:1.1" x="546" y="124" width="260" height="84"></rect>
        <text class="d-ix is-start" style="font-family:Menlo, monospace;font-size:9.5px;letter-spacing:0.02em;fill:#101010;text-anchor:start" x="558" y="148">node-03</text>
        <text class="d-ix is-start" style="font-family:Menlo, monospace;font-size:9.5px;letter-spacing:0.02em;fill:#101010;text-anchor:start" x="558" y="166">node-04</text>
        <text class="d-ix is-start" style="font-family:Menlo, monospace;font-size:9.5px;letter-spacing:0.02em;fill:#101010;text-anchor:start" x="558" y="184">node-05</text>
        <text class="d-ix is-start" style="font-family:Menlo, monospace;font-size:9.5px;letter-spacing:0.02em;fill:#101010;text-anchor:start" x="646" y="159">storage part</text>
        <text class="d-ix is-start" style="font-family:Menlo, monospace;font-size:9.5px;letter-spacing:0.02em;fill:#101010;text-anchor:start" x="646" y="177">of the cluster</text>


        <g class="d-anim" style="display:none" aria-hidden="true">
          <rect class="d-flash" style="fill:#e1251b;opacity:0" x="546" y="64" width="260" height="24"><animate attributeName="opacity" dur="4.4s" repeatCount="indefinite" values="0;0;0.18;0.18;0;0" keyTimes="0;0.364;0.4;0.48;0.5;1"></animate></rect><rect class="d-flash" style="fill:#e1251b;opacity:0" x="546" y="94" width="260" height="24"><animate attributeName="opacity" dur="4.4s" repeatCount="indefinite" values="0;0;0.18;0.18;0;0" keyTimes="0;0.364;0.4;0.48;0.5;1"></animate></rect><rect class="d-flash" style="fill:#e1251b;opacity:0" x="546" y="124" width="260" height="84"><animate attributeName="opacity" dur="4.4s" repeatCount="indefinite" values="0;0;0.18;0.18;0;0" keyTimes="0;0.364;0.4;0.48;0.5;1"></animate></rect><rect class="d-flash" style="fill:#e1251b;opacity:0" x="182" y="100" width="160" height="56"><animate attributeName="opacity" dur="4.4s" repeatCount="indefinite" values="0;0;0.18;0.18;0;0" keyTimes="0;0.727;0.76;0.84;0.864;1"></animate></rect>
