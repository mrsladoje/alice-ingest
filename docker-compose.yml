services:
  opensearch:
    image: opensearchproject/opensearch:2.17.0
    ports:
      - 9200:9200
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms3g -Xmx3g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.17.0
    ports:
      - 5601:5601
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
        opensearch:
          condition: service_healthy

  dashboards-init:
    image: curlimages/curl:8.11.0
    restart: "no"
    environment:
      - OSD_URL=http://opensearch-dashboards:5601
      - OS_URL=http://opensearch:9200
    volumes:
      - ./init/dashboards:/init:ro
    entrypoint: ["sh", "/init/patterns.sh"]
    depends_on:
      opensearch:
        condition: service_healthy
      opensearch-dashboards:
        condition: service_started

  node-01:
    build:
      context: ./images/node
      dockerfile: ./Dockerfile
    ports:
      - 2020:2020
    environment:
      - NODE_ID=node-01
    volumes:
      - ./images/node/fluent-bit/collector.yaml:/etc/fluent-bit/collector.yaml:ro
      - ./images/node/fluent-bit/parsers.yaml:/etc/fluent-bit/parsers.yaml:ro
      - ./images/node/producers:/app/producers:ro
      - flb-storage:/var/log/flb-storage/
      - nodelogs:/var/log/node
    depends_on:
        opensearch:
          condition: service_healthy

  replay:
    build:
      context: ./images/replay
      dockerfile: ./Dockerfile
    ports:
      - 8088:8088
    environment:
      - AWS_PROFILE=cern_s3
      - AWS_SHARED_CREDENTIALS_FILE=/root/.aws/credentials
      - S3_ENDPOINT=https://s3.cern.ch
      - S3_BUCKET=epn-backup-logs
      - RUN_TAG=33NXirFsSfT_38917
      - INFOLOGGER_HOST=node-01
      - INFOLOGGER_TCP_PORT=5170
      - DDS_OUT_DIR=/var/log/node/dds
      - DDS_REPLAY_RATE=400
      - IL_REPLAY_RATE=500
      - DDS_MAX_OBJECTS=0
      - IL_MAX_OBJECTS=3
      - AUTOSTART_REPLAY=true
    volumes:
      - ${HOME}/.aws/credentials:/root/.aws/credentials:ro
      - nodelogs:/var/log/node
    depends_on:
      - node-01

volumes:
  osdata:
  flb-storage:
  nodelogs: