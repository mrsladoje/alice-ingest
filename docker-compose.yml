x-opensearch-node: &opensearch-node
  image: opensearchproject/opensearch:2.17.0
  ulimits:
    memlock:
      soft: -1
      hard: -1
    nofile:
      soft: 65536
      hard: 65536
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 60s

x-opensearch-env: &opensearch-env
  cluster.name: alice-logs
  discovery.seed_hosts: opensearch,opensearch-node2,opensearch-node3
  cluster.initial_cluster_manager_nodes: opensearch,opensearch-node2,opensearch-node3
  bootstrap.memory_lock: "true"
  DISABLE_SECURITY_PLUGIN: "true"
  OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g

services:
  opensearch:
    <<: *opensearch-node
    ports:
      - 9200:9200
    environment:
      <<: *opensearch-env
      node.name: opensearch
    volumes:
      - osdata:/usr/share/opensearch/data

  opensearch-node2:
    <<: *opensearch-node
    environment:
      <<: *opensearch-env
      node.name: opensearch-node2
    volumes:
      - osdata2:/usr/share/opensearch/data

  opensearch-node3:
    <<: *opensearch-node
    environment:
      <<: *opensearch-env
      node.name: opensearch-node3
    volumes:
      - osdata3:/usr/share/opensearch/data

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.17.0
    ports:
      - 5601:5601
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200","http://opensearch-node2:9200","http://opensearch-node3:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
        opensearch:
          condition: service_healthy

  opensearch-init:
    image: curlimages/curl:8.11.0
    restart: "no"
    environment:
      - OS_URL=http://opensearch:9200
    volumes:
      - ./init/opensearch:/init:ro
    entrypoint: ["sh", "/init/templates.sh"]
    depends_on:
      opensearch:
        condition: service_healthy

  dashboards-init:
    image: curlimages/curl:8.11.0
    restart: "no"
    environment:
      - OSD_URL=http://opensearch-dashboards:5601
      - OS_URL=http://opensearch:9200
    volumes:
      - ./init/dashboards:/init:ro
    entrypoint: ["sh", "/init/patterns.sh"]
    depends_on:
      opensearch:
        condition: service_healthy
      opensearch-dashboards:
        condition: service_started

  node-01: &collector
    build:
      context: ./images/node
      dockerfile: ./Dockerfile
    ports:
      - 2020:2020
    environment:
      - NODE_ID=node-01
    volumes:
      - ./images/node/fluent-bit/collector.yaml:/etc/fluent-bit/collector.yaml:ro
      - ./images/node/fluent-bit/parsers.yaml:/etc/fluent-bit/parsers.yaml:ro
      - ./images/node/producers:/app/producers:ro
      - nodelogs1:/var/log/node
      - flb-storage1:/var/log/flb-storage
    depends_on:
        opensearch:
          condition: service_healthy
        opensearch-init:
          condition: service_completed_successfully

  node-02:
    <<: *collector
    ports: 
      - 2021:2020
    environment:
      - NODE_ID=node-02
    volumes:
      - ./images/node/fluent-bit/collector.yaml:/etc/fluent-bit/collector.yaml:ro
      - ./images/node/fluent-bit/parsers.yaml:/etc/fluent-bit/parsers.yaml:ro
      - ./images/node/producers:/app/producers:ro
      - nodelogs2:/var/log/node
      - flb-storage2:/var/log/flb-storage

  node-03:
    <<: *collector
    ports:
      - 2022:2020
    environment:
      - NODE_ID=node-03
    volumes:
      - ./images/node/fluent-bit/collector.yaml:/etc/fluent-bit/collector.yaml:ro
      - ./images/node/fluent-bit/parsers.yaml:/etc/fluent-bit/parsers.yaml:ro
      - ./images/node/producers:/app/producers:ro
      - nodelogs3:/var/log/node
      - flb-storage3:/var/log/flb-storage

  replay:
    build:
      context: ./images/replay
      dockerfile: ./Dockerfile
    ports:
      - 8088:8088
    environment:
      - AWS_PROFILE=cern_s3
      - AWS_SHARED_CREDENTIALS_FILE=/root/.aws/credentials
      - S3_ENDPOINT=https://s3.cern.ch
      - S3_BUCKET=epn-backup-logs
      - RUN_TAG=33NXirFsSfT_38917
      - NODE_COUNT=3
      - NODES_ROOT=/var/log/nodes
      - INFOLOGGER_TCP_PORT=5170
      - DDS_REPLAY_RATE=400
      - IL_REPLAY_RATE=500
      - DDS_MAX_OBJECTS=0
      - IL_MAX_OBJECTS=3
      - AUTOSTART_REPLAY=true
      - AUTOSTART_MARKER=/var/log/nodes/node-01/.replay-autostart-done
    volumes:
      - ${HOME}/.aws/credentials:/root/.aws/credentials:ro
      - nodelogs1:/var/log/nodes/node-01
      - nodelogs2:/var/log/nodes/node-02
      - nodelogs3:/var/log/nodes/node-03
    depends_on:
      - node-01
      - node-02
      - node-03

volumes:
  osdata:
  osdata2:
  osdata3:
  nodelogs1:
  nodelogs2:
  nodelogs3:
  flb-storage1:
  flb-storage2:
  flb-storage3: