parsers: 
  - name: stdout_root
    format: regex
    regex: '(?m)^(?:(?<severity>Info|Warning|Error|Fatal|Sys) in <(?<facility>[^>]*)>: )?(?<message>.*)$'

  - name: dds_text
    format: regex
    regex: '(?m)^(?<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+)\s+(?<severity>\S+)\s+(?<source>\S+)\s+(?<tid><[^>]*>)\s+(?<message>.*)$'
    time_key: time
    time_format: '%Y-%m-%d %H:%M:%S.%L'

  - name: il_event_time
    format: regex
    regex: '^(?<epoch>.+)$'
    time_key: epoch
    time_format: '%s.%L'
